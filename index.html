irlik pasayadi, ayrim holatlarda esa ortadi.<\/p>\n<p>Adaptatsiya inson organizmining tashqi va ichki muhitga moslashishiga yordam beradi. U ko‘rish, eshitish, hid bilish, ta’m bilish va teri sezgilarida namoyon bo‘ladi.<\/p>\n<p>Sezgilar adaptatsiyasiga misollar<\/p>\n<ol><li value=\"1\">Ko‘rish adaptatsiyasi: Inson yorug‘ xonadan qorong‘i joyga kirganda dastlab hech narsani yaxshi ko‘rmaydi. Biroz vaqt o‘tgach, ko‘z qorong‘ilikka moslashadi va atrofdagi narsalar aniqroq ko‘rina boshlaydi.<\/li><li value=\"2\">Hid bilish adaptatsiyasi: Xonaga kirganda atir yoki boshqa kuchli hid darhol seziladi. Ammo bir necha daqiqadan so‘ng inson bu hidni avvalgidek kuchli sezmay qo‘yadi.<\/li><li value=\"3\">Eshitish adaptatsiyasi: Doimiy ishlayotgan soatning chiqillash ovozi dastlab seziladi, lekin vaqt o‘tishi bilan inson unga e’tibor bermay qo‘yadi.<\/li><li value=\"4\">Teri sezgisi adaptatsiyasi: Inson qo‘liga soat taqqanda dastlab uning og‘irligini yoki tegib turganini sezadi. Biroz vaqt o‘tgach, bu sezgi kamayadi.<\/li><li value=\"5\">Haroratga moslashish: Inson iliq suvga qo‘lini solganda dastlab suvning haroratini kuchli sezadi, ammo biroz vaqt o‘tgach, bu ta’sirga moslashadi.<\/li><\/ol>\n<p>Adaptatsiyaning ahamiyati<\/p>\n<ul><li>Organizmni doimiy ta’sirlarga moslashtiradi.<\/li><li>Sezgi organlarining ortiqcha zo‘riqishining oldini olishga yordam beradi.<\/li><li>Yangi va muhim ta’sirlarga e’tibor qaratish imkonini beradi.<\/li><li>Insonning atrof-muhitga moslashishini osonlashtiradi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Sezgilar adaptatsiyasi insonning tashqi muhitdagi o‘zgarishlarga moslashish jarayonidir. Uning natijasida ayrim sezgilar kuchayadi yoki susayadi. Bu jarayon inson hayotida muhim ahamiyatga ega bo‘lib, sezgi organlarining samarali faoliyat yuritishiga yordam beradi.<\/p>"}, {"n": 21, "title": "Sensibilizatsiya nima va u qanday namoyon bo‘ladi?", "html": "<p>Sensibilizatsiya — sezgi organlarining sezgirligi ortishi jarayonidir. Bunda inson ma’lum bir ta’sir natijasida tashqi muhitdagi kuchsiz qo‘zg‘atuvchilarni ham avvalgiga nisbatan yaxshiroq sezadigan bo‘ladi.<\/p>\n<p>Sensibilizatsiya adaptatsiyaga qarama-qarshi jarayon hisoblanadi. Adaptatsiyada ayrim ta’sirlarga nisbatan sezgirlik pasaysa, sensibilizatsiyada sezgirlik ortadi. Bu jarayon insonning tajribasi, mashq qilishi, faoliyati va boshqa sezgi organlarining ta’siri bilan bog‘liq bo‘lishi mumkin.<\/p>\n<p>Sensibilizatsiyaning namoyon bo‘lishiga misollar<\/p>\n<ol><li value=\"1\">Musiqachilarda: Musiqa bilan muntazam shug‘ullanadigan insonlar tovushlar orasidagi juda kichik farqlarni ham aniqlay oladilar. Ularning eshitish sezgirligi rivojlanadi.<\/li><li value=\"2\">Rassomlarda: Rassomlar ranglarning juda nozik farqlarini ajrata oladilar. Mashq qilish natijasida ularning ranglarni farqlash sezgirligi ortadi.<\/li><li value=\"3\">Oshpazlarda: Tajribali oshpazlar taomning ta’mini va hidini juda nozik farqlay oladilar. Bu ularning ta’m va hid bilish sezgirligi rivojlanganini ko‘rsatadi.<\/li><li value=\"4\">Ko‘zi ojiz insonlarda: Ayrim ko‘zi ojiz insonlar eshitish va teginish sezgilaridan juda samarali foydalanishni o‘rganadilar. Ular tovush va teginishdagi nozik farqlarni yaxshiroq ajrata olishlari mumkin.<\/li><\/ol>\n<p>Sensibilizatsiyaning yuzaga kelish omillari<\/p>\n<ul><li>Sezgi organlarini muntazam mashq qildirish.<\/li><li>Muayyan faoliyat bilan uzoq vaqt shug‘ullanish.<\/li><li>Insonning tajribasi va bilimlari.<\/li><li>Boshqa sezgi organlarining o‘zaro ta’siri.<\/li><li>Diqqat va qiziqishning kuchayishi.<\/li><\/ul>\n<p>Sensibilizatsiyaning ahamiyati<\/p>\n<p>Sensibilizatsiya insonning atrof-muhitni aniqroq idrok etishiga, turli ta’sirlarni farqlashiga va kasbiy ko‘nikmalarini rivojlantirishiga yordam beradi. Ayniqsa, musiqachilar, rassomlar, oshpazlar va boshqa mutaxassislar faoliyatida muhim ahamiyatga ega.<\/p>\n<h4>Xulosa<\/h4>\n<p>Sensibilizatsiya — sezgi organlari sezgirligining ortishidir. U mashq, tajriba va faoliyat davomida rivojlanishi mumkin. Ushbu jarayon insonning sezgi imkoniyatlarini takomillashtirib, tashqi muhitdagi ta’sirlarni yanada nozik va aniq farqlashiga yordam beradi.<\/p>"}, {"n": 22, "title": "Sinesteziya nima? Hayotiy misol keltiring.", "html": "<p>Sinesteziya — bir sezgi organiga ta’sir etuvchi qo‘zg‘atuvchi natijasida boshqa sezgi turiga xos qo‘shimcha sezgining ham paydo bo‘lishidir. Bunda bir sezgi ikkinchi sezgi bilan bog‘liq holda namoyon bo‘ladi.<\/p>\n<p>Sinesteziya insonning sezgi organlari o‘rtasidagi o‘zaro bog‘liqlikni ko‘rsatadi. U ayrim insonlarda tabiiy ravishda uchraydi, ba’zilarida esa badiiy tasavvur va obrazli fikrlashda namoyon bo‘lishi mumkin.<\/p>\n<p>Sinesteziyaga hayotiy misollar<\/p>\n<ol><li value=\"1\">Tovushni rang sifatida his qilish: Ayrim insonlar musiqa yoki tovushlarni eshitganda ularni muayyan ranglar bilan bog‘lab his qiladilar. Masalan, pianino ovozini eshitganda ko‘z oldida ko‘k rang paydo bo‘lishi mumkin.<\/li><li value=\"2\">Ranglarni ta’m bilan bog‘lash: Ba’zi insonlar muayyan ranglarni ko‘rganda ma’lum ta’mni his qilgandek bo‘ladilar. Masalan, sariq rang ularda limonning nordon ta’mini eslatadi.<\/li><li value=\"3\">Harflarni ranglarda ko‘rish: Ayrim insonlar har bir harf yoki raqamni o‘ziga xos rang bilan qabul qiladilar. Masalan, ular uchun “A” harfi doimo qizil rangda namoyon bo‘lishi mumkin.<\/li><li value=\"4\">Tovushni shakl bilan bog‘lash: Ayrim insonlar musiqa tinglaganda tovushlarni yumaloq, burchakli yoki boshqa shakllarda tasavvur qiladilar.<\/li><\/ol>\n<p>Sinesteziyaning ahamiyati<\/p>\n<ul><li>Sezgilar o‘rtasidagi o‘zaro bog‘liqlikni namoyon etadi.<\/li><li>Insonning individual idrok xususiyatlarini ko‘rsatadi.<\/li><li>Ayrim ijodiy faoliyatlarda obrazli tasavvurni boyitishi mumkin.<\/li><li>Insonlarning bir xil ta’sirni turlicha his qilishini tushunishga yordam beradi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Sinesteziya — bir sezgi ta’sirida boshqa sezgi turiga xos qo‘shimcha hisning paydo bo‘lishidir. Masalan, musiqani eshitganda ranglarni ko‘rish yoki harflarni muayyan ranglarda his qilish sinesteziyaga misol bo‘ladi. Bu hodisa inson sezgilarining o‘zaro murakkab bog‘liqligini ko‘rsatadi.<\/p>"}, {"n": 23, "title": "Idrok nima va uning sezgidan asosiy farqi nimada?", "html": "<p>Idrok — insonning sezgi organlari orqali tashqi olamdagi narsa va hodisalarni yaxlit holda aks ettirish jarayonidir. Idrok yordamida inson atrofidagi predmetlarning shakli, rangi, hajmi, tovushi, hidi va boshqa xususiyatlarini bir butun obraz sifatida qabul qiladi.<\/p>\n<p>Idrok sezgilar asosida yuzaga keladi, ammo u faqat alohida xususiyatlarni his qilish bilan cheklanmaydi. Unda insonning avvalgi tajribasi, bilimi, xotirasi va diqqati ham muhim rol o‘ynaydi.<\/p>\n<p>Idrokka misollar<\/p>\n<ol><li value=\"1\">Olmani ko‘rish: Inson olmani ko‘rganda uning qizil rangini, dumaloq shaklini va hajmini sezadi. Shu xususiyatlarni birlashtirib, uni yaxlit olma sifatida taniydi.<\/li><li value=\"2\">Musiqani tinglash: Inson musiqa eshitganda alohida tovushlarni emas, balki ularning birikmasidan hosil bo‘lgan kuy va ohangni idrok qiladi.<\/li><li value=\"3\">Insonni tanish: Biror kishining yuzini ko‘rish, ovozini eshitish va uning harakatlarini kuzatish orqali kimligini aniqlash mumkin.<\/li><\/ol>\n<p>Sezgi va idrokning asosiy farqlari<\/p>\n<p>Sezgi — predmet va hodisalarning alohida xususiyatlarini aks ettiradi.<\/p>\n<p>Idrok — predmet va hodisalarni yaxlit holda aks ettiradi.<\/p>\n<p>Sezgi| Idrok<\/p>\n<p>Narsaning alohida xususiyatlarini aks ettiradi.| Narsani yaxlit holda aks ettiradi. Rang, hid, ta’m, tovushni his qilish.| Narsa yoki hodisani bir butun obraz sifatida anglash. Idrokning tarkibiy asoslaridan biridir.| Sezgilar asosida shakllanadi.<\/p>\n<p>Idrokning asosiy xususiyatlari<\/p>\n<ul><li>Predmetlilik — narsalarni muayyan predmet sifatida qabul qilish.<\/li><li>Yaxlitlik — predmetning alohida qismlarini bir butun holda aks ettirish.<\/li><li>Konstantlik — sharoit o‘zgarganda ham predmetning ayrim xususiyatlarini nisbatan o‘zgarmas holda idrok qilish.<\/li><li>Ma’nolilik — idrok qilinayotgan narsani tushunish va anglash.<\/li><li>Tanlovchanlik — ko‘plab narsalar orasidan muhim bo‘lganiga e’tibor qaratish.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Sezgi va idrok bir-biri bilan chambarchas bog‘liq psixik jarayonlardir. Sezgi predmetlarning alohida xususiyatlarini aks ettirsa, idrok ularni birlashtirib, yaxlit obraz hosil qiladi. Masalan, olmaning rangini, hidini va ta’mini sezish — sezgi, uni yaxlit olma sifatida tanish esa idrok hisoblanadi.<\/p>"}, {"n": 24, "title": "Idrokning predmetliligi va yaxlitligi nimani anglatadi?", "html": "<p>Idrokning predmetliligi va yaxlitligi — idrokning muhim xususiyatlari bo‘lib, insonning atrofdagi narsa va hodisalarni qanday qabul qilishini ifodalaydi.<\/p>\n<h4>1. Idrokning predmetliligi<\/h4>\n<p>Predmetlilik — insonning sezgi organlari orqali qabul qilgan ma’lumotlarini muayyan predmet yoki hodisaga bog‘lab idrok etishidir. Ya’ni inson ko‘rayotgan, eshitayotgan yoki sezayotgan narsasini shunchaki rang, tovush yoki shakl sifatida emas, balki ma’lum bir predmet sifatida taniydi.<\/p>\n<p><strong>Misol:<\/strong> Inson uzoqdan dumaloq, qizil rangdagi narsani ko‘rsa, uni shunchaki rang va shakl sifatida emas, balki olma sifatida tanishi mumkin.<\/p>\n<ol><li value=\"2\">Idrokning yaxlitligi<\/li><\/ol>\n<p>Yaxlitlik — predmetning alohida qismlari va xususiyatlarini birlashtirib, uni butun holda idrok etish xususiyatidir. Bunda inson predmetning barcha qismlarini bir vaqtda ko‘rmasa ham, uning umumiy obrazini tasavvur qila oladi.<\/p>\n<p><strong>Misol:<\/strong> Inson daraxtga qaraganda uning tanasi, shoxlari, barglari va ildizlarini alohida qismlar sifatida emas, balki bitta yaxlit daraxt sifatida qabul qiladi.<\/p>\n<p>Ularning asosiy farqi<\/p>\n<ul><li>Predmetlilik — sezilgan xususiyatlarni muayyan predmetga bog‘lash va uni tanish.<\/li><li>Yaxlitlik — predmetning alohida qismlarini birlashtirib, uni butun holda qabul qilish.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Idrokning predmetliligi insonning narsalarni muayyan predmet sifatida tanishiga, yaxlitligi esa ularni barcha qismlari bilan bir butun holda qabul qilishiga yordam beradi. Ushbu xususiyatlar orqali inson atrof-muhitni to‘g‘ri anglaydi va undagi narsa-hodisalarni bir-biridan farqlaydi.<\/p>"}, {"n": 25, "title": "Idrokning konstantligi nima? Misol keltiring.", "html": "<p>Idrokning konstantligi — tashqi sharoitlar, masalan, masofa, yorug‘lik yoki kuzatish burchagi o‘zgarganida ham predmetlarning ayrim xususiyatlarini nisbatan o‘zgarmas holda idrok qilish xususiyatidir.<\/p>\n<p>Ya’ni inson predmetni turli sharoitlarda kuzatsa ham, uning haqiqiy shakli, hajmi va rangini avvalgidek qabul qilishga moyil bo‘ladi.<\/p>\n<p>Idrok konstantligiga misollar<\/p>\n<ol><li value=\"1\">Hajm konstantligi: Uzoqda turgan inson ko‘zimizga kichikroq ko‘rinadi, ammo biz uni haqiqatan ham kichrayib qolgan deb hisoblamaymiz. Uning asl hajmi o‘zgarmaganini anglaymiz.<\/li><li value=\"2\">Shakl konstantligi: Dumaloq likopchaga yon tomondan qaraganimizda u biroz oval shaklda ko‘rinadi. Shunga qaramay, biz uning aslida dumaloq ekanini bilamiz.<\/li><li value=\"3\">Rang konstantligi: Oq qog‘oz quyosh nurida ham, biroz sarg‘ish xona yorug‘ligida ham ko‘rinishi mumkin. Lekin inson uni oq rangli qog‘oz sifatida idrok qilishda davom etadi.<\/li><li value=\"4\">Hajm va masofa munosabati: Uzoqdan kelayotgan avtomobil dastlab kichik ko‘rinadi, yaqinlashgan sari kattalashib boradi. Inson esa avtomobilning haqiqiy hajmi o‘zgarmaganini tushunadi.<\/li><\/ol>\n<p>Idrok konstantligining ahamiyati<\/p>\n<ul><li>Atrofdagi predmetlarni to‘g‘ri tanishga yordam beradi.<\/li><li>Tashqi sharoitlarning o‘zgarishiga qaramay, narsalarni barqaror idrok qilish imkonini beradi.<\/li><li>Insonning makonda mo‘ljal olishiga yordam beradi.<\/li><li>Kundalik hayotda predmetlarning xususiyatlarini anglashni osonlashtiradi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Idrok konstantligi — predmetlarning tashqi ko‘rinishi sharoitga qarab o‘zgargandek tuyulsa ham, ularning haqiqiy xususiyatlarini nisbatan o‘zgarmas holda qabul qilishdir. Bu xususiyat insonning atrof-muhitni to‘g‘ri va barqaror idrok etishida muhim ahamiyatga ega.<\/p>"}, {"n": 26, "title": "Idrokning tanlovchanligi va mazmunliligi", "html": "<p>Idrokning tanlovchanligi — insonning atrof-muhitdagi barcha narsa va hodisalarni bir xil darajada idrok etmasdan, balki o‘z ehtiyoji, qiziqishi, maqsadi, tajribasi va diqqatiga mos keladigan obyektlarni ajratib idrok etish xususiyatidir. Inson bir vaqtning o‘zida juda ko‘p axborot va taassurotlarga duch keladi, ammo ularning barchasiga bir xil e’tibor bera olmaydi. Shu sababli u o‘zi uchun muhim bo‘lgan narsa va hodisalarga ko‘proq diqqat qaratadi.<\/p>\n<p>Idrokning tanlovchanligi quyidagi holatlarda namoyon bo‘ladi:<\/p>\n<ol><li value=\"1\">Inson o‘ziga qiziq bo‘lgan narsalarni boshqalarga qaraganda tezroq payqaydi.<\/li><li value=\"2\">Muayyan maqsad bilan kuzatilayotgan obyektlar aniqroq idrok qilinadi.<\/li><li value=\"3\">Insonning kasbi, bilimi va hayotiy tajribasi idrok qilayotgan narsalarini tanlashga ta’sir ko‘rsatadi.<\/li><li value=\"4\">Bir xil hodisani turli odamlar o‘z qiziqishi va bilimiga qarab turlicha idrok etishi mumkin.<\/li><\/ol>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Futbol ishqibozi futbol uchrashuvini tomosha qilganda ko‘proq to‘p va futbolchilarning harakatiga e’tibor beradi, hakam esa qoidabuzarliklarni kuzatadi.<\/li><li>Musiqa bilan shug‘ullanuvchi inson qo‘shiq tinglaganda uning ohangi, ritmi va ovoziga e’tibor qaratadi.<\/li><li>O‘qituvchi sinfga kirganda o‘quvchilarning darsga munosabati va faolligini kuzatadi, o‘quvchi esa o‘qituvchining tushuntirishiga e’tibor beradi.<\/li><\/ul>\n<p>Idrokning mazmunliligi — insonning idrok qilayotgan narsa va hodisalarini shunchaki ko‘rish, eshitish yoki sezish bilan cheklanmay, ularning mohiyatini tushunishi, ma’no va mazmunini anglashidir. Bunda inson yangi idrok qilayotgan ma’lumotlarini avvalgi bilimlari, tajribasi va tushunchalari bilan bog‘laydi. Natijada predmet yoki hodisaning nima ekanligi, qanday vazifani bajarishi va qanday ahamiyatga ega ekanligini tushunadi.<\/p>\n<p>Idrokning mazmunliligi quyidagi xususiyatlarda namoyon bo‘ladi:<\/p>\n<ol><li value=\"1\">Inson idrok qilayotgan obyektni ma’lum tushuncha va bilimlar asosida anglaydi.<\/li><li value=\"2\">Yangi ma’lumotlar avvalgi bilim va tajribalar bilan taqqoslanadi.<\/li><li value=\"3\">Predmet va hodisalarning tashqi ko‘rinishigina emas, balki ichki mohiyati ham tushuniladi.<\/li><li value=\"4\">Idrok qilingan narsa va hodisalarga ma’no beriladi hamda ular nomlanadi.<\/li><\/ol>\n<h4>Misollar:<\/h4>\n<ul><li>Shifokor rentgen tasviriga qarab inson organizmidagi o‘zgarishlarni aniqlaydi. Chunki u tibbiy bilim va tajribaga ega.<\/li><li>Tajribali haydovchi yo‘ldagi belgilarni ko‘rishi bilan ularning ma’nosini tushunadi va qanday harakat qilish kerakligini anglaydi.<\/li><li>O‘quvchi kitobdagi matnni o‘qiganda faqat harflarni ko‘rmaydi, balki so‘zlar, gaplar va ularning umumiy mazmunini tushunadi.<\/li><li>Tajribali rassom oddiy tabiat manzarasida ranglar uyg‘unligi, yorug‘lik va soya munosabatlarini anglaydi.<\/li><\/ul>\n<p>Idrokning tanlovchanligi va mazmunliligi o‘rtasidagi farq:<\/p>\n<p>Tanlovchanlik insonning atrofdagi ko‘plab narsa va hodisalar orasidan qaysi biriga e’tibor qaratishini belgilaydi. Mazmunlilik esa tanlangan va idrok qilingan obyektning mohiyati hamda ma’nosini tushunishni anglatadi.<\/p>\n<p>Masalan, talaba dars jarayonida o‘qituvchining tushuntirishiga e’tibor qaratishi idrokning tanlovchanligi bo‘lsa, tushuntirilgan mavzuni anglab, uni avvalgi bilimlari bilan bog‘lashi idrokning mazmunliligidir.<\/p>\n<p><strong>Xulosa:<\/strong> Idrokning tanlovchanligi va mazmunliligi insonning atrof-muhitni to‘g‘ri va ongli ravishda anglashida muhim ahamiyatga ega. Tanlovchanlik muhim axborotni ajratishga yordam beradi, mazmunlilik esa ushbu axborotning mohiyatini tushunish va undan foydalanish imkonini beradi.<\/p>"}, {"n": 27, "title": "Appersepsiya va uning idrokka ta’siri", "html": "<p>Appersepsiya — bu insonning narsa va hodisalarni idrok etish jarayonining uning avvalgi bilimlari, hayotiy tajribasi, dunyoqarashi, qiziqishlari, ehtiyojlari va ruhiy holatiga bog‘liqligidir. Boshqacha aytganda, inson atrof-muhitdagi voqea-hodisalarni shunchaki ko‘rib yoki eshitib qolmaydi, balki ularni o‘zining mavjud bilim va tajribasi asosida tushunadi va baholaydi.<\/p>\n<p>Appersepsiya idrok jarayoniga quyidagi yo‘llar bilan ta’sir qiladi:<\/p>\n<ol><li value=\"1\">Avvalgi bilim va tajriba ta’siri. Inson yangi ma’lumotni ilgari egallagan bilimlari bilan taqqoslab idrok qiladi. Masalan, tajribali shifokor bemorning ayrim belgilariga qarab kasallikni aniqlashi mumkin, oddiy odam esa bu belgilarni to‘liq tushunmasligi mumkin.<\/li><li value=\"2\">Qiziqish va ehtiyojlar ta’siri. Inson o‘zi qiziqqan yoki ehtiyoj sezgan narsalarni boshqalarga qaraganda tezroq va yaxshiroq idrok qiladi. Masalan, futbolga qiziqqan inson ko‘chada futbol to‘pi yoki futbol maydonini tezroq payqaydi.<\/li><li value=\"3\">Dunyoqarash va e’tiqod ta’siri. Bir xil voqea yoki hodisa turli dunyoqarashga ega insonlar tomonidan turlicha baholanishi mumkin. Masalan, biror yangilikni optimistik inson ijobiy tomondan, pessimistik inson esa salbiy tomondan qabul qilishi mumkin.<\/li><li value=\"4\">Ruhiy holat va hissiyotlar ta’siri. Insonning kayfiyati, qo‘rquvi, quvonchi yoki xavotiri idrok mazmunini o‘zgartirishi mumkin. Masalan, qo‘rqib turgan odam qorong‘ida oddiy daraxt soyasini ham xavfli narsa deb qabul qilishi mumkin.<\/li><li value=\"5\">Kasbiy bilim va tajriba ta’siri. Inson o‘z kasbiga oid narsalarni boshqalarga qaraganda chuqurroq idrok qiladi. Masalan, musiqachi qo‘shiqdagi ohang, ritm va tovush farqlarini yaxshi ajratadi, rassom esa ranglar va tasviriy uyg‘unlikka ko‘proq e’tibor beradi.<\/li><\/ol>\n<p>Appersepsiyaning asosiy turlari:<\/p>\n<ol><li value=\"1\">Barqaror appersepsiya — insonning uzoq vaqt davomida shakllangan bilimlari, dunyoqarashi, qiziqishlari va hayotiy tajribasi asosida idrok qilishidir.<\/li><li value=\"2\">Vaqtinchalik appersepsiya — insonning ayni paytdagi ruhiy holati, kayfiyati, hissiyotlari va vaziyatga bog‘liq holda idrok qilishidir.<\/li><\/ol>\n<p>Appersepsiyaning idrokdagi ahamiyati:<\/p>\n<p>Appersepsiya idrokning mazmunli, ongli va individual bo‘lishini ta’minlaydi. U insonning yangi axborotni tushunishi, avvalgi tajribasi bilan bog‘lashi, voqea-hodisalarni baholashi va ularga munosabat bildirishiga yordam beradi. Shu sababli bir xil predmet yoki hodisa turli insonlar tomonidan turlicha idrok qilinishi mumkin.<\/p>\n<p><strong>Xulosa:<\/strong> Appersepsiya — idrokning insonning avvalgi bilimlari, tajribasi, dunyoqarashi va hozirgi ruhiy holatiga bog‘liqligidir. U idrok jarayoniga ta’sir qilib, har bir insonning atrof-muhitni o‘ziga xos tarzda tushunishi va baholashiga sabab bo‘ladi<\/p>"}, {"n": 28, "title": "Fazo, vaqt va harakatni idrok etish", "html": "<p>Inson atrof-muhitdagi narsa va hodisalarni idrok etishda ularning faqat tashqi ko‘rinishi va xususiyatlarini emas, balki fazodagi joylashuvi, vaqt davomida o‘zgarishi va harakatlanishini ham anglaydi. Psixologiyada fazo, vaqt va harakatni idrok etish idrokning muhim shakllari hisoblanadi.<\/p>\n<h4>1. Fazoni idrok etish<\/h4>\n<p>Fazoni idrok etish — predmet va hodisalarning shakli, hajmi, kattaligi, masofasi, yo‘nalishi hamda bir-biriga nisbatan joylashuvini ongda aks ettirish jarayonidir.<\/p>\n<p>Fazoni idrok etishda ko‘rish, eshitish, teri-tuyush va harakat sezgilari muhim rol o‘ynaydi. Ayniqsa, ko‘rish analizatori orqali predmetlarning shakli, rangi, hajmi va uzoqligi aniqlanadi. Ikki ko‘z bilan ko‘rish (binokulyar ko‘rish) masofani va chuqurlikni aniqlashga yordam beradi.<\/p>\n<p>Fazoni idrok etishga misollar:<\/p>\n<ul><li>Inson ko‘cha bo‘ylab harakatlanayotganda binolar, daraxtlar va yo‘lning bir-biriga nisbatan joylashuvini aniqlaydi.<\/li><li>Haydovchi avtomobil boshqarayotganda boshqa mashinalargacha bo‘lgan masofani chamalaydi.<\/li><li>O‘quvchi sinfxonaga kirganda partalar, doska va boshqa buyumlarning joylashuvini anglaydi.<\/li><\/ul>\n<h4>2. Vaqtni idrok etish<\/h4>\n<p>Vaqtni idrok etish — hodisa va jarayonlarning davomiyligi, tezligi, ketma-ketligi hamda vaqt jihatidan almashinishini ongda aks ettirish jarayonidir.<\/p>\n<p>Inson vaqtni bevosita ko‘z bilan ko‘rmaydi, balki hodisalarning davom etishi, takrorlanishi va almashinishiga qarab anglaydi. Vaqtni idrok etishda xotira, diqqat, hissiyot va insonning faoliyati muhim ahamiyatga ega.<\/p>\n<p>Vaqtni idrok etishga misollar:<\/p>\n<ul><li>Qiziqarli film tomosha qilayotgan inson vaqt tez o‘tib ketgandek his qiladi.<\/li><li>Zerikarli ma’ruza tinglayotgan talaba vaqt juda sekin o‘tayotgandek taassurotga ega bo‘ladi.<\/li><li>Inson soatga qarab ishning boshlanishi va tugash vaqtini aniqlaydi.<\/li><li>Bola kun va tun almashinishini kuzatib, vaqtning o‘tishini anglaydi.<\/li><\/ul>\n<p>Vaqtni idrok etish insonning ruhiy holati va faoliyatiga qarab o‘zgarishi mumkin. Masalan, qo‘rquv yoki xavotir holatida bir necha daqiqa juda uzoq davom etayotgandek tuyulishi mumkin.<\/p>\n<h4>3. Harakatni idrok etish<\/h4>\n<p>Harakatni idrok etish — predmet va hodisalarning fazoda joylashuvi va vaqt davomida o‘zgarishini, ya’ni bir joydan ikkinchi joyga ko‘chishini yoki holatini o‘zgartirishini ongda aks ettirish jarayonidir.<\/p>\n<p>Harakatni idrok etishda ko‘rish analizatori, mushak-harakat sezgilari va vestibulyar apparat muhim rol o‘ynaydi. Inson predmetning qaysi yo‘nalishda, qanday tezlikda va qanday masofada harakatlanayotganini aniqlaydi.<\/p>\n<p>Harakatni idrok etishga misollar:<\/p>\n<ul><li>Futbol o‘yinida tomoshabin to‘pning qaysi tomonga va qanday tezlikda harakatlanayotganini kuzatadi.<\/li><li>Haydovchi yo‘lda harakatlanayotgan avtomobilning tezligi va yo‘nalishini aniqlaydi.<\/li><li>Osmonda uchayotgan qushning harakatini kuzatib, uning qaysi tomonga uchayotganini bilish mumkin.<\/li><li>Inson yurish yoki yugurish vaqtida o‘z tanasining harakatini mushak sezgilari orqali anglaydi.<\/li><\/ul>\n<p>Harakatni idrok etish haqiqiy harakatni kuzatish orqali yoki ketma-ket almashinadigan tasvirlar yordamida ham yuzaga kelishi mumkin. Masalan, kinofilmlarda alohida kadrlarning tez almashinishi uzluksiz harakat taassurotini hosil qiladi.<\/p>\n<p><strong>Xulosa:<\/strong> Fazoni idrok etish predmetlarning qayerda joylashganini, vaqtni idrok etish hodisalarning qancha davom etishi va qanday ketma-ketlikda sodir bo‘lishini, harakatni idrok etish esa predmetlarning fazoda qanday yo‘nalish va tezlikda o‘zgarishini anglash imkonini beradi. Bu uchala idrok shakli insonning atrof-muhitga moslashishi, harakatlanishi va kundalik faoliyatini to‘g‘ri tashkil etishida muhim ahamiyatga ega.<\/p>"}, {"n": 29, "title": "Illyuziya va uning gallyutsinatsiyadan farqi", "html": "<p>Illyuziya — mavjud bo‘lgan real narsa va hodisalarni noto‘g‘ri, buzib yoki yanglish idrok etish jarayonidir. Bunda inson atrof-muhitda haqiqatan mavjud bo‘lgan predmet yoki hodisani boshqa narsa sifatida qabul qiladi. Illyuziya ko‘pincha yorug‘lik, tovush, masofa, diqqat, charchoq, qo‘rquv va hissiy holat ta’sirida yuzaga keladi.<\/p>\n<p>Illyuziyaning asosiy xususiyatlari:<\/p>\n<ol><li value=\"1\">Idrok qilinayotgan predmet yoki hodisa haqiqatda mavjud bo‘ladi.<\/li><li value=\"2\">Inson mavjud predmetni noto‘g‘ri talqin qiladi.<\/li><li value=\"3\">Noto‘g‘ri idrok tashqi sharoit yoki ruhiy holat ta’sirida yuzaga kelishi mumkin.<\/li><li value=\"4\">Vaziyat oydinlashganda yoki diqqat bilan kuzatilganda xato idrok bartaraf bo‘lishi mumkin.<\/li><\/ol>\n<p>Illyuziyaga misollar:<\/p>\n<ul><li>Qorong‘i xonada osilib turgan kiyimni odam deb o‘ylash.<\/li><li>Uzoqdan kelayotgan daraxtni inson silueti sifatida qabul qilish.<\/li><li>Issiq havoda asfalt yo‘l ustida suv bordek ko‘rinishi.<\/li><li>Shamol ta’sirida shitirlayotgan daraxt barglarini kimningdir qadami deb o‘ylash.<\/li><li>Suvga solingan to‘g‘ri tayoqning singandek yoki egilgandek ko‘rinishi.<\/li><\/ul>\n<p>Gallyutsinatsiya — tashqi muhitda mavjud bo‘lmagan narsa va hodisalarni inson tomonidan haqiqatdagidek idrok etishidir. Bunda inson aslida mavjud bo‘lmagan tovushlarni eshitishi, narsalarni ko‘rishi, hidlarni sezishi yoki boshqa sezgilarni boshdan kechirishi mumkin.<\/p>\n<p>Gallyutsinatsiyaning asosiy xususiyatlari:<\/p>\n<ol><li value=\"1\">Idrok qilinayotgan obyekt tashqi muhitda mavjud bo‘lmaydi.<\/li><li value=\"2\">Inson mavjud bo‘lmagan tovush, tasvir yoki boshqa sezgilarni haqiqatdagidek qabul qiladi.<\/li><li value=\"3\">Ko‘rish, eshitish, hid bilish, ta’m bilish va teri sezgilari bilan bog‘liq shakllarda namoyon bo‘lishi mumkin.<\/li><li value=\"4\">Turli ruhiy va nevrologik kasalliklar, ayrim moddalar ta’siri yoki boshqa tibbiy holatlarda kuzatilishi mumkin.<\/li><\/ol>\n<p>Gallyutsinatsiyaga misollar:<\/p>\n<ul><li>Xonada hech kim bo‘lmasa ham, inson kimdir o‘z ismini aytib chaqirayotganini eshitishi.<\/li><li>Atrofda hech qanday odam yoki predmet bo‘lmasa ham, inson odamlarni yoki turli obrazlarni ko‘rishi.<\/li><li>Hech qanday manba bo‘lmasa ham, tutun yoki kuygan hidni sezishi.<\/li><li>Hech kim tegmagan bo‘lsa ham, tanasida kimdir tegayotgandek yoki hasharotlar yurayotgandek his qilishi.<\/li><\/ul>\n<p>Illyuziya va gallyutsinatsiyaning asosiy farqlari:<\/p>\n<ol><li value=\"1\">Illyuziyada real predmet yoki hodisa mavjud bo‘ladi, gallyutsinatsiyada esa idrok qilinayotgan obyekt tashqi muhitda mavjud bo‘lmaydi.<\/li><li value=\"2\">Illyuziyada mavjud narsa noto‘g‘ri idrok qilinadi, gallyutsinatsiyada esa mavjud bo‘lmagan narsa haqiqatdagidek idrok etiladi.<\/li><li value=\"3\">Illyuziya sog‘lom odamlarda ham, masalan, qorong‘ilikda yoki charchoq holatida kuzatilishi mumkin. Gallyutsinatsiya esa ko‘pincha tibbiy yoki ruhiy holatlar bilan bog‘liq bo‘ladi.<\/li><\/ol>\n<p>Oddiy taqqoslash:<\/p>\n<ul><li>Illyuziya: qorong‘ida turgan kiyimni odam deb o‘ylash.<\/li><li>Gallyutsinatsiya: xonada hech kim bo‘lmasa ham, odamni ko‘rayotgandek bo‘lish.<\/li><\/ul>\n<p><strong>Xulosa:<\/strong> Illyuziya — mavjud narsalarni noto‘g‘ri idrok etish, gallyutsinatsiya esa tashqi muhitda mavjud bo‘lmagan narsalarni haqiqatdagidek idrok etishdir. Ularning asosiy farqi idrok qilinayotgan obyektning real mavjud yoki mavjud emasligidadir.<\/p>"}, {"n": 30, "title": "Xayol va uning asosiy vazifalari", "html": "<p>Xayol — inson ongida ilgari idrok qilingan narsa va hodisalar asosida yangi obrazlar, tasavvurlar va g‘oyalarni yaratish jarayonidir. Xayol insonning avvalgi bilimlari, tajribasi, xotirasi va tafakkuriga asoslanadi. Inson xayol yordamida hali mavjud bo‘lmagan narsalarni tasavvur qilishi, kelajakdagi voqealarni oldindan ko‘z oldiga keltirishi va yangi g‘oyalarni yaratishi mumkin.<\/p>\n<p>Masalan, me’mor hali qurilmagan binoning loyihasini tasavvur qiladi, yozuvchi o‘z asaridagi qahramonlar va voqealarni xayolida yaratadi, talaba esa kelajakdagi kasbiy faoliyatini ko‘z oldiga keltiradi.<\/p>\n<p>Xayolning asosiy xususiyatlari:<\/p>\n<ol><li value=\"1\">Xayol avvalgi bilim va tajribalar asosida shakllanadi.<\/li><li value=\"2\">Inson ongida yangi obraz va tasavvurlarni yaratadi.<\/li><li value=\"3\">Kelajakdagi voqea va hodisalarni oldindan tasavvur qilish imkonini beradi.<\/li><li value=\"4\">Ijodkorlik va yangilik yaratish jarayonida muhim rol o‘ynaydi.<\/li><li value=\"5\">Insonning hissiyotlari, ehtiyojlari va qiziqishlari bilan bog‘liq bo‘ladi.<\/li><\/ol>\n<p>Xayolning asosiy vazifalari:<\/p>\n<ol><li value=\"1\">Obraz yaratish vazifasi. Xayol inson ongida ilgari mavjud bo‘lmagan yangi obrazlarni shakllantiradi. Masalan, rassom o‘z tasavvuriga asoslanib yangi surat yaratadi.<\/li><li value=\"2\">Oldindan ko‘ra bilish vazifasi. Inson kelajakda sodir bo‘lishi mumkin bo‘lgan voqealarni oldindan tasavvur qiladi va ularga tayyorgarlik ko‘radi. Masalan, talaba imtihonga tayyorlanayotganda imtihon jarayonini ko‘z oldiga keltiradi.<\/li><li value=\"3\">Ijodiy faoliyatni ta’minlash vazifasi. Xayol yangi g‘oyalar, ixtirolar, san’at asarlari va loyihalarni yaratishga yordam beradi. Masalan, olim yangi texnologiya yoki qurilmaning ishlash tamoyilini avval xayolida tasavvur qiladi.<\/li><li value=\"4\">Muammolarni hal qilish vazifasi. Xayol insonning turli muammolarga noodatiy yechim topishiga yordam beradi. Masalan, muhandis murakkab qurilmani yaratishdan oldin uning tuzilishini fikran loyihalashtiradi.<\/li><li value=\"5\">Hissiy holatni boshqarish vazifasi. Xayol insonning ruhiy holatiga ta’sir ko‘rsatadi, unga umid, ishonch va ruhiy dalda beradi. Masalan, qiyin vaziyatga tushgan inson kelajakdagi yaxshi kunlarni tasavvur qilib, o‘ziga dalda oladi.<\/li><li value=\"6\">Faoliyatni rejalashtirish vazifasi. Inson biror ishni boshlashdan oldin uning qanday amalga oshishini xayolida tasavvur qiladi. Masalan, sportchi musobaqadan oldin o‘z harakatlari va bajaradigan mashqlarini ko‘z oldiga keltiradi.<\/li><\/ol>\n<p>Xayolning asosiy turlari:<\/p>\n<ol><li value=\"1\">Ixtiyorsiz xayol — insonning maxsus maqsad va harakatlarisiz, o‘z-o‘zidan yuzaga keladigan xayol. Masalan, odam musiqa tinglayotganda turli manzaralarni ko‘z oldiga keltirishi.<\/li><li value=\"2\">Ixtiyoriy xayol — insonning ongli ravishda, ma’lum maqsad asosida obraz va tasavvurlar yaratishi. Masalan, talabaning kelajakdagi ilmiy ishini rejalashtirishi.<\/li><li value=\"3\">Qayta tiklovchi xayol — insonning so‘z, matn, chizma yoki tasvir asosida ilgari ko‘rmagan narsalarni tasavvur qilishi. Masalan, kitobdagi tabiat tasvirini o‘qib, uni ko‘z oldiga keltirish.<\/li><li value=\"4\">Ijodiy xayol — insonning mavjud bilim va tajribalarini yangicha birlashtirib, original obrazlar va g‘oyalar yaratishi. Masalan, yozuvchining yangi roman qahramonini yaratishi yoki ixtirochining yangi qurilma loyihasini ishlab chiqishi.<\/li><\/ol>\n<p>Xayolning inson hayotidagi ahamiyati:<\/p>\n<p>Xayol insonning o‘qishi, mehnat qilishi, ijodiy faoliyati va kelajakni rejalashtirishida muhim ahamiyatga ega. Xayolsiz ilmiy kashfiyotlar, texnik ixtirolar, san’at asarlari va ko‘plab yangiliklarni yaratish qiyin. Xayol tafakkur bilan chambarchas bog‘liq bo‘lib, insonning muammolarga yangicha yondashishi va imkoniyatlarni oldindan tasavvur qilishiga yordam beradi.<\/p>\n<p><strong>Xulosa:<\/strong> Xayol — inson ongida yangi obraz va tasavvurlar yaratish jarayoni bo‘lib, uning asosiy vazifalari yangi g‘oyalarni shakllantirish, kelajakni oldindan tasavvur qilish, ijodkorlikni rivojlantirish, muammolarni hal qilish va faoliyatni rejalashtirishdan iborat.<\/p>"}, {"n": 31, "title": "Xayolning xotira va tafakkur bilan aloqasi", "html": "<p>Xayol, xotira va tafakkur insonning bilish jarayonlari hisoblanadi. Ular bir-biri bilan chambarchas bog‘liq bo‘lib, insonning atrof-muhitni anglashida, yangi bilimlarni egallashida, muammolarni hal qilishida va ijodiy faoliyatida muhim rol o‘ynaydi.<\/p>\n<h4>1. Xayolning xotira bilan aloqasi<\/h4>\n<p>Xotira — insonning ilgari idrok qilgan narsa va hodisalarini esda olib qolish, saqlash va qayta esga tushirish jarayonidir.<\/p>\n<p>Xayol esa xotirada saqlanayotgan obrazlar, bilimlar va tajribalar asosida yangi obraz va tasavvurlarni yaratadi. Ya’ni xayol yangi obrazlarni yaratish uchun xotiradagi ma’lumotlardan foydalanadi.<\/p>\n<p>Ularning o‘zaro aloqasi quyidagicha namoyon bo‘ladi:<\/p>\n<ol><li value=\"1\">Xotira xayol uchun zarur bo‘lgan dastlabki materialni taqdim etadi.<\/li><li value=\"2\">Xayol xotirada saqlangan obrazlarni o‘zgartiradi, birlashtiradi va yangicha shaklda tasavvur qiladi.<\/li><li value=\"3\">Insonning hayotiy tajribasi va bilimlari qanchalik boy bo‘lsa, uning xayol qilish imkoniyatlari ham shunchalik keng bo‘ladi.<\/li><\/ol>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Odam ilgari ko‘rgan tog‘lar, daryolar va o‘rmonlar obrazlarini xotirasida saqlaydi. Keyinchalik ularni birlashtirib, o‘zi hech qachon ko‘rmagan yangi tabiat manzarasini xayolida yaratishi mumkin.<\/li><li>Yozuvchi hayotda uchratgan insonlarining xarakter xususiyatlarini eslab, ularni birlashtirish orqali yangi badiiy qahramon yaratadi.<\/li><li>Talaba ilgari o‘rgangan bilimlari asosida kelajakdagi ilmiy ishining mazmunini tasavvur qiladi.<\/li><\/ul>\n<h4>2. Xayolning tafakkur bilan aloqasi<\/h4>\n<p>Tafakkur — insonning narsa va hodisalar o‘rtasidagi muhim bog‘lanishlar, munosabatlar va qonuniyatlarni umumlashtirib, bilvosita hamda umumlashgan holda aks ettirish jarayonidir.<\/p>\n<p>Xayol tafakkur bilan birgalikda ishlaydi. Tafakkur muammoni tahlil qilish, sabab va oqibatlarni aniqlash hamda mantiqiy xulosalar chiqarishga yordam beradi. Xayol esa muammoning mumkin bo‘lgan yechimlarini tasavvur qilish va yangi g‘oyalarni yaratish imkonini beradi.<\/p>\n<p>Ularning aloqasi quyidagicha namoyon bo‘ladi:<\/p>\n<ol><li value=\"1\">Tafakkur xayol yaratgan obrazlarni tahlil qilish va baholashga yordam beradi.<\/li><li value=\"2\">Xayol tafakkur uchun yangi g‘oyalar va yechimlar yaratadi.<\/li><li value=\"3\">Tafakkur va xayol birgalikda ijodiy muammolarni hal qilishga xizmat qiladi.<\/li><li value=\"4\">Xayol kelajakdagi natijalarni tasavvur qilishga, tafakkur esa ularning amalga oshish imkoniyatini baholashga yordam beradi.<\/li><\/ol>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Muhandis yangi avtomobil yaratishni rejalashtirganda, avval uning ko‘rinishi va tuzilishini xayolida tasavvur qiladi. Keyin tafakkur yordamida uning texnik imkoniyatlari, xavfsizligi va ishlash mexanizmini hisoblaydi.<\/li><li>Me’mor yangi bino loyihasini yaratishda uning tashqi ko‘rinishini xayol qiladi, tafakkur orqali esa qurilish materiallari, o‘lchamlari va mustahkamligini hisobga oladi.<\/li><li>O‘quvchi matematik masalani yechishda avval masalaning shartini tahlil qiladi, so‘ng yechimni xayolida tasavvur qilib, mantiqiy fikrlash orqali to‘g‘ri javobni topadi.<\/li><\/ul>\n<h4>3. Xayol, xotira va tafakkurning o‘zaro bog‘liqligi<\/h4>\n<p>Ushbu uchta psixik jarayon bir-birini to‘ldiradi:<\/p>\n<ul><li>Xotira — ilgari olingan bilim va tajribalarni saqlaydi.<\/li><li>Xayol — saqlangan bilim va tajribalar asosida yangi obrazlar yaratadi.<\/li><li>Tafakkur — narsa va hodisalarning mohiyatini anglaydi, ularni tahlil qiladi va xulosalar chiqaradi.<\/li><\/ul>\n<p>Masalan, olim yangi ixtiro yaratish jarayonida avvalgi ilmiy bilimlarini xotiradan foydalanib esga tushiradi, yangi qurilmaning ko‘rinishi va ishlashini xayolida tasavvur qiladi, tafakkur yordamida esa uning ishlash tamoyillarini tahlil qilib, amaliy yechim ishlab chiqadi.<\/p>\n<p><strong>Xulosa:<\/strong> Xayol xotira va tafakkur bilan uzviy bog‘liq. Xotira xayolni zarur ma’lumotlar bilan ta’minlaydi, xayol ushbu ma’lumotlar asosida yangi obraz va g‘oyalarni yaratadi, tafakkur esa ularni tahlil qilish, baholash va amaliyotda qo‘llashga yordam beradi. Ularning birgalikdagi faoliyati insonning ijodiy qobiliyati, bilim olishi va muammolarni hal qilishida muhim ahamiyatga ega.<\/p>"}, {"n": 32, "title": "Ixtiyoriy va ixtiyorsiz xayolning farqlari", "html": "<p>Xayol — inson ongida ilgari idrok qilingan narsa va hodisalar asosida yangi obrazlar, tasavvurlar va g‘oyalarni yaratish jarayonidir. Psixologiyada xayol yuzaga kelish xususiyatiga ko‘ra ixtiyoriy va ixtiyorsiz xayol turlariga bo‘linadi.<\/p>\n<h4>1. Ixtiyorsiz xayol<\/h4>\n<p>Ixtiyorsiz xayol — insonning maxsus maqsadi, ongli istagi yoki harakatlarisiz, o‘z-o‘zidan yuzaga keladigan xayol jarayonidir. Bunda inson ataylab biror narsani tasavvur qilishga harakat qilmaydi, balki turli obraz va manzaralar beixtiyor uning xayolida paydo bo‘ladi.<\/p>\n<p>Ixtiyorsiz xayol ko‘pincha insonning hissiy holati, kayfiyati, tashqi ta’sirlar, uyqu va charchoq bilan bog‘liq bo‘ladi.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Inson musiqa tinglayotganda xayolida turli tabiat manzaralari yoki hayotiy voqealar paydo bo‘lishi.<\/li><li>Dars tinglayotgan talabaning beixtiyor boshqa narsalar haqida o‘ylab ketishi.<\/li><li>Bolaning bulutlarga qarab, ularda turli hayvonlar yoki predmetlarning shaklini ko‘rishi.<\/li><li>Uyqu vaqtida insonning turli voqealarni tushida ko‘rishi.<\/li><\/ul>\n<h4>2. Ixtiyoriy xayol<\/h4>\n<p>Ixtiyoriy xayol — insonning oldiga qo‘ygan maqsadi va ongli harakati asosida yangi obrazlar, tasavvurlar va g‘oyalarni yaratish jarayonidir. Bunda inson nimani tasavvur qilishini oldindan belgilaydi va o‘z xayolini ma’lum bir yo‘nalishga qaratadi.<\/p>\n<p>Ixtiyoriy xayol insonning maqsadli faoliyati, bilimlari, tajribasi va ijodiy qobiliyatlari bilan chambarchas bog‘liq.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Me’morning yangi bino loyihasini yaratishdan oldin uning tashqi ko‘rinishi va tuzilishini tasavvur qilishi.<\/li><li>Yozuvchining yangi asar yozish uchun qahramonlar va voqealarni ongli ravishda o‘ylab topishi.<\/li><li>Talabaning kelajakdagi kasbi va hayotini oldindan tasavvur qilishi.<\/li><li>Rassomning rasm chizishdan oldin uning mazmuni, ranglari va kompozitsiyasini xayolida shakllantirishi.<\/li><\/ul>\n<ol><li value=\"3\">Ixtiyoriy va ixtiyorsiz xayolning asosiy farqlari<\/li><li value=\"1\">Ixtiyorsiz xayol maxsus maqsadsiz, o‘z-o‘zidan yuzaga keladi, ixtiyoriy xayol esa ongli maqsad asosida amalga oshadi.<\/li><li value=\"2\">Ixtiyorsiz xayolda inson obrazlarni ataylab yaratmaydi, ixtiyoriy xayolda esa ularni ongli ravishda shakllantiradi.<\/li><li value=\"3\">Ixtiyorsiz xayol ko‘proq hissiyotlar, kayfiyat va tashqi ta’sirlarga bog‘liq, ixtiyoriy xayol esa insonning maqsadi, irodasi va faoliyatiga bog‘liq.<\/li><li value=\"4\">Ixtiyorsiz xayol kundalik hayotda beixtiyor paydo bo‘ladigan tasavvurlarda, ixtiyoriy xayol esa ijodiy va rejalashtirilgan faoliyatda ko‘proq namoyon bo‘ladi.<\/li><\/ol>\n<p><strong>Xulosa:<\/strong> Ixtiyorsiz xayol insonning maxsus harakati va maqsadisiz o‘z-o‘zidan yuzaga keladigan tasavvurlar jarayonidir. Ixtiyoriy xayol esa ongli ravishda, muayyan maqsad asosida yangi obraz va g‘oyalarni yaratishdir. Har ikkala xayol turi ham insonning ruhiy hayoti, fikrlashi va ijodiy faoliyatida muhim ahamiyatga ega.<\/p>"}, {"n": 33, "title": "Qayta tiklovchi va ijodiy xayol", "html": "<p>Xayol — inson ongida ilgari idrok qilingan narsa va hodisalar asosida yangi obrazlar, tasavvurlar va g‘oyalarni yaratish jarayonidir. Xayolning muhim turlaridan ikkitasi qayta tiklovchi xayol va ijodiy xayol hisoblanadi. Ular insonning bilim olishi, tasavvur qilish qobiliyati va ijodiy faoliyatida muhim o‘rin tutadi.<\/p>\n<h4>1. Qayta tiklovchi xayol<\/h4>\n<p>Qayta tiklovchi xayol — insonning so‘z, matn, chizma, xarita, rasm yoki boshqa tasviriy vositalar asosida o‘zi bevosita ko‘rmagan narsa va hodisalarning obrazini ongida qayta tiklash jarayonidir.<\/p>\n<p>Bunda inson yangi obrazni butunlay o‘zidan yaratmaydi, balki ilgari mavjud bo‘lgan yoki boshqa manbalarda tasvirlangan narsalarni o‘z tasavvurida gavdalantiradi.<\/p>\n<p>Qayta tiklovchi xayolning asosiy xususiyatlari:<\/p>\n<ol><li value=\"1\">Matn, so‘z, chizma va tasvirlarga asoslanadi.<\/li><li value=\"2\">Inson ilgari ko‘rmagan narsalarni tasavvur qilish imkonini beradi.<\/li><li value=\"3\">Avvalgi bilim va tajribalardan foydalanadi.<\/li><li value=\"4\">O‘qish, ta'lim olish va bilimlarni o‘zlashtirishda muhim ahamiyatga ega.<\/li><\/ol>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>O‘quvchi tarixiy kitobda qadimgi Misr piramidalari haqida o‘qib, ularning tashqi ko‘rinishini xayolida gavdalantiradi.<\/li><li>Inson roman o‘qiyotganda undagi qahramonlarning tashqi ko‘rinishi va yashash muhitini tasavvur qiladi.<\/li><li>Talaba geografik xaritaga qarab, o‘zi bormagan mamlakatlarning joylashuvi va tabiiy sharoitlarini tasavvur qiladi.<\/li><li>Muhandis chizma asosida hali qurilmagan binoning tuzilishini ko‘z oldiga keltiradi.<\/li><\/ul>\n<h4>2. Ijodiy xayol<\/h4>\n<p>Ijodiy xayol — insonning mavjud bilimlari, tajribasi va tasavvurlari asosida yangi, original obrazlar, g‘oyalar va loyihalarni mustaqil ravishda yaratish jarayonidir.<\/p>\n<p>Ijodiy xayolda inson avvalgi tasavvurlarni shunchaki qayta tiklamaydi, balki ularni o‘zgartiradi, birlashtiradi va yangicha shaklda namoyon qiladi. Natijada ilgari aynan shu shaklda mavjud bo‘lmagan yangi obraz yoki g‘oya yuzaga keladi.<\/p>\n<p>Ijodiy xayolning asosiy xususiyatlari:<\/p>\n<ol><li value=\"1\">Yangi va o‘ziga xos obrazlar yaratishga asoslanadi.<\/li><li value=\"2\">Insonning ijodkorligi va mustaqil fikrlashini rivojlantiradi.<\/li><li value=\"3\">Avvalgi bilim va tajribalarni yangicha birlashtirish orqali amalga oshadi.<\/li><li value=\"4\">Ilm-fan, texnika, adabiyot, san'at va boshqa sohalarda muhim ahamiyatga ega.<\/li><\/ol>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Yozuvchining o‘z tasavvuridan foydalanib, yangi roman qahramonlari va voqealarini yaratishi.<\/li><li>Rassomning ilgari mavjud bo‘lmagan yangi kompozitsiya va tasvirni yaratishi.<\/li><li>Ixtirochining insonlar hayotini yengillashtiradigan yangi qurilma yoki texnologiyani o‘ylab topishi.<\/li><li>Me'morning zamonaviy va o‘ziga xos bino loyihasini ishlab chiqishi.<\/li><\/ul>\n<ol><li value=\"3\">Qayta tiklovchi va ijodiy xayolning farqlari<\/li><li value=\"1\">Qayta tiklovchi xayol mavjud ma'lumotlar asosida obrazni qayta gavdalantiradi, ijodiy xayol esa yangi va original obrazlarni yaratadi.<\/li><li value=\"2\">Qayta tiklovchi xayol ko‘proq matn, chizma, xarita va tasvirlarga tayanadi, ijodiy xayol esa mustaqil fikrlash va ijodkorlikka asoslanadi.<\/li><li value=\"3\">Qayta tiklovchi xayol ta'lim olish va o‘rganishda muhim bo‘lsa, ijodiy xayol yangi g‘oyalar, ixtirolar va san'at asarlarini yaratishda muhimdir.<\/li><\/ol>\n<h4>Oddiy misol orqali farqi:<\/h4>\n<p>Agar talaba kitobda tasvirlangan tarixiy qal'aning ko‘rinishini o‘qib, uni xayolida gavdalantirsa, bu qayta tiklovchi xayol hisoblanadi.<\/p>\n<p>Agar me'mor o‘z tasavvuriga asoslanib, ilgari mavjud bo‘lmagan yangi qal'a loyihasini yaratsa, bu ijodiy xayol hisoblanadi.<\/p>\n<p><strong>Xulosa:<\/strong> Qayta tiklovchi xayol — so‘z, matn, chizma va boshqa manbalar asosida mavjud obrazlarni ongda qayta gavdalantirishdir. Ijodiy xayol esa avvalgi bilim va tajribalar asosida yangi, original obraz va g‘oyalarni yaratishdir. Har ikkala xayol turi insonning aqliy, ijodiy va amaliy faoliyatida muhim rol o‘ynaydi.<\/p>"}, {"n": 34, "title": "Agglyutinatsiya va giperbolizatsiya usullari", "html": "<p>Agglyutinatsiya va giperbolizatsiya — xayol jarayonida yangi obrazlar yaratishning asosiy usullaridan hisoblanadi. Inson ushbu usullar yordamida avvalgi bilimlari, tajribalari va tasavvurlaridagi elementlarni o‘zgartirish, birlashtirish yoki kattalashtirish orqali yangi obrazlarni hosil qiladi. Bu usullar adabiyot, san'at, ilm-fan va ijodiy faoliyatda keng qo‘llaniladi.<\/p>\n<h4>1. Agglyutinatsiya usuli<\/h4>\n<p>Agglyutinatsiya — turli predmet va hodisalarning ayrim xususiyatlari, qismlari yoki belgilarini birlashtirish orqali yangi, ilgari mavjud bo‘lmagan obraz yaratish usulidir.<\/p>\n<p>Bunda inson bir nechta turli narsalarning xususiyatlarini birlashtirib, yangi tasavvur hosil qiladi. Yaratilgan obraz real hayotda mavjud bo‘lishi shart emas.<\/p>\n<p>Agglyutinatsiyaga misollar:<\/p>\n<ul><li>Suv parisi — inson tanasi va baliq dumining birlashtirilishi natijasida hosil bo‘lgan obraz.<\/li><li>Kentavr — inson tanasining yuqori qismi va ot tanasining birlashtirilishi.<\/li><li>Qanotli ot — oddiy ot tanasiga qush qanotlarini qo‘shish orqali yaratilgan obraz.<\/li><li>Ajdarho — turli hayvonlarga xos xususiyatlarni birlashtirish orqali tasavvur qilingan afsonaviy mavjudot.<\/li><\/ul>\n<p>Agglyutinatsiyaning asosiy xususiyati — turli predmetlarning alohida belgilarini birlashtirib, yangi obraz yaratishdir.<\/p>\n<h4>2. Giperbolizatsiya usuli<\/h4>\n<p>Giperbolizatsiya — predmet yoki hodisalarning ayrim xususiyatlarini, o‘lchamini, kuchini, sonini yoki imkoniyatlarini haddan tashqari kattalashtirish yoki kichraytirish orqali yangi obraz yaratish usulidir.<\/p>\n<p>Bu usulda mavjud narsaning ma'lum bir belgisi odatdagi holatidan ancha oshirib yoki kamaytirib tasvirlanadi. Giperbolizatsiya ko‘pincha ertaklar, afsonalar, badiiy asarlar va hajviy tasvirlarda uchraydi.<\/p>\n<p>Giperbolizatsiyaga misollar:<\/p>\n<ul><li>Alpomish kabi xalq dostonlari qahramonlarining kuch-qudrati va jasorati bo‘rttirib tasvirlanishi.<\/li><li>Ertaklardagi bahaybat devlarning juda katta gavdaga ega qilib tasvirlanishi.<\/li><li>Uzun quloqli yoki juda katta burunli qahramonlarning yaratilishi.<\/li><li>Bir zarb bilan katta tog‘ni ko‘chiradigan afsonaviy qahramon obrazining yaratilishi.<\/li><\/ul>\n<p>Giperbolizatsiyaning asosiy xususiyati — predmet yoki hodisaning ayrim belgilarini ataylab bo‘rttirib yoki kamaytirib ko‘rsatishdir.<\/p>\n<ol><li value=\"3\">Agglyutinatsiya va giperbolizatsiyaning farqi<\/li><li value=\"1\">Agglyutinatsiyada turli predmetlarning xususiyatlari birlashtiriladi, giperbolizatsiyada esa mavjud predmetning ayrim xususiyatlari bo‘rttiriladi yoki kichraytiriladi.<\/li><li value=\"2\">Agglyutinatsiya yangi va noodatiy obrazlarni birlashtirish orqali yaratadi, giperbolizatsiya esa obrazning muayyan belgisini o‘zgartirish orqali yaratadi.<\/li><li value=\"3\">Agglyutinatsiyaga suv parisi va kentavr, giperbolizatsiyaga esa bahaybat dev va favqulodda kuchli qahramon misol bo‘ladi.<\/li><\/ol>\n<p><strong>Xulosa:<\/strong> Agglyutinatsiya — turli predmet va hodisalarning xususiyatlarini birlashtirish orqali yangi obraz yaratish usuli. Giperbolizatsiya esa predmet yoki hodisalarning ayrim xususiyatlarini haddan tashqari kattalashtirish yoki kichraytirish orqali yangi obraz hosil qilish usulidir. Har ikkala usul ham insonning ijodiy xayolini rivojlantirish va yangi tasavvurlar yaratishda muhim ahamiyatga ega.<\/p>"}, {"n": 35, "title": "Sxemalashtirish va tipiklashtirish usullari", "html": "<p>Sxemalashtirish va tipiklashtirish — xayol jarayonida yangi obrazlar yaratish usullari hisoblanadi. Bu usullar insonning turli predmet, hodisa va insonlarga xos xususiyatlarni ajratishi, umumlashtirishi va ularni yangi obrazlarda ifodalashiga yordam beradi. Ayniqsa, adabiyot, san'at, ilm-fan va ijodiy faoliyatda keng qo‘llaniladi.<\/p>\n<h4>1. Sxemalashtirish usuli<\/h4>\n<p>Sxemalashtirish — predmet va hodisalarning muhim belgilarini saqlab qolgan holda, ikkinchi darajali va ortiqcha xususiyatlarini chetga surish orqali soddalashtirilgan obraz yaratish usulidir.<\/p>\n<p>Bunda inson predmetning eng asosiy belgilarini ajratib oladi va ularni umumiy, sodda shaklda tasvirlaydi. Natijada predmetning murakkab ko‘rinishi soddalashtirilgan shaklga keladi. Sxemalashtirishga misollar:<\/p>\n<ul><li>Geografik xaritada mamlakatlar, daryolar va tog‘lar maxsus shartli belgilar orqali soddalashtirib ko‘rsatiladi.<\/li><li>Inson tanasining anatomik chizmalarida organlar va ularning joylashuvi asosiy belgilar orqali tasvirlanadi.<\/li><li>Rassom biror binoning rasmini chizishda uning barcha mayda detallarini emas, balki asosiy shakli va tuzilishini aks ettiradi.<\/li><li>Yo‘l xaritasida ko‘chalar va yo‘llar haqiqiy ko‘rinishiga aynan o‘xshamagan, soddalashtirilgan chiziqlar orqali ifodalanadi.<\/li><\/ul>\n<p>Sxemalashtirishning asosiy xususiyati — predmet yoki hodisaning muhim belgilarini saqlab, ikkinchi darajali xususiyatlarini qisqartirish va soddalashtirishdir.<\/p>\n<h4>2. Tipiklashtirish usuli<\/h4>\n<p>Tipiklashtirish — bir guruh predmet yoki insonlarga xos bo‘lgan umumiy, muhim va xarakterli belgilarni birlashtirish orqali umumlashtirilgan yangi obraz yaratish usulidir.<\/p>\n<p>Bunda inson bir nechta odam yoki hodisalarni kuzatadi, ularga xos umumiy xususiyatlarni ajratib oladi va shu belgilar asosida umumlashgan obraz yaratadi. Tipiklashtirish ko‘proq badiiy adabiyot, san'at va ilmiy faoliyatda qo‘llaniladi.<\/p>\n<p>Tipiklashtirishga misollar:<\/p>\n<ul><li>Yozuvchi turli insonlarning xarakteri, xulq-atvori va hayotiy tajribalarini o‘rganib, asarida ma'lum bir kasb yoki ijtimoiy guruhga xos umumiy xususiyatlarni mujassamlashtirgan qahramon yaratadi.<\/li><li>Adabiyotda mehnatkash inson obrazi yaratilganda, turli mehnatkashlarga xos bo‘lgan tirishqoqlik, sabr-toqat va mas'uliyat kabi xususiyatlar bir obrazda umumlashtiriladi.<\/li><li>Multfilm yaratuvchisi turli hayvonlarga xos xususiyatlarni birlashtirib, ma'lum bir hayvonning umumlashtirilgan obrazini yaratadi.<\/li><li>Rassom bir guruh insonlarning umumiy xususiyatlarini aks ettiruvchi badiiy obraz yaratadi.<\/li><\/ul>\n<p>Tipiklashtirishning asosiy xususiyati — ko‘plab predmet yoki insonlarga xos umumiy va muhim belgilarni bitta umumlashtirilgan obrazda mujassamlashtirishdir.<\/p>\n<ol><li value=\"3\">Sxemalashtirish va tipiklashtirishning farqlari<\/li><li value=\"1\">Sxemalashtirishda predmet yoki hodisaning ayrim belgilari soddalashtiriladi, tipiklashtirishda esa bir nechta predmet yoki insonlarga xos umumiy belgilar birlashtiriladi.<\/li><li value=\"2\">Sxemalashtirishning asosiy maqsadi muhim belgilarni ajratib, sodda obraz yaratishdir. Tipiklashtirishning maqsadi esa umumiy va xarakterli xususiyatlarni mujassamlashtirgan obraz yaratishdir.<\/li><li value=\"3\">Sxemalashtirishga xarita va chizmalar, tipiklashtirishga esa adabiy qahramonlar va umumlashtirilgan inson obrazlari misol bo‘ladi.<\/li><\/ol>\n<p><strong>Xulosa:<\/strong> Sxemalashtirish — predmet va hodisalarning muhim belgilarini saqlagan holda, ularni soddalashtirish orqali obraz yaratish usulidir. Tipiklashtirish esa turli predmet va insonlarga xos umumiy, muhim xususiyatlarni birlashtirish orqali umumlashtirilgan obraz yaratish usulidir. Har ikkala usul ham insonning xayol qilish, umumlashtirish va ijodiy fikrlash qobiliyatini rivojlantirishda muhim ahamiyatga ega.<\/p>"}, {"n": 36, "title": "Orzu nima va uning inson faoliyatidagi ahamiyati nimada?", "html": "<p>Orzu — insonning kelajakda amalga oshishini istagan maqsadlari, rejalari va xohish-istaklari haqidagi xayoliy tasavvurlaridir. Orzu insonning ehtiyojlari, qiziqishlari, qobiliyatlari va hayotiy intilishlari asosida shakllanadi. U xayolning muhim ko‘rinishlaridan biri hisoblanadi.<\/p>\n<p>Orzuning inson faoliyatidagi asosiy ahamiyati:<\/p>\n<ol><li value=\"1\">Maqsad sari yo‘naltiradi. Orzu insonning kelajakdagi maqsadlarini belgilashiga yordam beradi. Masalan, shifokor bo‘lishni orzu qilgan o‘quvchi tibbiyot sohasida bilim olishga intiladi.<\/li><li value=\"2\">Faoliyatga undaydi. Orzu insonda harakat qilish, mehnat qilish va qiyinchiliklarni yengib o‘tish istagini kuchaytiradi.<\/li><li value=\"3\">Motivatsiyani oshiradi. Inson o‘z orzusiga erishish uchun muntazam harakat qiladi, o‘z ustida ishlaydi va yangi bilimlarni egallaydi.<\/li><li value=\"4\">Ijodkorlikni rivojlantiradi. Orzu insonni yangicha fikrlashga, yangi g‘oyalar va imkoniyatlarni tasavvur qilishga undaydi.<\/li><li value=\"5\">Kelajakni rejalashtirishga yordam beradi. Inson orzulari asosida o‘z faoliyatini rejalashtiradi va unga erishish yo‘llarini izlaydi.<\/li><li value=\"6\">Qiyinchiliklarni yengishga yordam beradi. Aniq va mazmunli orzuga ega inson muvaffaqiyatsizliklarga qaramay, o‘z maqsadi sari intilishni davom ettirishi mumkin.<\/li><\/ol>\n<p>Orzuning amalga oshishi uchun u aniq maqsad, reja va amaliy harakatlar bilan bog‘liq bo‘lishi kerak. Faqat orzu qilishning o‘zi yetarli emas, unga erishish uchun muntazam mehnat va qat’iyat talab etiladi.<\/p>\n<p>Xulosa qilib aytganda, orzu inson hayotiga mazmun bag‘ishlaydi, uni kelajakka intilishga undaydi va shaxsning rivojlanishida muhim psixologik omil bo‘lib xizmat qiladi.<\/p>"}, {"n": 37, "title": "Xotira nima va uning asosiy jarayonlari nimalardan iborat?", "html": "<p>Xotira — insonning o‘z tajribasini esda olib qolish, saqlash, qayta esga tushirish va unutish jarayonlaridan iborat bo‘lgan psixik bilish jarayonidir. Xotira orqali inson avval idrok qilgan narsa va hodisalar, olgan bilimlari, kechinmalari hamda bajargan harakatlarini yodda saqlaydi.<\/p>\n<p>Xotira inson hayotida muhim ahamiyatga ega, chunki u bilim va tajribalarni to‘plash, ulardan foydalanish, o‘qish, mehnat qilish va kundalik faoliyatni amalga oshirish imkonini beradi.<\/p>\n<p>Xotiraning asosiy jarayonlari quyidagilardan iborat:<\/p>\n<ol><li value=\"1\">Esda olib qolish. Bu yangi ma’lumot, hodisa va taassurotlarning xotirada mustahkamlanish jarayonidir. Esda olib qolish ixtiyorsiz yoki ixtiyoriy bo‘lishi mumkin. Masalan, o‘quvchining she’rni yodlashi ixtiyoriy esda olib qolishga misol bo‘ladi.<\/li><li value=\"2\">Saqlash. Bu o‘zlashtirilgan ma’lumotlarning ma’lum vaqt davomida xotirada saqlanib turishidir. Saqlash jarayonida bilim va tajribalar xotirada mustahkamlanadi. Masalan, inson maktabda o‘rgangan bilimlarini yillar davomida eslab yurishi mumkin.<\/li><li value=\"3\">Esga tushirish. Bu avval xotirada saqlangan ma’lumotlarni qayta tiklash jarayonidir. Esga tushirish tanish, eslash va xotirlash shakllarida namoyon bo‘ladi. Masalan, imtihon paytida o‘quvchining o‘rgangan mavzusini eslashi.<\/li><li value=\"4\">Unutish. Bu avval esda olib qolingan ma’lumotlarni esga tushirishning qiyinlashishi yoki ularni butunlay qayta tiklay olmaslik jarayonidir. Unutish tabiiy jarayon bo‘lib, inson xotirasini ortiqcha va keraksiz ma’lumotlardan xalos etishga yordam beradi.<\/li><\/ol>\n<p>Xotira jarayonlari bir-biri bilan uzviy bog‘liq. Ma’lumot avval esda olib qolinadi, keyin saqlanadi, zarur vaqtda esga tushiriladi. Ayrim ma’lumotlar esa vaqt o‘tishi bilan unutilishi mumkin.<\/p>\n<p>Xulosa qilib aytganda, xotira insonning bilim, tajriba va ko‘nikmalarini saqlab, ulardan kelajakdagi faoliyatida foydalanish imkonini beradigan muhim psixik jarayondir.<\/p>"}, {"n": 38, "title": "Esda olib qolish, esda saqlash va esga tushirish qanday farqlanadi?", "html": "<p>Xotira — insonning avvalgi tajribasi, bilimlari, taassurotlari va kechinmalarini esda olib qolish, saqlash hamda zarur vaqtda qayta tiklash jarayonidir. Xotira insonning o‘qishi, fikrlashi, mehnat qilishi va kundalik hayotda faoliyat yuritishida muhim ahamiyatga ega.<\/p>\n<p>Esda olib qolish, esda saqlash va esga tushirish xotiraning asosiy jarayonlari hisoblanadi. Ular birbiri bilan chambarchas bog‘liq bo‘lsa-da, har biri o‘ziga xos vazifani bajaradi.<\/p>\n<h4>1. Esda olib qolish<\/h4>\n<p>Esda olib qolish — inson tomonidan idrok etilgan narsa va hodisalar, ma’lumotlar, bilimlar hamda taassurotlarning xotirada mustahkamlanish jarayonidir. Bu jarayon orqali yangi ma’lumotlar insonning avvalgi bilim va tajribalari bilan bog‘lanadi.<\/p>\n<p>Esda olib qolish ikki turga bo‘linadi:<\/p>\n<ul><li>Ixtiyorsiz esda olib qolish — insonning maxsus maqsad qo‘ymasdan, biror ma’lumotni o‘zo‘zidan eslab qolishidir. Masalan, ko‘chada ko‘rgan qiziqarli voqeani yoki eshitgan qo‘shiqni beixtiyor yodda saqlab qolish.<\/li><li>Ixtiyoriy esda olib qolish — ma’lum bir maqsad asosida, ongli ravishda ma’lumotni eslab qolishga qaratilgan faoliyatdir. Masalan, talabaning imtihonga tayyorlanish uchun mavzuni yodlashi.<\/li><\/ul>\n<p>Esda olib qolishning samaradorligi diqqat, qiziqish, takrorlash, tushunish, hissiy kechinmalar va ma’lumotning inson uchun ahamiyatiga bog‘liq. Ayniqsa, tushunib esda olib qolish mexanik yodlashga qaraganda bilimlardan keyinchalik foydalanishni osonlashtiradi.<\/p>\n<ol><li value=\"2\">Esda saqlash<\/li><\/ol>\n<p>Esda saqlash — avval esda olib qolingan ma’lumotlarning ma’lum vaqt davomida xotirada saqlanib turish jarayonidir. Bu jarayon insonning bilim, ko‘nikma, malaka va hayotiy tajribalarini yo‘qotmasdan saqlashiga yordam beradi.<\/p>\n<p>Esda saqlash qisqa muddatli va uzoq muddatli xotira bilan bog‘liq holda namoyon bo‘ladi:<\/p>\n<ul><li>Qisqa muddatli saqlash — ma’lumotning nisbatan qisqa vaqt davomida xotirada turishidir. Masalan, telefon raqamini terishdan oldin vaqtincha eslab turish.<\/li><li>Uzoq muddatli saqlash — ma’lumotlarning uzoq vaqt, ba’zan butun umr davomida xotirada saqlanishidir. Masalan, insonning ona tilini, bolalikdagi ayrim voqealarni yoki o‘z kasbiga oid bilimlarni eslab qolishi.<\/li><\/ul>\n<p>Esda saqlash jarayonida takrorlash, ma’lumotlarni o‘zaro bog‘lash, ularni amaliyotda qo‘llash va muntazam foydalanish muhim ahamiyatga ega. Agar ma’lumotlardan uzoq vaqt foydalanilmasa, ularni esga tushirish qiyinlashishi mumkin.<\/p>\n<h4>3. Esga tushirish<\/h4>\n<p>Esga tushirish — ilgari esda olib qolingan va xotirada saqlangan ma’lumotlarni qayta tiklash jarayonidir. Inson zarur vaziyatda o‘zining oldingi bilimlari, tajribalari va taassurotlaridan foydalanadi.<\/p>\n<p>Esga tushirishning asosiy ko‘rinishlari quyidagilardan iborat:<\/p>\n<ul><li>Tanib olish — avval idrok qilingan narsa yoki hodisani qayta uchratganda uni tanishdir. Masalan, inson avval ko‘rgan tanishini yana uchratganda darhol tanib oladi.<\/li><li>Eslash — avval o‘zlashtirilgan ma’lumotni tashqi yordam bo‘lmagan yoki kam bo‘lgan sharoitda xotiradan qayta tiklashdir. Masalan, o‘quvchining imtihonda savolga javob berishi.<\/li><li>Xotirlash — o‘tmishda sodir bo‘lgan voqea va hodisalarni ongli ravishda qayta tiklash jarayonidir. Masalan, insonning maktab davridagi voqealarni eslashi.<\/li><\/ul>\n<p>Esga tushirish jarayoniga diqqat, qiziqish, hissiy holat, ma’lumotning qay darajada o‘zlashtirilgani va uni eslatib turuvchi belgilar ta’sir qiladi.<\/p>\n<h4>4. Ushbu jarayonlarning o‘zaro bog‘liqligi<\/h4>\n<p>Esda olib qolish, esda saqlash va esga tushirish bir-birini to‘ldiruvchi jarayonlardir. Ularni quyidagicha izohlash mumkin:<\/p>\n<ul><li>Esda olib qolish — yangi ma’lumotni xotirada mustahkamlash.<\/li><li>Esda saqlash — o‘zlashtirilgan ma’lumotni xotirada saqlab turish.<\/li><li>Esga tushirish — saqlangan ma’lumotni kerakli vaqtda qayta tiklash.<\/li><\/ul>\n<p>Masalan, talaba psixologiya fanidan yangi mavzuni o‘qiydi. Mavzuni tushunib, asosiy tushunchalarni yodda saqlashi esda olib qolish hisoblanadi. O‘rgangan bilimlarining keyingi kunlar va oylar davomida xotirasida saqlanishi esda saqlashdir. Imtihon vaqtida shu bilimlarni qayta tiklab, savollarga javob berishi esa esga tushirish jarayonidir.<\/p>\n<h4>Xulosa<\/h4>\n<p>Esda olib qolish, esda saqlash va esga tushirish inson xotirasining eng muhim jarayonlaridir. Ular orqali inson bilimlarni egallaydi, hayotiy tajribasini to‘playdi va zarur vaziyatlarda undan foydalanadi. Ushbu jarayonlarning samarali kechishi ta’lim olish, kasbiy faoliyat va shaxsiy rivojlanish uchun katta ahamiyatga ega.<\/p>"}, {"n": 39, "title": "Harakat, emotsional, obrazli va so‘z-mantiq xotirasi qanday xususiyatlarga ega?", "html": "<p>Xotira insonning faoliyati, tajribasi va bilimlarini esda olib qolish, saqlash hamda qayta tiklash jarayonidir. Xotira mazmuniga ko‘ra bir necha turlarga bo‘linadi. Ulardan eng asosiylari harakat, emotsional, obrazli va so‘z-mantiq xotirasidir. Bu xotira turlari insonning turli faoliyatlarida namoyon bo‘ladi va o‘ziga xos xususiyatlarga ega.<\/p>\n<h4>1. Harakat xotirasi<\/h4>\n<p>Harakat xotirasi — insonning turli harakatlari, jismoniy faoliyati va amaliy ko‘nikmalarini esda olib qolish, saqlash va qayta bajarish qobiliyatidir.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Turli jismoniy harakatlarni eslab qolish va takrorlashga asoslanadi.<\/li><li>Harakatlarning to‘g‘ri, aniq va muvofiqlashtirilgan bajarilishini ta’minlaydi.<\/li><li>Mashq qilish va takrorlash orqali rivojlanadi.<\/li><li>Insonning kundalik va kasbiy faoliyatida muhim o‘rin tutadi.<\/li><\/ul>\n<h4>Misollar:<\/h4>\n<ul><li>Velosiped haydashni o‘rganish.<\/li><li>Suzish va yugurish harakatlarini bajarish.<\/li><li>Kompyuter klaviaturasida tez yozish.<\/li><li>Musiqa asbobini chalish yoki raqsga tushish.<\/li><\/ul>\n<p>Harakat xotirasi sportchilar, raqqoslar, haydovchilar, musiqachilar va turli amaliy kasb egalari uchun ayniqsa muhimdir.<\/p>\n<h4>2. Emotsional xotira<\/h4>\n<p>Emotsional xotira — insonning avval boshidan kechirgan his-tuyg‘ulari, kechinmalari va emotsional holatlarini esda olib qolish hamda qayta his etish qobiliyatidir.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Quvonch, qo‘rquv, qayg‘u, hayajon, g‘azab va mehr kabi hissiyotlar bilan bog‘liq.<\/li><li>Kuchli hissiy kechinmalar ko‘pincha xotirada uzoqroq saqlanadi.<\/li><li>Avvalgi voqealarni eslashda o‘sha paytdagi his-tuyg‘ular qayta namoyon bo‘lishi mumkin.<\/li><li>Insonning xulq-atvori, munosabatlari va qarorlariga ta’sir ko‘rsatadi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Bolalikdagi quvonchli kunlarni eslab, yana xursand bo‘lish.<\/li><li>Biror voqeadan qattiq qo‘rqib ketgan holatni uzoq vaqt unutmaslik.<\/li><li>Yaqin inson bilan uchrashuvdagi iliq taassurotlarni eslash.<\/li><li>Imtihon oldidan his qilingan kuchli hayajonni eslab qolish.<\/li><\/ul>\n<p>Emotsional xotira insonning boshqalarga bo‘lgan munosabati, tajribasi va hayotiy qarashlarining shakllanishida muhim ahamiyatga ega.<\/p>\n<h4>3. Obrazli xotira<\/h4>\n<p>Obrazli xotira — ilgari idrok qilingan narsa va hodisalarning ko‘rish, eshitish, hid bilish, ta’m bilish hamda teri-tuyush orqali hosil bo‘lgan obrazlarini esda olib qolish va qayta tiklash jarayonidir.<\/p>\n<p>Obrazli xotira bir necha ko‘rinishga ega:<\/p>\n<ul><li>Ko‘rish xotirasi — insonning yuzlar, ranglar, shakllar va manzaralarni eslab qolishi.<\/li><li>Eshitish xotirasi — tovushlar, musiqa, nutq va ohanglarni eslab qolishi.<\/li><li>Hid bilish xotirasi — turli hidlarni eslab qolishi.<\/li><li>Ta’m bilish xotirasi — ta’m sezgilarini eslab qolishi.<\/li><li>Teri-tuyush xotirasi — narsalarning issiq-sovuqligi, yumshoqligi, qattiqligi va boshqa xususiyatlarini eslab qolishi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Insonning bir marta ko‘rgan joyini keyinchalik tasavvur qila olishi.<\/li><li>Musiqani eshitib, uning ohangini eslab qolishi.<\/li><li>Bolalikdagi uyining ko‘rinishini xotirada tiklashi.<\/li><li>Avval tatib ko‘rilgan taomning ta’mini eslash.<\/li><\/ul>\n<p>Obrazli xotira rassomlar, musiqachilar, dizaynerlar, me’morlar va ijodiy faoliyat bilan shug‘ullanuvchi insonlarda muhim ahamiyatga ega.<\/p>\n<h4>4. So‘z-mantiq xotirasi<\/h4>\n<p>So‘z-mantiq xotirasi — insonning fikrlar, tushunchalar, qoidalar, xulosalar va so‘zlar orqali ifodalangan ma’lumotlarni esda olib qolish, saqlash va qayta tiklash qobiliyatidir.<\/p>\n<p>Bu xotira turi nutq va tafakkur bilan chambarchas bog‘liq. Unda ma’lumotlar shunchaki so‘zlar shaklida emas, balki ularning mazmuni, ma’nosi va mantiqiy bog‘lanishlari asosida o‘zlashtiriladi.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Tushuncha va fikrlarni eslab qolishga asoslanadi.<\/li><li>Ma’lumotlarning mazmunini anglash va mantiqiy bog‘lash muhim hisoblanadi.<\/li><li>O‘qish, yozish, fikrlash va bilimlarni o‘zlashtirish jarayonida faol ishtirok etadi.<\/li><li>Insonning ilmiy va nazariy bilimlarini rivojlantirishga yordam beradi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Tarixiy voqealar va ularning sabablarini eslab qolish.<\/li><li>Matematik qoidalar va formulalarning mazmunini tushunib o‘zlashtirish.<\/li><li>Psixologik tushunchalar va ta’riflarni yodda saqlash.<\/li><li>O‘qilgan matnning asosiy mazmunini qayta hikoya qilish.<\/li><\/ul>\n<p>So‘z-mantiq xotirasi ayniqsa o‘quvchilar, talabalar, olimlar va o‘qituvchilar faoliyatida katta ahamiyatga ega.<\/p>\n<h4>5. Xotira turlarining o‘zaro farqi<\/h4>\n<ul><li>Harakat xotirasi — harakat va amaliy ko‘nikmalarni eslab qoladi.<\/li><li>Emotsional xotira — his-tuyg‘u va kechinmalarni eslab qoladi.<\/li><li>Obrazli xotira — narsa va hodisalarning sezgi orqali hosil bo‘lgan obrazlarini eslab qoladi.<\/li><li>So‘z-mantiq xotirasi — fikrlar, tushunchalar va mantiqiy bog‘lanishlarni eslab qoladi.<\/li><\/ul>\n<p>Xulosa qilib aytganda, harakat, emotsional, obrazli va so‘z-mantiq xotirasi insonning bilish faoliyatida muhim o‘rin egallaydi. Ular bir-biri bilan uzviy bog‘liq holda ishlaydi. Masalan, talaba darsni o‘rganayotganda o‘qituvchining so‘zlarini eshitish orqali obrazli xotirasidan, mavzuning mazmunini tushunish orqali so‘z-mantiq xotirasidan, darsdagi hissiy taassurotlar orqali emotsional xotirasidan foydalanadi. Shu sababli xotiraning barcha turlarini rivojlantirish insonning ta’lim olishi va kundalik faoliyatini samarali tashkil etishda muhim ahamiyatga ega.<\/p>"}, {"n": 40, "title": "Ixtiyoriy va ixtiyorsiz esda olib qolish qanday farqlanadi?", "html": "<p>Esda olib qolish — inson tomonidan idrok qilingan ma’lumotlar, narsa va hodisalar, bilimlar hamda taassurotlarning xotirada mustahkamlanish jarayonidir. Psixologiyada esda olib qolish maqsad va faoliyatga munosabatiga ko‘ra ixtiyoriy va ixtiyorsiz turlarga bo‘linadi.<\/p>\n<h4>1. Ixtiyorsiz esda olib qolish<\/h4>\n<p>Ixtiyorsiz esda olib qolish — insonning oldindan maxsus maqsad qo‘ymasdan, ma’lumotni yodlashga alohida harakat qilmasdan eslab qolish jarayonidir. Bunda ma’lumotlar insonning kundalik faoliyati, kuzatishlari, qiziqishlari va hissiy kechinmalari davomida o‘z-o‘zidan xotirada saqlanib qoladi.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Maxsus maqsad va ongli ravishda yodlash niyati bo‘lmaydi.<\/li><li>Ma’lumotlar tabiiy ravishda, o‘z-o‘zidan esda qoladi.<\/li><li>Qiziqarli, noodatiy va kuchli hissiyot uyg‘otadigan hodisalar tezroq esda qolishi mumkin.<\/li><li>Insonning diqqatini tortgan voqea va hodisalar xotirada mustahkamlanadi.<\/li><li>Kundalik hayot va faoliyat jarayonida ko‘p uchraydi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Ko‘chada ketayotib, chiroyli binoni ko‘rib, uning ko‘rinishini eslab qolish.<\/li><li>Qiziqarli filmni tomosha qilgandan keyin uning ayrim voqealarini yodda saqlash.<\/li><li>Do‘konda eshitilgan qo‘shiqni beixtiyor eslab qolish.<\/li><li>Kutilmagan yoki hayajonli voqeani uzoq vaqt unutmaslik.<\/li><\/ul>\n<p>Ixtiyorsiz esda olib qolish insonning kundalik hayotida muhim ahamiyatga ega. Chunki inson atrof-muhitdagi juda ko‘p ma’lumotlarni maxsus yodlashga harakat qilmasdan ham o‘zlashtiradi.<\/p>\n<h4>2. Ixtiyoriy esda olib qolish<\/h4>\n<p>Ixtiyoriy esda olib qolish — insonning ma’lum bir maqsad asosida, ongli ravishda va maxsus harakatlar yordamida ma’lumotni xotirada mustahkamlash jarayonidir. Bunda inson nimani va nima uchun eslab qolishi kerakligini oldindan belgilaydi.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Oldindan belgilangan maqsad mavjud bo‘ladi.<\/li><li>Ongli ravishda eslab qolishga intilish talab etiladi.<\/li><li>Diqqat va iroda kuchi muhim ahamiyatga ega.<\/li><li>Takrorlash, tushunish, reja tuzish va guruhlash kabi usullardan foydalaniladi.<\/li><li>Ko‘proq ta’lim olish, mehnat va kasbiy faoliyatda namoyon bo‘ladi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Talabaning imtihonga tayyorlanib, mavzularni yodlashi.<\/li><li>O‘quvchining she’rni yod olish uchun bir necha marta takrorlashi.<\/li><li>Insonning yangi til o‘rganayotganda so‘zlarni ataylab yodlashi.<\/li><\/ul>\n<p> Ma’ruzachining nutq matnini oldindan eslab qolishi.<\/p>\n<p>Ixtiyoriy esda olib qolish insondan maqsadga yo‘naltirilgan faoliyat, diqqat, sabr va iroda talab qiladi. Shu sababli u bilimlarni tizimli ravishda egallashda katta ahamiyatga ega.<\/p>\n<h4>3. Ixtiyoriy va ixtiyorsiz esda olib qolishning farqlari<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Ixtiyorsiz esda olib qolish<\/strong><\/th><th><strong>Ixtiyoriy esda olib qolish<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Maxsus maqsad bo‘lmaydi.<\/td><td>Aniq maqsad mavjud bo‘ladi.<\/td><\/tr><tr><td>O‘z-o‘zidan yuzaga keladi.<\/td><td>Ongli ravishda amalga oshiriladi.<\/td><\/tr><tr><td>Maxsus yodlash harakati talab qilinmaydi.<\/td><td>Yodlash uchun ongli harakat talab qilinadi.<\/td><\/tr><tr><td>Qiziqish va hissiyotlar katta rol o‘ynaydi.<\/td><td>Diqqat, iroda va takrorlash muhimdir.<\/td><\/tr><tr><td>Kundalik hayotda ko‘p uchraydi.<\/td><td>Ta’lim va kasbiy faoliyatda keng qo‘llaniladi.<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>4. Ularning o‘zaro bog‘liqligi<\/h4>\n<p>Ixtiyoriy va ixtiyorsiz esda olib qolish bir-biridan farq qilsa-da, ular o‘zaro bog‘liqdir. Masalan, talaba darsda o‘qituvchini tinglayotganda ayrim qiziqarli ma’lumotlarni beixtiyor eslab qolishi mumkin. Shu bilan birga, imtihonga tayyorlanish uchun muhim ta’riflarni ongli ravishda yodlaydi.<\/p>\n<p>Demak, inson faoliyatida ushbu ikki xotira turi birgalikda ishtirok etadi. Ixtiyorsiz esda olib qolish tabiiy ravishda bilim va tajriba to‘plashga yordam bersa, ixtiyoriy esda olib qolish aniq maqsad asosida kerakli ma’lumotlarni o‘zlashtirish imkonini beradi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Ixtiyorsiz esda olib qolish — maxsus maqsadsiz, o‘z-o‘zidan yuzaga keladigan xotira jarayoni. Ixtiyoriy esda olib qolish esa oldindan belgilangan maqsad asosida, ongli ravishda amalga oshiriladigan jarayondir. Har ikkisi ham insonning bilim olishi, tajriba orttirishi va shaxs sifatida rivojlanishida muhim ahamiyatga ega.<\/p>"}, {"n": 41, "title": "Qisqa muddatli, uzoq muddatli va operativ xotira nima?", "html": "<p>Xotira insonning ma’lumotlarni esda olib qolish, saqlash va zarur vaqtda qayta tiklash qobiliyatidir. Ma’lumotlarning qancha vaqt saqlanishi va qanday maqsadda ishlatilishiga ko‘ra xotira qisqa muddatli, uzoq muddatli va operativ xotira turlariga bo‘linadi. Ushbu xotira turlari insonning o‘qishi, fikrlashi, mehnat qilishi va kundalik faoliyatida muhim ahamiyatga ega.<\/p>\n<h4>1. Qisqa muddatli xotira<\/h4>\n<p>Qisqa muddatli xotira — ma’lumotlarning qisqa vaqt davomida, odatda bir necha soniyadan bir necha daqiqagacha saqlanishini ta’minlaydigan xotira turidir. Bu xotira inson hozirgi vaqtda qabul qilayotgan ma’lumotlarni vaqtincha ushlab turish va ulardan foydalanishga yordam beradi.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Ma’lumotlar qisqa vaqt davomida saqlanadi.<\/li><li>Axborot hajmi cheklangan bo‘ladi.<\/li><li>Ma’lumotni takrorlash orqali saqlash muddatini uzaytirish mumkin.<\/li><li>Kundalik suhbat, hisob-kitob va yangi ma’lumotlarni qabul qilishda ishtirok etadi.<\/li><li>Ma’lumot uzoq muddatli xotiraga o‘tmasa, vaqt o‘tishi bilan unutilishi mumkin.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Biror kishining telefon raqamini terishdan oldin vaqtincha eslab turish.<\/li><li>Suhbatdosh aytgan gapni javob berish uchun qisqa vaqt yodda saqlash.<\/li><li>Do‘konda sotuvchi aytgan narxni bir necha soniya eslab turish.<\/li><li>Yangi eshitilgan so‘z yoki raqamlarni vaqtincha yodda saqlash.<\/li><\/ul>\n<p>Qisqa muddatli xotira insonning hozirgi faoliyatini amalga oshirish uchun zarur bo‘lgan ma’lumotlarni vaqtincha saqlaydi.<\/p>\n<h4>2. Uzoq muddatli xotira<\/h4>\n<p>Uzoq muddatli xotira — ma’lumotlarning uzoq vaqt, ya’ni bir necha kun, oy, yil yoki hatto butun umr davomida saqlanishini ta’minlaydigan xotira turidir. Bu xotira insonning bilimlari, hayotiy tajribasi, ko‘nikmalari va malakalarini o‘zida mujassamlashtiradi.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<ul><li>Ma’lumotlar uzoq vaqt davomida saqlanadi.<\/li><li>Axborot hajmi juda katta bo‘lishi mumkin.<\/li><li>Tushunish, takrorlash va ma’lumotlarni o‘zaro bog‘lash uning mustahkamlanishiga yordam beradi.<\/li><li>Insonning oldingi tajribasi va bilimlaridan foydalanishini ta’minlaydi.<\/li><li>Zarur vaziyatlarda ma’lumotlar esga tushiriladi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Insonning ona tilini bilishi.<\/li><li>Maktabda o‘rgangan matematik qoidalarini yillar davomida eslab yurishi.<\/li><li>Bolalikdagi muhim voqealarni eslashi.<\/li><li>Velosiped haydash yoki suzish kabi ko‘nikmalarni uzoq vaqt saqlab qolishi.<\/li><\/ul>\n<p>Uzoq muddatli xotira insonning bilim va tajribalarini to‘plashida, shaxs sifatida shakllanishida hamda turli vaziyatlarda to‘g‘ri qaror qabul qilishida muhim rol o‘ynaydi.<\/p>\n<h4>3. Operativ xotira<\/h4>\n<p>Operativ xotira — inson muayyan faoliyat yoki vazifani bajarish jarayonida zarur bo‘lgan ma’lumotlarni vaqtincha esda saqlashi va ulardan foydalanishidir. Bu xotira faoliyatning maqsadi va davomiyligiga bog‘liq bo‘lib, vazifa bajarib bo‘lingandan keyin ushbu ma’lumotlarga ehtiyoj kamayishi mumkin.<\/p>\n<p>Asosiy xususiyatlari:<\/p>\n<p>-<\/p>\n<p>-<\/p>\n<ul><li>Ma’lum bir vazifani bajarishga xizmat qiladi.<\/li><li>Kerakli ma’lumotlarni faoliyat davomida vaqtincha saqlaydi.<\/li><li>Ma’lumotlarni esda saqlash bilan birga ularni qayta ishlash va ulardan foydalanishni ham ta’minlaydi.<\/li><li>Faoliyat tugagach, ayrim ma’lumotlar xotirada saqlanishi mumkin, boshqalari esa ahamiyatini yo‘qotadi.<\/li><\/ul>\n<p>-<\/p>\n<ul><li>Diqqat va tafakkur bilan chambarchas bog‘liq.<\/li><\/ul>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Matematik misolni yechayotganda oraliq natijalarni eslab turish.<\/li><li>Oshpazning taom tayyorlash davomida retseptdagi ketma-ketlikni yodda saqlashi.<\/li><li>Haydovchining yo‘l harakati vaziyatini kuzatib, kerakli ma’lumotlarni hisobga olishi.<\/li><li>Talabaning matnni o‘qib, asosiy fikrlarni eslab turib, uni qayta hikoya qilishi.<\/li><\/ul>\n<p>Operativ xotira murakkab vazifalarni bajarish, ma’lumotlarni qayta ishlash va faoliyatni izchil tashkil etishda muhim ahamiyatga ega.<\/p>\n<h4>4. Qisqa muddatli, uzoq muddatli va operativ xotiraning farqlari<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Xotira turi<\/strong><\/th><th><strong>Asosiy xususiyati<\/strong><\/th><th><strong>Misol<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Qisqa muddatli xotira<\/td><td>Ma’lumotni qisqa vaqt saqlaydi.<\/td><td>Telefon raqamini terishdan oldin eslab turish.<\/td><\/tr><tr><td>Uzoq muddatli xotira<\/td><td>Ma’lumotni uzoq vaqt saqlaydi.<\/td><td>Ona tilini yoki bolalikdagi voqealarni eslash.<\/td><\/tr><tr><td>Operativ xotira<\/td><td>Muayyan vazifani bajarish uchun kerakli ma’lumotni vaqtincha saqlaydi va ishlatadi.<\/td><td>Matematik misolni yechishda oraliq natijalarni eslab turish.<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>5. Xotira turlarining o‘zaro bog‘liqligi<\/h4>\n<p>Ushbu xotira turlari inson faoliyatida bir-biri bilan uzviy bog‘liq holda ishlaydi. Masalan, talaba yangi mavzuni o‘qiyotganda ma’lumotlarni dastlab qisqa muddatli xotirasida ushlab turadi. Mavzuni tushunib, takrorlab va mustahkamlab borishi natijasida bilimlar uzoq muddatli xotirada saqlanadi. Imtihon paytida esa savollarga javob berish uchun kerakli ma’lumotlarni operativ xotirasida faol ishlatadi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Qisqa muddatli, uzoq muddatli va operativ xotira insonning axborot bilan ishlashida turli vazifalarni bajaradi. Qisqa muddatli xotira ma’lumotni qisqa vaqt saqlaydi, uzoq muddatli xotira bilim va tajribalarni uzoq vaqt davomida saqlashga xizmat qiladi, operativ xotira esa muayyan faoliyatni bajarish davomida zarur ma’lumotlarni vaqtincha ushlab turish va ulardan foydalanishni ta’minlaydi. Ushbu xotira turlarining birgalikdagi faoliyati insonning samarali fikrlashi, o‘qishi va mehnat qilishiga yordam beradi.<\/p>"}, {"n": 42, "title": "Unutish nima va uning yuzaga kelishiga qanday omillar ta’sir qiladi?", "html": "<p>Unutish — avval esda olib qolingan ma’lumotlar, bilimlar, taassurotlar va tajribalarni xotiradan qayta tiklashning qiyinlashishi yoki ularni butunlay eslay olmaslik jarayonidir. Unutish xotiraning tabiiy jarayonlaridan biri hisoblanadi. Inson hayoti davomida juda ko‘p ma’lumotlarni qabul qiladi, ammo ularning barchasini bir xil darajada eslab qola olmaydi.<\/p>\n<p>Unutish inson xotirasida keraksiz yoki kam foydalaniladigan ma’lumotlarning asta-sekin yo‘qolishiga olib kelishi mumkin. Biroq muhim bilimlarning ham unutilishi mumkin. Shu sababli ma’lumotlarni muntazam takrorlash va amaliyotda qo‘llash muhimdir.<\/p>\n<h4>1. Unutishning asosiy xususiyatlari<\/h4>\n<ul><li>Unutish vaqt o‘tishi bilan sodir bo‘lishi mumkin.<\/li><li>Yaxshi o‘zlashtirilmagan ma’lumotlar tezroq unutiladi.<\/li><li>Takrorlanmaydigan va amaliyotda qo‘llanmaydigan bilimlar asta-sekin xotiradan chiqishi mumkin.<\/li><li>Kuchli hissiy taassurot qoldirgan voqealar uzoq vaqt esda saqlanishi mumkin.<\/li><li>Ayrim ma’lumotlar butunlay yo‘qolmaydi, balki ularni esga tushirish vaqtincha qiyinlashadi.<\/li><\/ul>\n<h4>2. Unutishning yuzaga kelishiga ta’sir qiluvchi omillar<\/h4>\n<p>Unutish jarayoniga bir qancha psixologik va fiziologik omillar ta’sir qiladi.<\/p>\n<ul><li>1) Vaqtning o‘tishi.<\/li><\/ul>\n<p>Ma’lumot esda olib qolingandan keyin undan uzoq vaqt foydalanilmasa, uni esga tushirish qiyinlashishi mumkin. Ayniqsa, yangi o‘rganilgan va yetarlicha mustahkamlanmagan ma’lumotlar tezroq unutiladi.<\/p>\n<p><strong>Misol:<\/strong> Talaba imtihondan keyin o‘rgangan mavzularini uzoq vaqt takrorlamasa, ularning ayrimlarini unutishi mumkin.<\/p>\n<h4>2) Takrorlashning yetishmasligi.<\/h4>\n<p>Ma’lumotlarni takrorlash xotirada mustahkamlanishiga yordam beradi. Agar o‘rganilgan bilimlar qayta ko‘rib chiqilmasa, vaqt o‘tishi bilan ularni eslash qiyinlashadi.<\/p>\n<p><strong>Misol:<\/strong> Yangi til o‘rgangan inson chet tilidagi so‘zlarni muntazam takrorlamasa, ularni unutib qo‘yishi mumkin.<\/p>\n<h4>3) Diqqatning yetishmasligi.<\/h4>\n<p>Ma’lumotni esda olib qolish jarayonida diqqat muhim ahamiyatga ega. Inson ma’lumotni diqqat bilan tinglamasa yoki o‘rganmasa, uni to‘liq o‘zlashtira olmaydi. Natijada keyinchalik esga tushirish qiyinlashadi.<\/p>\n<p><strong>Misol:<\/strong> Talaba dars vaqtida telefon bilan band bo‘lsa, o‘qituvchi tushuntirgan mavzuni yaxshi eslab qolmasligi mumkin.<\/p>\n<h4>4) Charchoq va uyqusizlik.<\/h4>\n<p>Jismoniy va aqliy charchoq, uyquning yetishmasligi diqqat va xotira faoliyatiga salbiy ta’sir ko‘rsatishi mumkin. Bunday holatda inson yangi ma’lumotlarni o‘zlashtirishda va avvalgi bilimlarini esga tushirishda qiynaladi.<\/p>\n<p><strong>Misol:<\/strong> Tun bo‘yi uxlamasdan imtihonga tayyorlangan talaba imtihon vaqtida o‘rgangan ma’lumotlarini eslay olmasligi mumkin.<\/p>\n<ol><li value=\"5\">Hissiy holat va ruhiy zo‘riqish.<\/li><\/ol>\n<p>Kuchli stress, qo‘rquv, xavotir va hayajon xotira faoliyatiga ta’sir qiladi. Ayniqsa, kuchli hayajon vaqtida inson kerakli ma’lumotni esga tushirishda qiynalishi mumkin.<\/p>\n<p><strong>Misol:<\/strong> Talaba imtihon paytida qattiq hayajonlangani sababli yaxshi bilgan savoliga javob bera olmay qolishi mumkin.<\/p>\n<ol><li value=\"6\">Boshqa ma’lumotlarning ta’siri (interferensiya).<\/li><\/ol>\n<p>Yangi va eski ma’lumotlarning bir-biriga xalaqit berishi natijasida unutish yuzaga kelishi mumkin. Psixologiyada bu hodisa interferensiya deb ataladi.<\/p>\n<p>Interferensiyaning ikki asosiy turi mavjud:<\/p>\n<ul><li>Proaktiv interferensiya — oldin o‘zlashtirilgan ma’lumotlarning yangi ma’lumotlarni esda olib qolishga xalaqit berishi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Birinchi o‘rganilgan chet tilidagi so‘zlar ikkinchi chet tilidagi so‘zlarni o‘zlashtirishga xalaqit berishi mumkin.<\/p>\n<ul><li>Retroaktiv interferensiya — yangi o‘zlashtirilgan ma’lumotlarning avvalgi ma’lumotlarni esga tushirishga xalaqit berishi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Yangi telefon raqamini yodlab olgandan keyin eski telefon raqamini eslash qiyinlashishi mumkin.<\/p>\n<ol><li value=\"7\">Ma’lumotning mazmunini tushunmaslik.<\/li><\/ol>\n<p>Inson ma’lumotni faqat mexanik ravishda yodlasa, uning mazmunini tushunmasa, keyinchalik uni esga tushirish qiyin bo‘lishi mumkin. Tushunib o‘rganilgan bilimlar esa boshqa bilimlar bilan mantiqiy bog‘lanadi va yaxshiroq saqlanadi.<\/p>\n<p><strong>Misol:<\/strong> Talaba psixologik ta’riflarni ma’nosini tushunmasdan yodlasa, imtihonda ularni chalkashtirib yuborishi mumkin.<\/p>\n<ol><li value=\"8\">Qiziqish va motivatsiyaning pastligi.<\/li><\/ol>\n<p>Inson o‘zi uchun qiziq bo‘lmagan yoki ahamiyatsiz deb hisoblagan ma’lumotlarni yaxshi o‘zlashtirmasligi mumkin. Qiziqish va ichki motivatsiya esa esda olib qolish samaradorligini oshiradi.<\/p>\n<p><strong>Misol:<\/strong> Futbolga qiziqadigan inson futbolchilar va jamoalar haqidagi ma’lumotlarni oson eslab qolishi, lekin qiziqmagan mavzularni tez unutishi mumkin.<\/p>\n<h4>3. Unutishning oldini olish va xotirani mustahkamlash yo‘llari<\/h4>\n<p>Unutishni butunlay yo‘qotish mumkin emas, chunki u xotiraning tabiiy jarayonidir. Ammo quyidagi usullar yordamida ma’lumotlarni uzoqroq saqlash va esga tushirishni osonlashtirish mumkin:<\/p>\n<ol><li value=
