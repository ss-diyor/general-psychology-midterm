\"1\">O‘rganilgan ma’lumotlarni muntazam takrorlash.<\/li><li value=\"2\">Ma’lumotlarni tushunib, mazmuniga e’tibor berib o‘rganish.<\/li><li value=\"3\">Yangi bilimlarni avvalgi bilimlar bilan bog‘lash.<\/li><li value=\"4\">Muhim ma’lumotlarni yozib borish va reja tuzish.<\/li><li value=\"5\">Yetarli va sifatli uxlash.<\/li><li value=\"6\">Diqqatni jamlash va chalg‘ituvchi omillarni kamaytirish.<\/li><li value=\"7\">O‘rganilgan bilimlarni amaliyotda qo‘llash.<\/li><li value=\"8\">Dam olish va aqliy faoliyat o‘rtasida muvozanat saqlash.<\/li><\/ol>\n<h4>Xulosa<\/h4>\n<p>Unutish — avval esda olib qolingan ma’lumotlarni qayta tiklashning qiyinlashishi yoki ularni eslay olmaslik jarayonidir. Uning yuzaga kelishiga vaqtning o‘tishi, takrorlashning yetishmasligi, diqqatning sustligi, charchoq, uyqusizlik, stress, interferensiya va ma’lumotni tushunmasdan yodlash kabi omillar ta’sir qiladi. Muntazam takrorlash, tushunib o‘rganish, yetarli dam olish va bilimlarni amaliyotda qo‘llash xotirani mustahkamlashga yordam beradi.<\/p>"}, {"n": 43, "title": "Xotirani rivojlantirish va samarali eslab qolish uchun qanday usullardan foydalaniladi?", "html": "<p>Xotira — insonning ma’lumotlarni esda olib qolish, saqlash va kerakli vaqtda qayta tiklash qobiliyatidir. Xotira insonning ta’lim olishi, fikrlashi, tajriba orttirishi va kundalik faoliyatida muhim ahamiyatga ega.<\/p>\n<p>Xotirani rivojlantirish — insonning ma’lumotlarni tezroq, aniqroq va uzoqroq muddat esda saqlash qobiliyatini takomillashtirish jarayonidir. Xotira tug‘ma qobiliyat bilangina cheklanmaydi, balki muntazam mashq, to‘g‘ri o‘rganish usullari va sog‘lom turmush tarzi orqali ham rivojlanadi.<\/p>\n<p>Xotirani rivojlantirish va samarali eslab qolish uchun quyidagi usullardan foydalaniladi.<\/p>\n<h4>1. Takrorlash usuli<\/h4>\n<p>Takrorlash — o‘rganilgan ma’lumotlarni ma’lum vaqt oralig‘ida qayta ko‘rib chiqish va esga tushirish orqali xotirada mustahkamlash usulidir.<\/p>\n<p>Takrorlash yangi bilimlarning uzoq muddatli xotirada saqlanishiga yordam beradi. Bir ma’lumotni faqat bir marta o‘qish bilan cheklanib qolmasdan, uni bir necha marta takrorlash samaraliroq hisoblanadi.<\/p>\n<p>Masalan, talaba yangi mavzuni o‘qigandan keyin uni bir necha soatdan so‘ng, ertasi kuni va bir necha kundan keyin yana takrorlashi mumkin.<\/p>\n<h4>2. Tushunib eslab qolish usuli<\/h4>\n<p>Bu usulda ma’lumotlarni shunchaki yodlash emas, balki ularning mazmuni va mohiyatini anglash muhim hisoblanadi.<\/p>\n<p>Tushunib o‘rganilgan ma’lumotlar insonning avvalgi bilimlari bilan bog‘lanadi va ularni esga tushirish osonlashadi.<\/p>\n<p>Masalan, talaba psixologik tushunchalarni faqat ta’rifini yodlash orqali emas, balki ularning mazmunini tushunib, hayotiy misollar bilan o‘rgansa, bilimlari mustahkamroq bo‘ladi.<\/p>\n<h4>3. Assotsiatsiya usuli<\/h4>\n<p>Assotsiatsiya — yangi ma’lumotlarni avvaldan ma’lum bo‘lgan narsa, hodisa, tushuncha yoki obrazlar bilan bog‘lash usulidir.<\/p>\n<p>Bu usul inson xotirasida turli ma’lumotlar o‘rtasida bog‘lanishlar hosil bo‘lishiga yordam beradi.<\/p>\n<p>Masalan, yangi so‘zni o‘rganayotganda uni o‘zbek tilidagi o‘xshash so‘z yoki ma’lum bir obraz bilan bog‘lash mumkin. Natijada yangi so‘zni eslab qolish osonlashadi.<\/p>\n<h4>4. Guruhlash usuli<\/h4>\n<p>Guruhlash — katta hajmdagi ma’lumotlarni mazmuniga, xususiyatiga yoki o‘xshashligiga qarab kichik guruhlarga ajratish usulidir.<\/p>\n<p>Bu usul ma’lumotlarni tartibga solish va eslab qolishni yengillashtiradi.<\/p>\n<p>Masalan, talaba xotira turlarini alohida-alohida yodlash o‘rniga ularni harakat, emotsional, obrazli va so‘z-mantiq xotirasi kabi guruhlarga ajratib o‘rganishi mumkin.<\/p>\n<h4>5. Reja va konspekt tuzish usuli<\/h4>\n<p>O‘rganilayotgan mavzuning asosiy fikrlarini ajratib, ularni reja yoki konspekt shaklida yozib borish xotirani mustahkamlashga yordam beradi.<\/p>\n<p>Bunda inson ma’lumotlarni tahlil qiladi, muhim va ikkinchi darajali fikrlarni farqlaydi hamda ularni tartibga soladi.<\/p>\n<p>Masalan, katta mavzuni o‘qib, uning asosiy tushunchalari, ta’riflari va misollarini qisqacha yozib olish mumkin.<\/p>\n<h4>6. Tasavvur va obrazlardan foydalanish<\/h4>\n<p>Bu usulda ma’lumotlar turli tasvirlar, rasmlar, belgilar va obrazlar bilan bog‘lanadi. Inson ko‘rish orqali hosil qilgan obrazlarini eslab qolishi va qayta tiklashi mumkin.<\/p>\n<p>Masalan, tarixiy voqealarni o‘rganishda xaritalar, rasmlar va vaqt chizig‘idan foydalanish ma’lumotlarni yaxshiroq o‘zlashtirishga yordam beradi.<\/p>\n<h4>7. Mnemonik usul<\/h4>\n<p>Mnemonika — murakkab yoki katta hajmdagi ma’lumotlarni oson eslab qolish uchun maxsus eslab qolish usullari, belgilar, qisqartmalar, qofiyalar va obrazlardan foydalanishdir.<\/p>\n<p>Bu usul ayniqsa raqamlar, sanalar, formulalar, atamalar va ketma-ketliklarni eslab qolishda foydalidir.<\/p>\n<p>Masalan, bir nechta tushunchaning bosh harflaridan qisqartma so‘z tuzish yoki ma’lumotlarni esda qoladigan kichik hikoya bilan bog‘lash mumkin.<\/p>\n<h4>8. O‘ziga-o‘zi tushuntirish va qayta hikoya qilish<\/h4>\n<p>O‘rganilgan ma’lumotni kitobga qaramasdan o‘z so‘zlari bilan tushuntirish xotirani rivojlantirishning samarali usullaridan biridir.<\/p>\n<p>Bu usulda inson ma’lumotni xotirasidan mustaqil ravishda qayta tiklaydi, tushunmagan joylarini aniqlaydi va bilimlarini mustahkamlaydi.<\/p>\n<p>Masalan, talaba mavzuni o‘qib bo‘lgach, kitobni yopib, uni xuddi o‘qituvchidek tushuntirib berishga harakat qiladi.<\/p>\n<h4>9. Amaliy mashq qilish<\/h4>\n<p>O‘rganilgan bilimlarni amaliy faoliyatda qo‘llash ularning xotirada mustahkamlanishiga yordam beradi.<\/p>\n<p><strong>Masalan:<\/strong><\/p>\n<ul><li>Chet tilini o‘rganishda yangi so‘zlardan gaplar tuzish.<\/li><li>Matematik formulalarni misollar yechishda qo‘llash.<\/li><li>Psixologik tushunchalarni kundalik hayotdagi vaziyatlar bilan bog‘lash.<\/li><li>Yangi ko‘nikmalarni muntazam mashq qilish.<\/li><\/ul>\n<h4>10. Yetarli uyqu va dam olish<\/h4>\n<p>Xotiraning samarali ishlashi uchun insonning jismoniy va ruhiy holati ham muhimdir. Yetarli uyqu, muntazam dam olish va ortiqcha charchoqdan saqlanish ma’lumotlarni o‘zlashtirishga yordam beradi.<\/p>\n<p>Uyqu vaqtida kun davomida olingan ayrim ma’lumotlar xotirada mustahkamlanadi. Shu sababli uzoq vaqt tanaffussiz o‘qishdan ko‘ra, o‘qish va dam olishni navbatlashtirish foydali.<\/p>\n<h4>11. Jismoniy faollik va sog‘lom turmush tarzi<\/h4>\n<p>Muntazam jismoniy mashqlar, to‘g‘ri ovqatlanish va kun tartibiga rioya qilish miya faoliyatini qo‘llab-quvvatlaydi.<\/p>\n<p>Masalan, piyoda yurish, yengil jismoniy mashqlar bajarish va yetarli dam olish diqqatni jamlash hamda o‘rganish samaradorligiga ijobiy ta’sir ko‘rsatishi mumkin.<\/p>\n<h4>12. Diqqatni jamlash<\/h4>\n<p>Ma’lumotni yaxshi eslab qolish uchun avvalo unga diqqatni qaratish kerak. Telefon, televizor, ortiqcha shovqin va boshqa chalg‘ituvchi omillar esda olib qolish samaradorligini pasaytirishi mumkin.<\/p>\n<p>Shuning uchun o‘qish vaqtida tinch joy tanlash, bir vaqtning o‘zida bitta vazifaga e’tibor berish va qisqa tanaffuslar qilish tavsiya etiladi.<\/p>\n<h4>4. Samarali eslab qolishning amaliy tartibi<\/h4>\n<p>Masalan, talaba biror mavzuni samarali o‘rganish uchun quyidagi ketma-ketlikdan foydalanishi mumkin:<\/p>\n<ol><li value=\"1\">Mavzuni diqqat bilan o‘qib chiqish.<\/li><li value=\"2\">Asosiy tushuncha va ta’riflarni ajratib olish.<\/li><li value=\"3\">O‘qilgan ma’lumotning mazmunini tushunish.<\/li><li value=\"4\">Muhim fikrlarni konspekt qilish.<\/li><li value=\"5\">Mavzuni avvalgi bilimlar bilan bog‘lash.<\/li><li value=\"6\">Kitobni yopib, o‘rganganlarini esga tushirish.<\/li><li value=\"7\">Tushunmagan joylarini qayta o‘rganish.<\/li><li value=\"8\">Ma’lum vaqt oralig‘ida mavzuni takrorlash.<\/li><\/ol>\n<h4>Xulosa<\/h4>\n<p>Xotirani rivojlantirish va samarali eslab qolish uchun takrorlash, tushunib o‘rganish, assotsiatsiya, guruhlash, mnemonika, tasavvur, konspekt tuzish va qayta hikoya qilish kabi usullardan foydalaniladi. Bundan tashqari, yetarli uyqu, jismoniy faollik, sog‘lom turmush tarzi va diqqatni jamlash ham xotira faoliyatini yaxshilashda muhim ahamiyatga ega.<\/p>\n<p>Demak, xotirani rivojlantirish muntazam mashq va to‘g‘ri o‘rganish usullariga bog‘liq. Inson ma’lumotlarni qanchalik yaxshi tushunsa, ularni o‘zaro bog‘lasa va amaliyotda qo‘llasa, bilimlarini shunchalik samarali eslab qolishi mumkin.<\/p>"}, {"n": 44, "title": "Tafakkur nima va uning sezgi hamda idrokdan farqi nimada?", "html": "<p>Tafakkur — insonning borliqdagi narsa va hodisalarni, ularning muhim xususiyatlari, o‘zaro bog‘lanishlari va qonuniyatlarini umumlashtirib, bilvosita va chuqur anglash jarayonidir. Tafakkur insonning fikrlashi, tahlil qilishi, taqqoslashi, xulosa chiqarishi va muammolarga yechim topishida namoyon bo‘ladi.<\/p>\n<p>Tafakkur yordamida inson faqat ko‘rib yoki eshitib turgan narsalarni emas, balki bevosita sezgi organlari orqali bilib bo‘lmaydigan hodisalarni ham anglay oladi.<\/p>\n<h4>1. Tafakkurning asosiy xususiyatlari<\/h4>\n<ol><li value=\"1\">Umumlashtirish — narsa va hodisalarning umumiy, muhim belgilarini ajratib olish. Masalan, olma, nok va shaftolining meva ekanligini anglash.<\/li><li value=\"2\">Tahlil qilish — narsa yoki hodisani qismlarga ajratib o‘rganish.<\/li><li value=\"3\">Sintez qilish — alohida qismlarni birlashtirib, yaxlit tushuncha hosil qilish.<\/li><li value=\"4\">Taqqoslash — narsa va hodisalarning o‘xshash hamda farqli tomonlarini aniqlash.<\/li><li value=\"5\">Abstraksiyalash — muhim belgilarni ajratib, ikkinchi darajali belgilarni chetga surish.<\/li><li value=\"6\">Xulosa chiqarish — mavjud bilimlar asosida yangi fikr va natijaga kelish.<\/li><\/ol>\n<h4>2. Sezgi, idrok va tafakkurning farqi<\/h4>\n<p>Sezgi — narsa va hodisalarning ayrim xususiyatlarini sezgi organlari orqali aks ettirish jarayoni. Masalan, olmaning shirinligini tatib bilish, rangini ko‘rish yoki hidini sezish.<\/p>\n<p>Idrok — narsa va hodisalarni barcha muhim belgilarining yaxlit majmuasi sifatida ongda aks ettirish jarayoni. Masalan, olmani ko‘rib, uning shakli, rangi, hajmi va boshqa xususiyatlari orqali uni yaxlit predmet sifatida tanish.<\/p>\n<p>Tafakkur — narsa va hodisalarning mohiyatini, sabablarini va o‘zaro bog‘liqligini fikrlash orqali anglash jarayoni. Masalan, olmaning nima sababdan pishishi, qanday sharoitda o‘sishi va inson organizmiga qanday foyda keltirishini tushunish.<\/p>\n<h4>3. Ularning o‘zaro farqi<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Bilish jarayoni<\/strong><\/th><th><strong>Asosiy xususiyati<\/strong><\/th><th><strong>Misol<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Sezgi<\/td><td>Alohida xususiyatlarni aks ettiradi<\/td><td>Olmaning shirinligini sezish<\/td><\/tr><tr><td>Idrok<\/td><td>Predmetni yaxlit aks ettiradi<\/td><td>Olmani butun holda tanish<\/td><\/tr><tr><td>Tafakkur<\/td><td>Mohiyat va qonuniyatlarni anglaydi<\/td><td>Olmaning nima sababdan pishishini tushunish<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>4. Tafakkurning inson hayotidagi ahamiyati<\/h4>\n<ul><li>Muammolarni hal qilishga yordam beradi.<\/li><li>To‘g‘ri qaror qabul qilish imkonini yaratadi.<\/li><li>Yangi bilim va tushunchalarni shakllantiradi.<\/li><li>Insonning ijodiy qobiliyatini rivojlantiradi.<\/li><li>Voqea-hodisalarning sabab va oqibatlarini tushunishga yordam beradi.<\/li><li>Kelajakni rejalashtirish va oldindan xulosa chiqarish imkonini beradi.<\/li><\/ul>\n<p><strong>Xulosa:<\/strong> Sezgi narsa va hodisalarning ayrim belgilarini, idrok ularning yaxlit obrazini, tafakkur esa mohiyati va o‘zaro qonuniy bog‘lanishlarini aks ettiradi. Bu uchala bilish jarayoni bir-biri bilan chambarchas bog‘liq bo‘lib, insonning atrof-muhitni anglashida muhim o‘rin tutadi.<\/p>"}, {"n": 45, "title": "Analiz, sintez, taqqoslash, abstraksiyalash va umumlashtirish nimani anglatadi?", "html": "<p>Bular tafakkurning asosiy mantiqiy operatsiyalari hisoblanadi. Inson ushbu operatsiyalar yordamida narsa va hodisalarni o‘rganadi, ularning muhim belgilarini aniqlaydi, o‘zaro bog‘liqligini tushunadi va xulosa chiqaradi.<\/p>\n<h4>1. Analiz (tahlil)<\/h4>\n<p>Analiz — narsa va hodisalarni fikran tarkibiy qismlarga, belgilarga va xususiyatlarga ajratib o‘rganish jarayoni.<\/p>\n<p>Masalan, inson biror kitobni tahlil qilganda uning muqovasi, mazmuni, mavzusi, asosiy g‘oyasi va qahramonlarini alohida o‘rganadi.<\/p>\n<h4>2. Sintez (birlashtirish)<\/h4>\n<p>Sintez — narsa va hodisalarning alohida qismlari, belgilari va xususiyatlarini fikran birlashtirib, yaxlit holda o‘rganish jarayoni.<\/p>\n<p>Masalan, kitobning mavzusi, qahramonlari va asosiy g‘oyasini birlashtirib, uning umumiy mazmunini tushunish sintez hisoblanadi.<\/p>\n<h4>3. Taqqoslash<\/h4>\n<p>Taqqoslash — narsa va hodisalarning o‘xshash hamda farqli tomonlarini aniqlash jarayoni.<\/p>\n<p>Masalan, inson olma va nokni taqqoslab, ularning ikkalasi ham meva ekanligini, lekin shakli, ta'mi va rangida farqlar borligini aniqlaydi.<\/p>\n<h4>4. Abstraksiyalash (mavhumlashtirish)<\/h4>\n<p>Abstraksiyalash — narsa va hodisalarning muhim xususiyatlarini ajratib olib, ikkinchi darajali belgilaridan fikran chetlashish jarayoni.<\/p>\n<p>Masalan, turli rang va shakldagi jismlarni o‘rganishda ularning rangiga e'tibor bermasdan, faqat geometrik shakliga e'tibor qaratish abstraksiyalashdir.<\/p>\n<h4>5. Umumlashtirish<\/h4>\n<p>Umumlashtirish — bir guruh narsa va hodisalarning umumiy, muhim belgilarini aniqlash va ularni yagona tushuncha ostida birlashtirish jarayoni.<\/p>\n<p>Masalan, olma, nok, shaftoli va uzumni kuzatib, ularning barchasi meva ekanligi haqida xulosa chiqarish umumlashtirish hisoblanadi.<\/p>\n<h4>6. Tafakkur operatsiyalarining o‘zaro bog‘liqligi<\/h4>\n<p>Bu operatsiyalar bir-biri bilan chambarchas bog‘liq va ko‘pincha birgalikda amalga oshadi.<\/p>\n<p>Masalan, talaba inson xotirasini o‘rganayotganda:<\/p>\n<ul><li>Analiz orqali xotiraning turlarini alohida o‘rganadi.<\/li><li>Sintez orqali ularni bir butun tizim sifatida tushunadi.<\/li><li>Taqqoslash orqali xotira turlarining o‘xshash va farqli jihatlarini aniqlaydi.<\/li><li>Abstraksiyalash orqali xotiraning eng muhim xususiyatlarini ajratib oladi.<\/li><li>Umumlashtirish orqali xotira haqida umumiy xulosa chiqaradi.<\/li><\/ul>\n<p><strong>Xulosa:<\/strong> Analiz, sintez, taqqoslash, abstraksiyalash va umumlashtirish inson tafakkurining asosiy operatsiyalaridir. Ular bilimlarni chuqur o‘zlashtirish, voqea-hodisalarni anglash, muammolarni hal qilish va to‘g‘ri xulosa chiqarishga yordam beradi.<\/p>"}, {"n": 46, "title": "Tushuncha, hukm va xulosa chiqarish tafakkur shakllari sifatida qanday farqlanadi?", "html": "<p>Tushuncha, hukm va xulosa chiqarish — tafakkurning asosiy mantiqiy shakllari hisoblanadi. Inson ushbu shakllar yordamida narsa va hodisalarning mohiyatini anglaydi, ular haqida fikr yuritadi va yangi bilimlarga ega bo‘ladi.<\/p>\n<h4>1. Tushuncha<\/h4>\n<p>Tushuncha — narsa va hodisalarning muhim, umumiy va o‘ziga xos belgilarini ongda aks ettiruvchi tafakkur shaklidir.<\/p>\n<p>Tushuncha orqali inson predmet va hodisalarni bir-biridan farqlaydi, ularning umumiy xususiyatlarini aniqlaydi.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Inson — ong va nutqqa ega bo‘lgan ijtimoiy mavjudot.<\/li><li>Daraxt — tanasi, shoxlari va barglari bo‘lgan o‘simlik.<\/li><li>Xotira — ma'lumotlarni esda olib qolish, saqlash va esga tushirish jarayoni.<\/li><\/ul>\n<p>Tushunchalar so‘zlar va atamalar orqali ifodalanadi.<\/p>\n<h4>2. Hukm<\/h4>\n<p>Hukm — narsa va hodisalar, ularning belgilari hamda o‘zaro munosabatlari haqida biror fikrni tasdiqlash yoki inkor etish shaklidir.<\/p>\n<p>Hukm orqali inson biror narsa haqida fikr bildiradi va uning to‘g‘ri yoki noto‘g‘riligini baholashi mumkin.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Barcha insonlar fikrlash qobiliyatiga ega.<\/li><li>Tosh suvda cho‘kmaydi.<\/li><li>Xotira bilish jarayonlaridan biridir.<\/li><li>Barcha qushlar ucha olmaydi.<\/li><\/ul>\n<p>Hukm odatda gap shaklida ifodalanadi.<\/p>\n<h4>3. Xulosa chiqarish<\/h4>\n<p>Xulosa chiqarish — bir yoki bir nechta hukmlardan yangi hukm hosil qilish jarayonidir.<\/p>\n<p>Inson avvalgi bilimlari va fikrlariga asoslanib, yangi natijaga keladi.<\/p>\n<p><strong>Misol:<\/strong><\/p>\n<ol><li value=\"1\">Barcha insonlar o‘limga mahkum.<\/li><li value=\"2\">Ali inson.<\/li><li value=\"3\">Demak, Ali ham o‘limga mahkum.<\/li><\/ol>\n<p>Bu yerda dastlabki ikkita fikr asos (hukm) bo‘lib, uchinchi fikr ulardan chiqarilgan xulosadir. Xulosa chiqarishning asosiy turlari:<\/p>\n<ul><li>Deduksiya — umumiy fikrdan xususiy xulosaga kelish.<\/li><li>Induksiya — xususiy holatlardan umumiy xulosaga kelish.<\/li><li>Analogiya — narsa va hodisalarning o‘xshash belgilariga asoslanib xulosa chiqarish.<\/li><\/ul>\n<h4>4. Ularning asosiy farqlari<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Tafakkur shakli<\/strong><\/th><th><strong>Mazmuni<\/strong><\/th><th><strong>Misol<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Tushuncha<\/td><td>Narsa va hodisalarning muhim belgilarini aks ettiradi<\/td><td>Inson, xotira, tafakkur<\/td><\/tr><tr><td>Hukm<\/td><td>Biror narsa haqida fikrni tasdiqlaydi yoki inkor etadi<\/td><td>Inson fikrlash qobiliyatiga ega<\/td><\/tr><tr><td>Xulosa chiqarish<\/td><td>Bir yoki bir nechta hukmdan yangi fikr hosil qiladi<\/td><td>Ali inson, demak, Ali fikrlash qobiliyatiga ega<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>5. Tafakkur shakllarining o‘zaro bog‘liqligi<\/h4>\n<p>Tushuncha, hukm va xulosa chiqarish bir-biri bilan uzviy bog‘liq.<\/p>\n<p>Masalan, talaba xotira mavzusini o‘rganmoqda:<\/p>\n<ol><li value=\"1\">Tushuncha: Xotira — bilish jarayonlaridan biri.<\/li><li value=\"2\">Hukm: Xotira insonning bilim va tajribasini saqlashga yordam beradi.<\/li><li value=\"3\">Xulosa chiqarish: Demak, xotira insonning bilim olishida muhim ahamiyatga ega.<\/li><\/ol>\n<p><strong>Xulosa:<\/strong> Tushuncha narsa va hodisalarning muhim belgilarini aks ettiradi, hukm ular haqida tasdiq yoki inkor shaklida fikr bildiradi, xulosa chiqarish esa mavjud hukmlardan yangi bilim hosil qiladi. Bu uchala shakl insonning fikrlash va bilish faoliyatining asosini tashkil etadi.<\/p>"}, {"n": 47, "title": "Ko‘rgazmali-harakat, ko‘rgazmali-obrazli va mavhum-mantiqiy tafakkur qanday xususiyatlarga ega?", "html": "<p>Tafakkur insonning narsa va hodisalarni anglash, muammolarni hal qilish va xulosa chiqarish jarayonidir. Tafakkur namoyon bo‘lish shakliga ko‘ra uch asosiy turga bo‘linadi: ko‘rgazmaliharakat, ko‘rgazmali-obrazli va mavhum-mantiqiy tafakkur.<\/p>\n<h4>1. Ko‘rgazmali-harakat tafakkuri<\/h4>\n<p>Ko‘rgazmali-harakat tafakkuri — narsa va hodisalarni bevosita amaliy harakatlar orqali bilish va muammolarni amalda bajarish orqali hal qilish jarayonidir.<\/p>\n<p>Bu tafakkur turida inson fikrlash jarayonida predmetlar bilan harakat qiladi, ularni ushlab ko‘radi, o‘zgartiradi va tajriba orqali natijaga erishadi.<\/p>\n<p>Xususiyatlari:<\/p>\n<ul><li>Amaliy harakatlarga asoslanadi.<\/li><li>Bevosita predmetlar bilan ishlash orqali amalga oshadi.<\/li><li>Muammoni tajriba va harakat yordamida hal qiladi.<\/li><li>Ayniqsa, bolalik davrida kuchli rivojlanadi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Bola o‘yinchoqni qanday yig‘ishni tushunish uchun uning qismlarini bir-biriga ulab ko‘radi. Yoki inson buzilgan buyumni tuzatish uchun uning qismlarini tekshirib, amalda harakat qiladi.<\/p>\n<h4>2. Ko‘rgazmali-obrazli tafakkur<\/h4>\n<p>Ko‘rgazmali-obrazli tafakkur — narsa va hodisalarni ularning ongda hosil bo‘lgan obrazlari, tasvirlari va ko‘rinishlari orqali fikran anglash jarayonidir.<\/p>\n<p>Bu tafakkur turida inson predmetning o‘zi bilan bevosita harakat qilmasdan, uning ongdagi tasviri yordamida fikrlaydi.<\/p>\n<p>Xususiyatlari:<\/p>\n<ul><li>Tasavvur va obrazlarga asoslanadi.<\/li><li>Ko‘rish, eshitish va boshqa sezgi tajribalari bilan bog‘liq.<\/li><li>Narsa va hodisalarni xayolda tasvirlash imkonini beradi.<\/li><li>Ijodkorlik va tasavvurni rivojlantirishda muhim ahamiyatga ega.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Me'mor bino qurilishidan oldin uning qanday ko‘rinishda bo‘lishini xayolida tasavvur qiladi. Yoki inson xaritaga qarab, boradigan joyining yo‘lini xayolan tasvirlaydi.<\/p>\n<h4>3. Mavhum-mantiqiy tafakkur<\/h4>\n<p>Mavhum-mantiqiy tafakkur — narsa va hodisalarning bevosita ko‘rinmaydigan muhim xususiyatlari, mohiyati, qonuniyatlari va o‘zaro munosabatlarini tushuncha, hukm va xulosalar orqali anglash jarayonidir.<\/p>\n<p>Bu tafakkur turi so‘zlar, tushunchalar, mantiqiy fikrlash va nazariy bilimlarga asoslanadi. Xususiyatlari:<\/p>\n<ul><li>Mavhum tushunchalar orqali fikrlashga asoslanadi.<\/li><li>Sabab va oqibat munosabatlarini aniqlaydi.<\/li><li>Mantiqiy xulosa chiqarish imkonini beradi.<\/li><li>Murakkab muammolarni nazariy jihatdan hal qilishga yordam beradi.<\/li><li>Ilmiy bilimlarni egallashda muhim o‘rin tutadi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Talaba tortishish qonunini o‘rganib, jismlarning nima sababdan Yerga tushishini mantiqiy ravishda tushuntiradi. Yoki matematik masalani formulalar va mantiqiy amallar yordamida yechadi.<\/p>\n<h4>4. Uch tafakkur turining farqlari<\/h4>\n<p><strong>Tafakkur turi Nimaga asoslanadi?<\/strong><\/p>\n<p><strong>Misol<\/strong><\/p>\n<p>Ko‘rgazmali-harakat Amaliy harakatlarga Buyumni qismlarga ajratib tuzatish<\/p>\n<p>Ko‘rgazmali-obrazli Tasavvur va obrazlarga Binoning ko‘rinishini xayolda tasvirlash Tushuncha va mantiqiy Matematik masalani formula bilan Mavhum-mantiqiy fikrlashga yechish<\/p>\n<h4>5. Tafakkur turlarining inson hayotidagi ahamiyati<\/h4>\n<ul><li>Ko‘rgazmali-harakat tafakkuri amaliy ko‘nikmalarni shakllantiradi.<\/li><li>Ko‘rgazmali-obrazli tafakkur tasavvur va ijodkorlikni rivojlantiradi.<\/li><li>Mavhum-mantiqiy tafakkur ilmiy bilimlarni egallash va murakkab muammolarni hal qilishga yordam beradi.<\/li><\/ul>\n<p><strong>Xulosa:<\/strong> Ko‘rgazmali-harakat tafakkuri amaliy harakatlarga, ko‘rgazmali-obrazli tafakkur tasavvur va obrazlarga, mavhum-mantiqiy tafakkur esa tushuncha va mantiqiy fikrlashga asoslanadi. Ushbu tafakkur turlari bir-biri bilan bog‘liq bo‘lib, insonning aqliy rivojlanishida muhim ahamiyatga ega.<\/p>"}, {"n": 48, "title": "Nutq nima va uning tafakkur bilan aloqasi qanday namoyon bo‘ladi?", "html": "<p>Nutq — insonlarning til vositasida o‘z fikrlari, his-tuyg‘ulari, bilimlari va axborotlarini boshqalarga yetkazish hamda o‘zaro muloqot qilish jarayonidir.<\/p>\n<p>Nutq insonning eng muhim psixologik jarayonlaridan biri bo‘lib, u tafakkur va til bilan chambarchas bog‘liq. Inson nutq orqali o‘z fikrlarini ifodalaydi, boshqalarning fikrlarini tushunadi va bilimlarini boyitadi.<\/p>\n<h4>1. Nutqning asosiy vazifalari<\/h4>\n<ol><li value=\"1\">Kommunikativ vazifa — insonlar o‘rtasida aloqa va muloqotni ta'minlaydi.<\/li><li value=\"2\">Fikrlash vazifasi — fikrlarni shakllantirish, ifodalash va rivojlantirishga yordam beradi.<\/li><li value=\"3\">Bilish vazifasi — yangi bilimlarni egallash va mavjud bilimlarni mustahkamlashga xizmat qiladi.<\/li><li value=\"4\">Ifodalash vazifasi — insonning his-tuyg‘ulari, munosabati va kechinmalarini ifodalaydi.<\/li><li value=\"5\">Tartibga solish vazifasi — insonning o‘z xatti-harakatlarini boshqarishi va nazorat qilishiga yordam beradi.<\/li><\/ol>\n<h4>2. Nutqning asosiy turlari<\/h4>\n<ol><li value=\"1\">Tashqi nutq — insonning o‘z fikrlarini boshqa kishilarga yetkazishi uchun foydalanadigan nutqi.<\/li><\/ol>\n<p>Tashqi nutq ikki turga bo‘linadi:<\/p>\n<ul><li>Og‘zaki nutq — gapirish va suhbatlashish orqali fikr bildirish. Masalan, ma'ruza qilish, suhbatlashish.<\/li><li>Yozma nutq — fikrlarni yozuv orqali ifodalash. Masalan, insho yozish, xat yozish.<\/li><\/ul>\n<ol><li value=\"2\">Ichki nutq — insonning o‘z-o‘zi bilan fikrlashi, ichida gapirishi va fikrlarini tartibga solish jarayoni.<\/li><\/ol>\n<p>Masalan, talaba imtihon savoliga javob berishdan oldin ichida fikrlarini tartibga soladi.<\/p>\n<h4>3. Nutq va tafakkurning o‘zaro aloqasi<\/h4>\n<p>Nutq va tafakkur bir-biri bilan uzviy bog‘liq, ammo ular aynan bir xil jarayon emas.<\/p>\n<p>Ularning aloqasi quyidagilarda namoyon bo‘ladi:<\/p>\n<ol><li value=\"1\">Nutq tafakkurni ifodalaydi. Inson o‘z fikrlarini so‘zlar va gaplar yordamida boshqalarga yetkazadi.<\/li><li value=\"2\">Nutq tafakkurning rivojlanishiga yordam beradi. Inson gapirish, yozish va suhbatlashish orqali fikrlash qobiliyatini rivojlantiradi.<\/li><li value=\"3\">Tafakkur nutqning mazmunini belgilaydi. Inson avval ma'lum bir fikrni shakllantiradi, so‘ng uni nutq orqali ifodalaydi.<\/li><li value=\"4\">Ichki nutq fikrlash jarayonida ishtirok etadi. Inson muammoni hal qilishda yoki qaror qabul qilishda ichki nutqdan foydalanadi.<\/li><li value=\"5\">Nutq orqali bilimlar avloddan avlodga yetkaziladi. Insonlar o‘z tajribasi va bilimlarini boshqalarga tushuntirish orqali uzatadi.<\/li><\/ol>\n<h4>4. Nutq va tafakkurga misol<\/h4>\n<p>Masalan, o‘qituvchi talabaga xotira mavzusini tushuntiradi. Talaba o‘qituvchining nutqini tinglaydi, ma'lumotlarni tafakkur orqali tahlil qiladi, tushunadi va o‘z fikrlarini shakllantiradi. Keyin esa o‘zlashtirgan bilimlarini og‘zaki yoki yozma nutq orqali bayon qiladi.<\/p>\n<p>Bu jarayonda nutq bilimlarni yetkazish va ifodalashga, tafakkur esa ularni anglash va qayta ishlashga xizmat qiladi.<\/p>\n<h4>5. Nutq va tafakkurning farqi<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Nutq<\/strong><\/th><th><strong>Tafakkur<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Fikrlarni til orqali ifodalaydi.<\/td><td>Narsa va hodisalarni anglaydi.<\/td><\/tr><tr><td>Muloqot vositasi hisoblanadi.<\/td><td>Bilish va fikrlash jarayoni hisoblanadi.<\/td><\/tr><tr><td>So‘zlar, gaplar va matnlar orqali namoyon bo‘ladi.<\/td><td>Tahlil, sintez, taqqoslash va xulosa chiqarish orqali namoyon bo‘ladi.<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Fikrni boshqalarga yetkazishga yordam beradi.<\/p>\n<p>Yangi fikr va bilimlarni shakllantiradi.<\/p>\n<p><strong>Xulosa:<\/strong> Nutq va tafakkur insonning aqliy faoliyatida muhim o‘rin tutadi. Tafakkur orqali inson fikr yuritadi va bilimlarni anglaydi, nutq orqali esa ushbu fikrlarni ifodalaydi va boshqalarga yetkazadi. Ular bir-birini rivojlantiradi hamda insonning bilish va muloqot faoliyatining asosini tashkil etadi.<\/p>"}, {"n": 49, "title": "Og‘zaki, yozma va ichki nutq qanday farqlanadi?", "html": "<p>Nutq — insonning til vositasida o‘z fikrlari, his-tuyg‘ulari va bilimlarini ifodalash hamda boshqalar bilan muloqot qilish jarayonidir. Nutq namoyon bo‘lish shakliga ko‘ra og‘zaki, yozma va ichki nutq turlariga bo‘linadi.<\/p>\n<h4>1. Og‘zaki nutq<\/h4>\n<p>Og‘zaki nutq — insonning o‘z fikrlarini tovushlar, so‘zlar va gaplar orqali og‘zaki tarzda ifodalashidir.<\/p>\n<p>Og‘zaki nutq bevosita muloqot qilishning eng keng tarqalgan shaklidir. Unda ovoz ohangi, talaffuz, pauza, mimika va imo-ishoralar muhim ahamiyatga ega.<\/p>\n<p>Xususiyatlari:<\/p>\n<ul><li>Tovushlar orqali amalga oshadi.<\/li><li>Bevosita suhbat va muloqot qilish imkonini beradi.<\/li><li>Ovoz ohangi va talaffuz muhim rol o‘ynaydi.<\/li><li>Suhbat davomida fikrlarni tezkor ifodalash mumkin.<\/li><li>Dialogik va monologik shakllarda namoyon bo‘ladi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong> Ikki kishining suhbatlashishi, o‘qituvchining ma'ruza qilishi, talabani savolga og‘zaki javob berishi.<\/p>\n<h4>2. Yozma nutq<\/h4>\n<p>Yozma nutq — insonning o‘z fikrlarini harflar, so‘zlar, gaplar va matnlar orqali yozma shaklda ifodalashidir.<\/p>\n<p>Yozma nutq orqali inson o‘z fikrlarini saqlab qolishi, boshqalarga yetkazishi va uzoq vaqt davomida foydalanishi mumkin.<\/p>\n<p>Xususiyatlari:<\/p>\n<ul><li>Harflar va yozuv belgilari orqali amalga oshadi.<\/li><li>Fikrlarni oldindan rejalashtirish imkonini beradi.<\/li><li>Grammatik va imloviy qoidalarga rioya qilishni talab etadi.<\/li><li>Ma'lumotlarni uzoq vaqt saqlash va uzatishga yordam beradi.<\/li><li>Odatda og‘zaki nutqqa qaraganda batafsil va tartibli bo‘ladi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong> Insho yozish, kitob yozish, xat yozish, kundalik yuritish va ilmiy maqola tayyorlash.<\/p>\n<h4>3. Ichki nutq<\/h4>\n<p>Ichki nutq — insonning o‘z-o‘zi bilan fikrlashi, ichida gapirishi va o‘z fikrlarini ongida tartibga solish jarayonidir.<\/p>\n<p>Ichki nutq odatda ovoz chiqarib aytilmaydi. U insonning fikrlash faoliyati bilan chambarchas bog‘liq bo‘lib, qaror qabul qilish va muammolarni hal qilishda muhim rol o‘ynaydi. Xususiyatlari:<\/p>\n<ul><li>Ovoz chiqarib gapirish talab qilinmaydi.<\/li><li>Insonning ichki fikrlash jarayonida namoyon bo‘ladi.<\/li><li>Fikrlarni rejalashtirish va tartibga solishga yordam beradi.<\/li><li>O‘z xatti-harakatlarini nazorat qilishda ishtirok etadi.<\/li><li>Ko‘pincha qisqa va ixcham shaklda kechadi.<\/li><\/ul>\n<p><strong>Misollar:<\/strong> Talabaning imtihon savoliga javob berishdan oldin ichida fikrlashi, insonning biror qaror qabul qilishdan oldin o‘ziga savol berishi.<\/p>\n<h4>4. Nutq turlarining asosiy farqlari<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Nutq turi<\/strong><\/th><th><strong>Ifodalanish shakli<\/strong><\/th><th><strong>Asosiy vazifasi<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Og‘zaki nutq<\/td><td>Tovush va so‘zlar orqali<\/td><td>Muloqot qilish va fikr almashish<\/td><\/tr><tr><td>Yozma nutq<\/td><td>Harf va yozuvlar orqali<\/td><td>Fikrlarni yozib ifodalash va saqlash<\/td><\/tr><tr><td>Ichki nutq<\/td><td>Ongdagi fikrlar orqali<\/td><td>Fikrlash va faoliyatni rejalashtirish<\/td><\/tr><\/tbody><\/table><\/div>\n<h4>5. Nutq turlarining o‘zaro bog‘liqligi<\/h4>\n<p>Og‘zaki, yozma va ichki nutq bir-biri bilan chambarchas bog‘liq.<\/p>\n<p>Masalan, talaba biror mavzuda ma'ruza tayyorlayotganda:<\/p>\n<ul><li>Avval ichki nutq orqali fikrlarini shakllantiradi.<\/li><li>Keyin yozma nutq orqali ma'ruza matnini tayyorlaydi.<\/li><li>Oxirida og‘zaki nutq orqali ma'ruzani tinglovchilarga yetkazadi.<\/li><\/ul>\n<p><strong>Xulosa:<\/strong> Og‘zaki nutq tovushlar orqali, yozma nutq yozuv belgilari orqali, ichki nutq esa insonning ongida kechadigan fikrlash jarayoni orqali namoyon bo‘ladi. Uchala nutq turi ham insonning tafakkuri, bilim olishi va muloqot qilishida muhim ahamiyatga ega.<\/p>"}, {"n": 50, "title": "Intellekt nima va uning tafakkur hamda bilim bilan munosabati qanday tushuntiriladi?", "html": "<p>Intellekt — insonning bilim olish, fikrlash, muammolarni hal qilish, yangi vaziyatlarga moslashish, tajribadan foydalanish va to‘g‘ri qaror qabul qilish qobiliyatidir.<\/p>\n<p>Intellekt insonning aqliy imkoniyatlarini ifodalaydi. U insonning atrof-muhitni anglashida, yangi bilimlarni o‘zlashtirishida va hayotiy vaziyatlarda oqilona harakat qilishida muhim ahamiyatga ega.<\/p>\n<h4>1. Intellektning asosiy xususiyatlari<\/h4>\n<ol><li value=\"1\">Bilish qobiliyati — yangi ma'lumotlarni o‘rganish va tushunish.<\/li><li value=\"2\">Mantiqiy fikrlash — voqea-hodisalar o‘rtasidagi bog‘liqlikni aniqlash va xulosa chiqarish.<\/li><li value=\"3\">Muammolarni hal qilish — qiyin vaziyatlarda to‘g‘ri yechim topish.<\/li><li value=\"4\">Xotira — olingan bilim va tajribalarni esda saqlash hamda esga tushirish.<\/li><li value=\"5\">Moslashuvchanlik — yangi sharoit va vaziyatlarga moslasha olish.<\/li><li value=\"6\">Ijodkorlik — yangi g‘oyalar va noodatiy yechimlar yaratish.<\/li><\/ol>\n<h4>2. Intellekt va tafakkur munosabati<\/h4>\n<p>Tafakkur — insonning narsa va hodisalarning mohiyati, sabab va oqibatlarini fikrlash orqali anglash jarayonidir.<\/p>\n<p>Intellekt tafakkurga nisbatan kengroq tushuncha hisoblanadi. Tafakkur intellektning muhim tarkibiy qismlaridan biridir.<\/p>\n<p>Ularning o‘zaro aloqasi quyidagilarda namoyon bo‘ladi:<\/p>\n<ul><li>Tafakkur orqali inson tahlil qiladi, taqqoslaydi va xulosa chiqaradi.<\/li><li>Intellekt ushbu fikrlash jarayonlaridan samarali foydalanish imkonini beradi.<\/li><li>Tafakkur muammolarni tushunish va hal qilishga yordam beradi.<\/li><li>Intellekt yangi vaziyatlarda bilim va tajribadan foydalanishni ta'minlaydi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Talaba matematik masalani yechayotganda tafakkur orqali masalani tahlil qiladi va yechim topadi. Uning intellekti esa bilim, mantiq va tajribasidan foydalanib, to‘g‘ri yechimga kelishiga yordam beradi.<\/p>\n<h4>3. Intellekt va bilim munosabati<\/h4>\n<p>Bilim — insonning ta'lim, tajriba, kuzatish va amaliy faoliyat orqali egallagan ma'lumotlari, tushunchalari va ko‘nikmalari majmuasidir.<\/p>\n<p>Intellekt va bilim bir-biri bilan chambarchas bog‘liq, ammo ular bir xil tushuncha emas.<\/p>\n<ul><li>Intellekt insonning bilim olish va undan foydalanish qobiliyatini bildiradi.<\/li><li>Bilim esa inson tomonidan o‘zlashtirilgan ma'lumotlar va tajribalar yig‘indisidir.<\/li><li>Intellekt yangi bilimlarni tezroq tushunish va o‘zlashtirishga yordam beradi.<\/li><li>Bilim intellektning rivojlanishi va namoyon bo‘lishi uchun asos bo‘lib xizmat qiladi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Ikki talaba bir xil bilimga ega bo‘lishi mumkin, ammo ulardan biri olgan bilimlarini yangi vaziyatda mustaqil qo‘llab, murakkab muammoni hal qila oladi. Bu yerda intellektning amaliy namoyon bo‘lishi kuzatiladi.<\/p>\n<h4>4. Intellektni rivojlantirish usullari<\/h4>\n<ul><li>Kitob va ilmiy adabiyotlarni muntazam o‘qish.<\/li><li>Mantiqiy masalalar va boshqotirmalarni yechish.<\/li><li>Yangi bilim va ko‘nikmalarni o‘rganish.<\/li><li>Mustaqil fikrlash va tahlil qilish.<\/li><li>Xotira va diqqatni rivojlantirish.<\/li><li>Turli mavzularda suhbat va munozaralarda qatnashish.<\/li><li>Olingan bilimlarni amaliyotda qo‘llash.<\/li><\/ul>\n<h4>5. Intellekt, tafakkur va bilimning farqi<\/h4>\n<div class=\"tw\"><table><thead><tr><th><strong>Tushuncha<\/strong><\/th><th><strong>Mazmuni<\/strong><\/th><\/tr><\/thead><tbody><tr><td>Intellekt<\/td><td>Bilim olish, fikrlash va muammolarni hal qilishning umumiy aqliy qobiliyati<\/td><\/tr><tr><td>Tafakkur<\/td><td>Fikrlash, tahlil qilish va xulosa chiqarish jarayoni<\/td><\/tr><tr><td>Bilim<\/td><td>Inson egallagan ma’lumotlar, tushunchalar va tajribalar majmuasi<\/td><\/tr><\/tbody><\/table><\/div>\n<p><strong>Xulosa:<\/strong> Intellekt insonning aqliy imkoniyatlarini, tafakkur uning fikrlash jarayonini, bilim esa egallagan ma'lumot va tajribalarini ifodalaydi. Tafakkur intellektning muhim tarkibiy qismi bo‘lsa, bilim intellektni rivojlantirish va undan samarali foydalanish uchun asos hisoblanadi. Ularning o‘zaro uyg‘unligi insonning aqliy rivojlanishi va hayotda muvaffaqiyatga erishishida muhim rol o‘ynaydi.<\/p>"}]</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var $ = function(id){ return document.getElementById(id); };
  var grid = $('grid'), qlist = $('qlist'), answer = $('answer'), progress = $('progress'),
      themeBtn = $('theme'), input = $('q'), sbox = $('sbox'), sinfo = $('sinfo'), resultsEl = $('results');
  var KEY = 'psixologiya-seen';
  var seen = {}, current = 0, terms = [];

  try { seen = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { seen = {}; }
  function saveSeen(){ try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {} }

  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  /* Qidiruv uchun matnni normallashtirish: kichik harf + barcha apostrof turlari bitta belgiga */
  function norm(s){ return s.toLowerCase().replace(/[\u2018\u2019\u02BB\u02BC\u0060\u00B4]/g, "'"); }

  /* ---- Qidiruv indeksi: har bir savol bloklarga bo‘linadi ---- */
  var INDEX = DATA.map(function(item){
    var tmp = document.createElement('div');
    tmp.innerHTML = item.html;
    var blocks = [], head = '';
    Array.prototype.forEach.call(tmp.children, function(el){
      var text = el.textContent.replace(/\s+/g, ' ').trim();
      if (!text) return;
      if (el.tagName === 'H4') { head = text; return; }
      blocks.push({head: head, text: text});
    });
    var all = norm(item.title + ' ' + blocks.map(function(b){ return b.head + ' ' + b.text; }).join(' '));
    return {title: item.title, blocks: blocks, all: all};
  });

  /* ---- Tugmalar va savollar ro‘yxati ---- */
  var buttons = [], rows = [];
  DATA.forEach(function(item){
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = item.n;
    b.setAttribute('aria-label', item.n + '-savol');
    b.addEventListener('click', function(){ select(item.n, true); });
    grid.appendChild(b); buttons.push(b);

    var r = document.createElement('button');
    r.type = 'button'; r.className = 'qrow';
    var n = document.createElement('span'); n.className = 'qn'; n.textContent = item.n + '.';
    var t = document.createElement('span'); t.className = 'qt'; t.textContent = item.title;
    r.appendChild(n); r.appendChild(t);
    r.addEventListener('click', function(){ select(item.n, true); });
    qlist.appendChild(r); rows.push(r);

    if (seen[item.n]) { b.classList.add('seen'); r.classList.add('seen'); }
  });

  function updateProgress(){
    progress.textContent = 'Ko‘rilgan: ' + Object.keys(seen).length + ' / ' + DATA.length;
  }

  /* ---- Moslik oralig‘lari va ajratib ko‘rsatish ---- */
  function ranges(text, ts){
    var n = norm(text), r = [];
    ts.forEach(function(t){
      var i = 0;
      while ((i = n.indexOf(t, i)) > -1) { r.push([i, i + t.length]); i += t.length; }
    });
    r.sort(function(a, b){ return a[0] - b[0]; });
    var m = [];
    r.forEach(function(x){
      if (m.length && x[0] <= m[m.length-1][1]) m[m.length-1][1] = Math.max(m[m.length-1][1], x[1]);
      else m.push([x[0], x[1]]);
    });
    return m;
  }
  function markHTML(text, rs){
    var out = '', pos = 0;
    rs.forEach(function(r){
      out += esc(text.slice(pos, r[0])) + '<mark>' + esc(text.slice(r[0], r[1])) + '</mark>';
      pos = r[1];
    });
    return out + esc(text.slice(pos));
  }
  function highlightDOM(root){
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), nodes = [], first = null, nd;
    while ((nd = walker.nextNode())) nodes.push(nd);
    nodes.forEach(function(node){
      var rs = ranges(node.nodeValue, terms);
      if (!rs.length) return;
      var frag = document.createDocumentFragment(), pos = 0, txt = node.nodeValue;
      rs.forEach(function(r){
        if (r[0] > pos) frag.appendChild(document.createTextNode(txt.slice(pos, r[0])));
        var mk = document.createElement('mark'); mk.textContent = txt.slice(r[0], r[1]);
        frag.appendChild(mk); if (!first) first = mk; pos = r[1];
      });
      if (pos < txt.length) frag.appendChild(document.createTextNode(txt.slice(pos)));
      node.parentNode.replaceChild(frag, node);
    });
    return first;
  }

  /* ---- Savolni ochish ---- */
  function select(n, scroll){
    if (n < 1 || n > DATA.length) return;
    var item = DATA[n - 1];
    current = n;
    buttons.forEach(function(b, i){
      if (i === n - 1) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
    });
    rows.forEach(function(r, i){
      if (i === n - 1) r.setAttribute('aria-current', 'true'); else r.removeAttribute('aria-current');
    });
    seen[n] = 1; buttons[n-1].classList.add('seen'); rows[n-1].classList.add('seen'); saveSeen(); updateProgress();

    answer.innerHTML =
      '<span class="q-num">' + n + '-savol</span>' +
      '<h2></h2><div class="body">' + item.html + '</div>' +
      '<div class="pager">' +
      '<button type="button" id="prev"' + (n === 1 ? ' disabled' : '') + '>← Oldingi</button>' +
      '<button type="button" id="next"' + (n === DATA.length ? ' disabled' : '') + '>Keyingi →</button>' +
      '</div>';
    var h2 = answer.querySelector('h2');
    h2.textContent = item.title;
    $('prev').addEventListener('click', function(){ select(current - 1, true); });
    $('next').addEventListener('click', function(){ select(current + 1, true); });

    var firstMark = null;
    if (terms.length) {
      var m1 = highlightDOM(h2), m2 = highlightDOM(answer.querySelector('.body'));
      firstMark = m2 || m1;
    }

    if (location.hash !== '#' + n) {
      try { history.replaceState(null, '', '#' + n); } catch (e) { location.hash = n; }
    }
    document.title = n + '-savol — Psixologiya';
    if (scroll) {
      if (firstMark) firstMark.scrollIntoView({behavior: 'smooth', block: 'center'});
      else answer.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  }

  /* ---- Qidiruv ---- */
  var timer = null;
  function snippet(text, ts){
    var rs = ranges(text, ts);
    if (!rs.length) return null;
    var s = Math.max(0, rs[0][0] - 55), e = Math.min(text.length, rs[0][1] + 110);
    if (s > 0) { var sp = text.indexOf(' ', s); if (sp > -1 && sp < rs[0][0]) s = sp + 1; }
    var piece = text.slice(s, e);
    var local = ranges(piece, ts);
    return (s > 0 ? '… ' : '') + markHTML(piece, local) + (e < text.length ? ' …' : '');
  }

  function runSearch(){
    var raw = input.value;
    sbox.classList.toggle('has', raw.length > 0);
    var ts = norm(raw).split(/\s+/).filter(function(t){ return t.length >= 2; });
    var prev = terms.join(' ');
    terms = ts;
    if (!ts.length) {
      resultsEl.hidden = true; sinfo.hidden = !raw.trim(); resultsEl.innerHTML = '';
      sinfo.textContent = raw.trim() ? 'Kamida 2 ta belgi kiriting.' : '';
      if (prev && current) select(current, false);
      return;
    }
    var out = [], totalHits = 0;
    INDEX.forEach(function(ix, i){
      var ok = ts.every(function(t){ return ix.all.indexOf(t) > -1; });
      if (!ok) return;
      var titleRs = ranges(ix.title, ts);
      var hits = titleRs.length, snips = [];
      ix.blocks.forEach(function(b){
        var rs = ranges(b.text, ts);
        if (rs.length) { hits += rs.length; snips.push(b); }
      });
      /* sarlavha bo‘limi (h4) ichida topilgan holatlar */
      var headOnly = [];
      ix.blocks.forEach(function(b){
        if (b.head && ranges(b.head, ts).length && snips.indexOf(b) === -1) headOnly.push(b);
      });
      out.push({n: i + 1, ix: ix, titleRs: titleRs, hits: hits, snips: snips, headOnly: headOnly});
      totalHits += hits;
    });
    out.sort(function(a, b){
      return (b.titleRs.length ? 1 : 0) - (a.titleRs.length ? 1 : 0) || b.hits - a.hits || a.n - b.n;
    });
    resultsEl.innerHTML = '';
    sinfo.hidden = false;
    if (!out.length) {
      sinfo.textContent = '“' + raw.trim() + '” bo‘yicha hech narsa topilmadi.';
      resultsEl.hidden = true; return;
    }
    sinfo.textContent = out.length + ' ta savolda, jami ' + totalHits + ' ta moslik topildi.';
    out.forEach(function(r){
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'res';
      var html = '<span class="rh"><span class="rn">' + r.n + '-savol</span><span>' + markHTML(r.ix.title, r.titleRs) + '</span></span>';
      var shown = 0;
      if (r.titleRs.length) { html += '<span class="sn"><span class="where">SARLAVHADA</span></span>'; }
      r.snips.slice(0, 3).forEach(function(b){
        var sn = snippet(b.text, ts);
        var where = b.head ? 'JAVOB · ' + esc(b.head) : 'JAVOB';
        html += '<span class="sn"><span class="where">' + where + '</span>' + sn + '</span>';
        shown++;
      });
      if (!r.snips.length && r.headOnly.length) {
        html += '<span class="sn"><span class="where">BO‘LIM SARLAVHASIDA</span>' + markHTML(r.headOnly[0].head, ranges(r.headOnly[0].head, ts)) + '</span>';
      }
      if (r.snips.length > shown) html += '<span class="more">+ yana ' + (r.snips.length - shown) + ' ta joyda</span>';
      btn.innerHTML = html;
      btn.addEventListener('click', function(){ select(r.n, true); });
      resultsEl.appendChild(btn);
    });
    resultsEl.hidden = false;
    resultsEl.scrollTop = 0;
    if (current) select(current, false);   /* ochiq javobda ham yangi so‘zlar ajratilsin */
  }

  input.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(runSearch, 130); });
  $('clear').addEventListener('click', function(){ input.value = ''; runSearch(); input.focus(); });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Escape') { input.value = ''; runSearch(); }
    if (e.key === 'Enter') { var f = resultsEl.querySelector('.res'); if (f) f.click(); }
  });

  function fromHash(){
    var n = parseInt((location.hash || '').replace('#', ''), 10);
    if (n >= 1 && n <= DATA.length) select(n, false);
  }
  window.addEventListener('hashchange', fromHash);
  document.addEventListener('keydown', function(e){
    if (e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' && current) select(current + 1, true);
    if (e.key === 'ArrowLeft' && current) select(current - 1, true);
    if (e.key === '/') { e.preventDefault(); input.focus(); }
  });

  /* Rejim: avto / kunduzgi / tungi */
  var root = document.documentElement;
  var modes = ['auto', 'light', 'dark'], labels = {auto: 'Rejim: avto', light: 'Rejim: kunduzgi', dark: 'Rejim: tungi'};
  var mode = 'auto';
  try { mode = localStorage.getItem('psixologiya-theme') || 'auto'; } catch (e) {}
  function applyMode(){
    if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
    themeBtn.textContent = labels[mode];
  }
  themeBtn.addEventListener('click', function(){
    mode = modes[(modes.indexOf(mode) + 1) % modes.length];
    try { localStorage.setItem('psixologiya-theme', mode); } catch (e) {}
    applyMode();
  });
  applyMode();

  updateProgress();
  fromHash();
})();
</script>
</body>
</html>
