<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psixologiya — 50 ta savol va javob</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f4ef; --surface:#ffffff; --text:#1f2430; --muted:#5d6472; --line:#e3e0d8;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e4edf6; --seen:#eef1ec; --seen-ink:#3d5a45;
  --mark:#ffe58a; --mark-ink:#1f2430;
  --shadow:0 1px 2px rgba(20,24,34,.06),0 6px 20px rgba(20,24,34,.05);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#14171d; --surface:#1c2028; --text:#e8eaef; --muted:#9aa1ae; --line:#2b303b;
    --accent:#7fb0e0; --accent-ink:#0f1722; --accent-soft:#233347; --seen:#222a26; --seen-ink:#a9cdb4;
    --mark:#6b5a12; --mark-ink:#fff6d6; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#14171d; --surface:#1c2028; --text:#e8eaef; --muted:#9aa1ae; --line:#2b303b;
  --accent:#7fb0e0; --accent-ink:#0f1722; --accent-soft:#233347; --seen:#222a26; --seen-ink:#a9cdb4;
  --mark:#6b5a12; --mark-ink:#fff6d6; --shadow:none;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 56px}
header{margin:8px 0 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
header h1{margin:0 0 4px;font-size:clamp(1.4rem,4.5vw,1.9rem);line-height:1.25;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.theme{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:.82rem;cursor:pointer}
.theme:hover{color:var(--text)}

/* Qidiruv */
.search{padding:12px 14px;margin-bottom:14px}
.sbox{position:relative}
.sbox input{width:100%;min-height:48px;padding:10px 44px 10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit;font-size:1rem}
.sbox input::placeholder{color:var(--muted)}
.sbox input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.sbox .clear{position:absolute;right:6px;top:6px;width:36px;height:36px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);font-size:1.3rem;line-height:1;cursor:pointer;display:none}
.sbox .clear:hover{background:var(--accent-soft);color:var(--text)}
.sbox.has .clear{display:block}
.sinfo{margin:10px 2px 0;color:var(--muted);font-size:.88rem}
.results{margin-top:8px;max-height:min(60vh,520px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:12px;padding:10px 12px;cursor:pointer;font-size:.95rem;line-height:1.5}
.res:hover{border-color:var(--accent);background:var(--accent-soft)}
.res .rh{display:flex;gap:8px;align-items:baseline;font-weight:650}
.res .rn{flex:none;font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 9px}
.res:hover .rn{background:var(--surface)}
.res .sn{display:block;margin-top:6px;color:var(--muted);font-size:.9rem}
.res .where{display:inline-block;margin-right:6px;font-size:.72rem;font-weight:700;letter-spacing:.03em;color:var(--accent)}
.res .more{display:block;margin-top:4px;font-size:.8rem;color:var(--muted)}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}

/* Savollar */
.nav-card{padding:14px;margin-bottom:16px}
.nav-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.grid button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-weight:600;font-size:1rem;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
.grid button:hover,.qrow:hover{border-color:var(--accent);background:var(--accent-soft)}
.grid button:active{transform:scale(.96)}
.grid button.seen,.qrow.seen{background:var(--seen)}
.grid button.seen{color:var(--seen-ink)}
.grid button[aria-current="true"],.qrow[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qlist-title{margin:16px 2px 8px;font-size:.85rem;color:var(--muted)}
.qlist{display:flex;flex-direction:column;gap:6px;max-height:min(52vh,460px);overflow-y:auto;padding-right:2px}
.qrow{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);
  color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.95rem;line-height:1.45}
.qrow .qn{flex:none;min-width:1.7em;font-weight:700;color:var(--accent)}
.qrow[aria-current="true"] .qn{color:var(--accent-ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Javob */
.answer{padding:22px 20px 20px}
.empty{color:var(--muted);text-align:center;padding:28px 8px}
.empty b{display:block;font-size:1.05rem;color:var(--text);margin-bottom:4px}
.q-num{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px;margin-bottom:10px}
.answer h2{margin:0 0 14px;font-size:clamp(1.15rem,3.8vw,1.45rem);line-height:1.35}
.body p{margin:0 0 .9em}
.body h4{margin:1.5em 0 .5em;font-size:1.05rem;line-height:1.4;color:var(--accent)}
.body ul,.body ol{margin:0 0 1em;padding-left:1.35em}
.body li{margin:.3em 0;padding-left:.15em}
.body li::marker{color:var(--accent)}
.body strong{font-weight:650}
.tw{overflow-x:auto;margin:.4em 0 1.2em;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:420px;font-size:.95rem;line-height:1.5}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--accent-soft);font-weight:650}
tr:last-child td{border-bottom:0}
td+td,th+th{border-left:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.pager button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font-weight:600;font-size:.95rem;line-height:1.2;cursor:pointer}
.pager button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.pager button:disabled{opacity:.4;cursor:default}
@media (max-width:420px){.answer{padding:18px 15px 16px}.grid{gap:6px;grid-template-columns:repeat(auto-fill,minmax(44px,1fr))}}
@media print{.search,.nav-card,.pager,.theme{display:none}.answer{box-shadow:none;border:0;padding:0}}

<script type="application/json" id="data">[{"n": 1, "title": "Psixologiya fanining predmeti va asosiy vazifalari", "html": "<p>Psixologiya — inson va hayvonlar psixikasining rivojlanishi, namoyon bo‘lishi va faoliyat ko‘rsatish qonuniyatlarini, shuningdek, insonning xulq-atvori va ruhiy jarayonlarini o‘rganuvchi fan. “Psixologiya” atamasi yunoncha “psyche” — ruh va “logos” — ta’limot, fan so‘zlaridan kelib chiqqan.<\/p>\n<h4>1. Psixologiya fanining predmeti<\/h4>\n<p>Psixologiya fanining predmeti — psixika, ruhiy jarayonlar, ruhiy holatlar, shaxsning individualpsixologik xususiyatlari hamda inson xulq-atvori va faoliyatining psixologik qonuniyatlaridir.<\/p>\n<p>Psixologiya quyidagi asosiy yo‘nalishlarni o‘rganadi:<\/p>\n<ol><li value=\"1\">Psixik jarayonlar — insonning borliqni anglashi va idrok etishi bilan bog‘liq jarayonlar. Ularga sezgi, idrok, diqqat, xotira, tafakkur, xayol va nutq kiradi.<\/li><li value=\"2\">Psixik holatlar — insonning muayyan vaqtdagi ruhiy kechinmalari. Masalan, xursandchilik, qo‘rquv, xavotir, tushkunlik, ruhiy zo‘riqish va ishonch.<\/li><li value=\"3\">Psixik xususiyatlar — insonning nisbatan barqaror individual xususiyatlari. Bularga temperament, xarakter, qobiliyat, qiziqish va ehtiyojlar kiradi.<\/li><li value=\"4\">Shaxs va uning faoliyati — insonning maqsadlari, motivlari, qarorlari, xatti-harakatlari va jamiyat bilan munosabatlari.<\/li><li value=\"5\">Muloqot va ijtimoiy munosabatlar — insonlarning bir-biri bilan aloqa o‘rnatishi, fikr almashishi va guruhdagi xulq-atvori.<\/li><\/ol>\n<p>Demak, psixologiya insonning qanday fikrlashi, his qilishi, qaror qabul qilishi va harakat qilishini ilmiy jihatdan o‘rganadi.<\/p>\n<h4>2. Psixologiya fanining asosiy vazifalari<\/h4>\n<p>Psixologiya fanining asosiy vazifalari quyidagilardan iborat:<\/p>\n<ol><li value=\"1\">Psixik hodisalarni o‘rganish — inson ruhiyatida sodir bo‘ladigan jarayonlar, holatlar va xususiyatlarning mohiyatini aniqlash.<\/li><li value=\"2\">Psixik jarayonlarning qonuniyatlarini aniqlash — xotira, diqqat, tafakkur, sezgi va idrokning qanday shakllanishi hamda rivojlanishini o‘rganish.<\/li><li value=\"3\">Inson xulq-atvorini tushuntirish — odamlarning nima sababdan muayyan harakatlarni amalga oshirishi va qanday omillar ta’sirida qaror qabul qilishini aniqlash.<\/li><li value=\"4\">Inson xatti-harakatlarini oldindan bashorat qilish — mavjud psixologik bilimlar asosida insonning ehtimoliy xulq-atvori va reaksiyalarini taxmin qilish.<\/li><li value=\"5\">Shaxsning individual xususiyatlarini o‘rganish — temperament, xarakter, qobiliyat, ehtiyoj va qiziqishlarni aniqlash.<\/li><li value=\"6\">Psixik rivojlanishni tadqiq etish — inson ruhiyatining bolalikdan keksalikkacha bo‘lgan davrda o‘zgarishi va rivojlanishini o‘rganish.<\/li><li value=\"7\">Ta’lim va tarbiya jarayonini takomillashtirish — o‘quvchilarning yosh va individual xususiyatlarini hisobga olgan holda samarali ta’lim usullarini ishlab chiqish.<\/li><li value=\"8\">Muloqot va munosabatlarni yaxshilash — insonlar o‘rtasidagi o‘zaro tushunish, hamkorlik va sog‘lom munosabatlarni rivojlantirish.<\/li><li value=\"9\">Psixologik muammolarni aniqlash va yordam ko‘rsatish — stress, xavotir, nizolar va boshqa ruhiy qiyinchiliklarni o‘rganish hamda ularni yengishda ko‘maklashish.<\/li><li value=\"10\">Psixologik bilimlarni amaliyotga tatbiq etish — ta’lim, tibbiyot, ishlab chiqarish, sport, boshqaruv va boshqa sohalarda psixologik bilimlardan foydalanish.<\/li><\/ol>\n<h4>3. Psixologiya fanining asosiy maqsadlari<\/h4>\n<p>Psixologiya fanining asosiy maqsadlari to‘rtta yo‘nalishda ifodalanadi:<\/p>\n<ul><li>Tavsiflash — psixik hodisalar va xulq-atvorni kuzatish hamda qayd etish.<\/li><li>Tushuntirish — psixik hodisalarning sabablari va yuzaga kelish mexanizmlarini aniqlash.<\/li><li>Bashorat qilish — mavjud bilimlar asosida insonning kelajakdagi xatti-harakatlarini taxmin qilish.<\/li><li>O‘zgartirish va rivojlantirish — inson faoliyati va ruhiy holatini yaxshilashga yordam berish.<\/li><\/ul>\n<h4>4. Psixologiya fanining amaliy ahamiyati<\/h4>\n<p>Psixologiya inson hayotining deyarli barcha sohalarida muhim ahamiyatga ega. Ta’limda o‘quvchilarning bilim olish xususiyatlarini aniqlashda, oilada sog‘lom munosabatlarni shakllantirishda, ish joyida mehnat samaradorligini oshirishda, tibbiyotda esa bemorlarning ruhiy holatini tushunishda qo‘llaniladi.<\/p>\n<p>Shuningdek, psixologik bilimlar insonning o‘zini anglashiga, his-tuyg‘ularini boshqarishiga, muammolarni hal qilishiga va boshqa insonlar bilan samarali muloqot qilishiga yordam beradi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Psixologiya fanining predmeti inson va hayvonlar psixikasi, ruhiy jarayonlari, holatlari, individual xususiyatlari hamda xulq-atvoridir. Uning asosiy vazifasi psixik hodisalarning qonuniyatlarini ilmiy jihatdan o‘rganish, inson xatti-harakatlarini tushuntirish va bashorat qilish, shuningdek, olingan bilimlarni hayotning turli sohalarida qo‘llashdan iborat. Psixologiya insonni chuqurroq anglash va uning shaxs sifatida rivojlanishiga xizmat qiladigan muhim fan hisoblanadi.<\/p>"}, {"n": 2, "title": "Psixik jarayonlar, psixik holatlar va shaxs xususiyatlarining farqlari", "html": "<p>Inson psixikasi psixik jarayonlar, psixik holatlar va shaxsning psixologik xususiyatlaridan tashkil topadi. Ular bir-biri bilan chambarchas bog‘liq bo‘lsa-da, mazmuni, davomiyligi va namoyon bo‘lishiga ko‘ra farqlanadi.<\/p>\n<ol><li value=\"1\">Psixik jarayonlar<\/li><\/ol>\n<p>Psixik jarayonlar — insonning tashqi olamni va o‘zini anglashini, axborotni qabul qilishini hamda qayta ishlashini ta’minlaydigan ruhiy faoliyat shakllaridir.<\/p>\n<p>Psixik jarayonlarning asosiy turlari:<\/p>\n<ul><li>Sezgi — narsa va hodisalarning ayrim belgilarini sezgi organlari orqali aks ettirish.<\/li><li>Idrok — narsa va hodisalarni yaxlit holda anglash.<\/li><li>Diqqat — ongning muayyan obyekt yoki faoliyatga yo‘naltirilishi.<\/li><li>Xotira — ma’lumotlarni eslab qolish, saqlash va qayta esga tushirish.<\/li><li>Tafakkur — voqelikni umumlashtirib, tahlil qilish va xulosa chiqarish.<\/li><li>Xayol — yangi obraz va tasavvurlarni yaratish.<\/li><li>Nutq — fikrlarni til vositasida ifodalash va muloqot qilish.<\/li><\/ul>\n<p>Masalan, talabaning darsni tinglashi, ma’lumotni eslab qolishi va savolga javob berishi psixik jarayonlarga kiradi.<\/p>\n<ol><li value=\"2\">Psixik holatlar<\/li><\/ol>\n<p>Psixik holatlar — insonning muayyan vaqt davomida kechiradigan ruhiy holati bo‘lib, uning faoliyati, xulq-atvori va atrofdagilar bilan munosabatiga ta’sir qiladi.<\/p>\n<p>Psixik holatlarning asosiy turlari:<\/p>\n<ul><li>Hissiy holatlar — quvonch, qayg‘u, qo‘rquv, g‘azab va hayajon.<\/li><li>Ruhiy zo‘riqish — stress, xavotir va asabiylik.<\/li><li>Faollik holatlari — tetiklik, charchoq, loqaydlik va ruhiy ko‘tarinkilik.<\/li><li>Motivatsion holatlar — qiziqish, ishtiyoq, ishonch va ikkilanish.<\/li><\/ul>\n<p>Masalan, imtihon oldidan talabaning hayajonlanishi yoki muvaffaqiyatga erishganda quvonishi psixik holat hisoblanadi.<\/p>\n<h4>3. Shaxsning psixologik xususiyatlari<\/h4>\n<p>Shaxs xususiyatlari — insonning individual va nisbatan barqaror ruhiy sifatlari bo‘lib, uning xulqatvori, faoliyati va boshqa insonlar bilan munosabatlarida namoyon bo‘ladi.<\/p>\n<p>Shaxsning asosiy psixologik xususiyatlari:<\/p>\n<ul><li>Temperament — insonning ruhiy faoliyati va hissiy reaksiyalarining tabiiy xususiyatlari.<\/li><li>Xarakter — insonning atrofdagilarga, mehnatga va o‘ziga bo‘lgan munosabatida namoyon bo‘ladigan barqaror sifatlari.<\/li><li>Qobiliyat — muayyan faoliyatni muvaffaqiyatli bajarishga yordam beradigan individual xususiyatlar.<\/li><li>Qiziqish — insonning muayyan faoliyat yoki bilim sohasiga bo‘lgan moyilligi.<\/li><li>Ehtiyoj — inson hayoti va faoliyati uchun zarur bo‘lgan narsalarga bo‘lgan talab.<\/li><\/ul>\n<p>Masalan, insonning sabrli, mas’uliyatli, tirishqoq yoki kirishimli bo‘lishi shaxs xususiyatlariga kiradi.<\/p>\n<h4>4. Ularning asosiy farqlari<\/h4>\n<p>Psixik jarayonlar, psixik holatlar va shaxs xususiyatlari quyidagi jihatlari bilan farqlanadi:<\/p>\n<ol><li value=\"1\">Davomiyligi: psixik jarayonlar muayyan vaqt davomida kechadi; psixik holatlar ma’lum muddat saqlanadi; shaxs xususiyatlari esa nisbatan uzoq vaqt davomida barqaror namoyon bo‘ladi.<\/li><li value=\"2\">Vazifasi: psixik jarayonlar axborotni qabul qilish va qayta ishlashni ta’minlaydi; psixik holatlar insonning ayni paytdagi ruhiy kechinmalarini ifodalaydi; shaxs xususiyatlari esa insonning individual jihatlarini belgilaydi.<\/li><li value=\"3\">Namoyon bo‘lishi: psixik jarayonlar bilish va anglash faoliyatida; psixik holatlar hissiyot va kayfiyatda; shaxs xususiyatlari esa odat, xarakter va xulq-atvorda ko‘rinadi.<\/li><\/ol>\n<p>Masalan, talabaning imtihon savolini o‘qishi — idrok jarayoni, imtihon paytidagi hayajoni — psixik holat, uning mas’uliyatli va tirishqoq bo‘lishi esa shaxs xususiyatidir.<\/p>\n<h4>Xulosa<\/h4>\n<p>Psixik jarayonlar, psixik holatlar va shaxs xususiyatlari inson psixikasining o‘zaro bog‘liq uchta muhim tarkibiy qismidir. Psixik jarayonlar insonning bilish faoliyatini ta’minlaydi, psixik holatlar uning muayyan vaqtdagi ruhiy kechinmalarini ifodalaydi, shaxs xususiyatlari esa individual va nisbatan barqaror sifatlarini belgilaydi. Ularning barchasi birgalikda insonning ruhiy hayoti va xulq-atvorini shakllantiradi.<\/p>"}, {"n": 3, "title": "Psixologiya fanining rivojlanish tarixidagi asosiy bosqichlar", "html": "<p>Psixologiya insoniyat tarixida uzoq rivojlanish yo‘lini bosib o‘tgan fanlardan biridir. Dastlab psixologik bilimlar falsafa va din tarkibida shakllangan, keyinchalik mustaqil ilmiy yo‘nalishga aylangan. Psixologiya fanining rivojlanish tarixini quyidagi asosiy bosqichlarga ajratish mumkin.<\/p>\n<h4>1. Psixologiyaning ruh haqidagi ta’limot sifatida shakllanishi<\/h4>\n<p>Bu bosqich qadimgi davrlardan XVII asrgacha bo‘lgan davrni qamrab oladi. Dastlab insonning ruhiy hayoti, fikrlashi, his-tuyg‘ulari va xulq-atvori ruh tushunchasi orqali izohlangan.<\/p>\n<p>Qadimgi yunon faylasuflari psixologik qarashlarning shakllanishiga katta hissa qo‘shgan.<\/p>\n<ul><li>Demokrit ruhni moddiy zarrachalardan tashkil topgan deb hisoblagan.<\/li><li>Platon ruhni tanadan mustaqil va abadiy deb tushuntirgan.<\/li><li>Aristotel “Jon haqida” asarida ruh, sezgi, xotira va tafakkur masalalarini o‘rgangan.<\/li><\/ul>\n<p>Bu davrda psixologiya mustaqil fan bo‘lmagan, balki falsafaning bir qismi sifatida rivojlangan.<\/p>\n<h4>2. Psixologiyaning ong haqidagi fan sifatida rivojlanishi<\/h4>\n<p>XVII–XIX asrlarda psixologik qarashlarning markaziga ong masalasi chiqdi. Olimlar insonning fikrlashi, sezgilari, xotirasi va ongli faoliyatini o‘rganishga e’tibor qaratdilar.<\/p>\n<p>Bu davrning muhim vakillari:<\/p>\n<ul><li>Rene Dekart — ong va tana munosabatlari, refleks tushunchasi haqida fikr bildirgan.<\/li><li>Jon Lokk — inson bilimlari tajriba asosida shakllanishini ta’kidlagan.<\/li><li>Vilgelm Leybnits — ong va ongsiz ruhiy jarayonlar haqida qarashlarni rivojlantirgan.<\/li><\/ul>\n<p>Ushbu bosqichda psixologiya falsafiy fan sifatida rivojlanishda davom etdi.<\/p>\n<h4>3. Psixologiyaning mustaqil eksperimental fan sifatida shakllanishi<\/h4>\n<p>XIX asrning ikkinchi yarmi psixologiya tarixida muhim burilish davri hisoblanadi. 1879-yilda nemis olimi Vilgelm Vundt Germaniyaning Leypsig universitetida birinchi eksperimental psixologiya laboratoriyasini tashkil etdi.<\/p>\n<p>Shu sababli 1879-yil psixologiyaning mustaqil eksperimental fan sifatida shakllangan yili hisoblanadi.<\/p>\n<p>Bu davrda psixik hodisalarni tajriba, kuzatish va o‘lchash orqali o‘rganish boshlandi. Vilgelm Vundt psixologiyaning ilmiy rivojlanishiga katta hissa qo‘shdi.<\/p>\n<h4>4. Psixologiyada asosiy ilmiy maktablarning shakllanishi<\/h4>\n<p>XX asr boshlarida psixologiyada bir nechta yirik ilmiy yo‘nalishlar shakllandi.<\/p>\n<ul><li>Bixeviorizm — inson va hayvonlarning kuzatish mumkin bo‘lgan xulq-atvorini o‘rgandi. Uning asoschilaridan biri Jon Uotson hisoblanadi.<\/li><li>Psixoanaliz — insonning ongsiz ruhiy jarayonlari, ichki ziddiyatlari va bolalik tajribasining ta’sirini o‘rgandi. Ushbu yo‘nalish asoschisi Zigmund Freyddir.<\/li><li>Geshtalt psixologiyasi — psixik hodisalarni yaxlit tuzilma sifatida o‘rganishga e’tibor qaratdi. Uning vakillari Maks Vertgeymer, Volfgang Keler va Kurt Koffka hisoblanadi.<\/li><li>Gumanistik psixologiya — insonning erkinligi, shaxsiy rivojlanishi va o‘z imkoniyatlarini ro‘yobga chiqarishini o‘rgandi. Uning yirik vakillari Abraham Maslou va Karl Rojersdir.<\/li><li>Kognitiv psixologiya — insonning axborotni qabul qilishi, xotirasi, tafakkuri, diqqati va qaror qabul qilish jarayonlarini o‘rgandi.<\/li><\/ul>\n<h4>5. Zamonaviy psixologiyaning rivojlanishi<\/h4>\n<p>XX asrning ikkinchi yarmidan hozirgi kungacha psixologiya yanada keng rivojlandi. Boshqa fanlar bilan hamkorlik kuchaydi va yangi tadqiqot usullari paydo bo‘ldi.<\/p>\n<p>Zamonaviy psixologiyaning asosiy yo‘nalishlari:<\/p>\n<ul><li>Kognitiv psixologiya — bilish jarayonlarini o‘rganadi.<\/li><li>Ijtimoiy psixologiya — insonning jamiyat va guruhlardagi xulq-atvorini o‘rganadi.<\/li><li>Pedagogik psixologiya — ta’lim va tarbiya jarayonlarining psixologik asoslarini o‘rganadi.<\/li><li>Klinik psixologiya — ruhiy va xulq-atvor bilan bog‘liq muammolarni baholash hamda yordam ko‘rsatish bilan shug‘ullanadi.<\/li><li>Rivojlanish psixologiyasi — inson psixikasining yosh davrlariga qarab o‘zgarishini o‘rganadi.<\/li><li>Neyropsixologiya — miya faoliyati bilan psixik jarayonlar o‘rtasidagi bog‘liqlikni o‘rganadi.<\/li><\/ul>\n<p>Hozirgi kunda psixologiyada kompyuter texnologiyalari, miya faoliyatini tasvirlash usullari, statistik tahlil va zamonaviy eksperimentlardan keng foydalaniladi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Psixologiya fanining rivojlanish tarixi ruh haqidagi ta’limotdan boshlangan, keyinchalik ong haqidagi fan sifatida shakllangan va 1879-yilda Vilgelm Vundt tomonidan birinchi eksperimental laboratoriya tashkil etilishi bilan mustaqil ilmiy fan sifatida rivojlangan. XX asrda bixeviorizm, psixoanaliz, geshtalt va gumanistik psixologiya kabi ilmiy yo‘nalishlar vujudga kelgan. Bugungi kunda psixologiya insonning ruhiy hayoti, xulq-atvori va rivojlanishini turli ilmiy metodlar yordamida o‘rganuvchi keng qamrovli fan hisoblanadi.<\/p>"}, {"n": 4, "title": "Psixologiyaning mustaqil eksperimental fan sifatida shakllanishi", "html": "<p>Psixologiya dastlab falsafaning bir qismi sifatida rivojlangan. Qadimgi davrlardan boshlab olimlar inson ruhi, ongi, tafakkuri, xotirasi va hissiyotlarini o‘rganishga harakat qilganlar. Biroq uzoq vaqt davomida psixik hodisalar asosan falsafiy fikrlar va kuzatishlar orqali tushuntirilgan. XIX asrga kelib, psixologiyani mustaqil ilmiy fan sifatida shakllantirish uchun zarur sharoitlar yuzaga keldi.<\/p>\n<h4>1. Psixologiyaning mustaqil fan sifatida shakllanishiga asos bo‘lgan omillar<\/h4>\n<p>XIX asrda fiziologiya, biologiya va fizika fanlarining rivojlanishi psixologiyaning ilmiy asoslarini mustahkamladi. Olimlar sezgi, idrok, asab tizimi va miya faoliyatini tajribalar orqali o‘rgana boshladilar.<\/p>\n<p>Bu jarayonda quyidagi olimlarning ishlari muhim ahamiyat kasb etdi:<\/p>\n<ul><li>Hermann fon Gelmgols — nerv impulslari va sezgi jarayonlarini o‘rgandi.<\/li><li>Ernst Veber — sezgi chegaralari va farqlash qobiliyatini tadqiq etdi.<\/li><li>Gustav Fexner — psixofizika fanining rivojlanishiga hissa qo‘shib, jismoniy ta’sirlar bilan sezgilar o‘rtasidagi bog‘liqlikni o‘rgandi.<\/li><li>Fransisk Donders — insonning aqliy jarayonlarini reaksiya vaqti orqali tadqiq qildi.<\/li><\/ul>\n<p>Ularning tadqiqotlari psixik hodisalarni aniq o‘lchash va tajriba asosida o‘rganish mumkinligini ko‘rsatdi.<\/p>\n<h4>2. Vilgelm Vundt va birinchi eksperimental laboratoriya<\/h4>\n<p>Psixologiyaning mustaqil eksperimental fan sifatida shakllanishida nemis olimi Vilgelm Vundt alohida o‘rin tutadi.<\/p>\n<p>1879-yilda Vilgelm Vundt Germaniyaning Leypsig universitetida birinchi eksperimental psixologiya laboratoriyasini tashkil etdi. Bu voqea psixologiya tarixida muhim sana hisoblanadi va 1879-yil psixologiyaning mustaqil eksperimental fan sifatida shakllangan yili deb e’tirof etiladi.<\/p>\n<p>Vundt laboratoriyasida quyidagi jarayonlar o‘rganilgan:<\/p>\n<ul><li>Sezgi va idrok jarayonlari.<\/li><li>Diqqatning xususiyatlari.<\/li><li>Reaksiya tezligi.<\/li><li>Oddiy hissiy kechinmalar.<\/li><li>Psixik jarayonlarning kechish vaqti.<\/li><\/ul>\n<p>Tadqiqotlarda nazorat qilinadigan tajribalar, kuzatish va o‘lchash usullaridan foydalanilgan.<\/p>\n<h4>3. Eksperimental psixologiyaning rivojlanishi<\/h4>\n<p>Vundt faoliyatidan keyin eksperimental psixologiya boshqa mamlakatlarda ham rivojlana boshladi. Psixologik laboratoriyalar tashkil etildi, yangi tadqiqot metodlari ishlab chiqildi.<\/p>\n<p>Uilyam Jeyms AQSHda psixologiyaning rivojlanishiga katta hissa qo‘shdi. Hermann Ebbinghaus xotira va unutish jarayonlarini tajribalar yordamida o‘rgandi. Ivan Pavlov esa shartli reflekslar haqidagi ta’limotni ishlab chiqdi.<\/p>\n<p>Natijada psixologiyada inson ruhiyatini faqat nazariy jihatdan emas, balki ilmiy tajribalar, kuzatishlar va o‘lchovlar asosida o‘rganish imkoniyati kengaydi.<\/p>\n<h4>4. Eksperimental psixologiyaning asosiy metodlari<\/h4>\n<p>Mustaqil fan sifatida shakllangan psixologiyada bir qancha ilmiy tadqiqot metodlari qo‘llanila boshlandi:<\/p>\n<ul><li>Eksperiment — maxsus tashkil etilgan sharoitda psixik hodisalarni o‘rganish.<\/li><li>Kuzatish — insonning xulq-atvori va faoliyatini tabiiy sharoitda o‘rganish.<\/li><li>Test — insonning qobiliyati, bilimi va individual xususiyatlarini maxsus topshiriqlar orqali aniqlash.<\/li><li>Suhbat — savol-javob orqali insonning fikrlari va kechinmalari haqida ma’lumot olish.<\/li><li>O‘lchash — reaksiya vaqti, sezgi chegaralari va boshqa psixologik ko‘rsatkichlarni aniqlash.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Psixologiyaning mustaqil eksperimental fan sifatida shakllanishi XIX asrda fiziologiya va boshqa tabiiy fanlarning rivojlanishi bilan bog‘liq. 1879-yilda Vilgelm Vundt tomonidan Leypsig universitetida birinchi eksperimental psixologiya laboratoriyasining tashkil etilishi ushbu jarayonning muhim bosqichi bo‘ldi. Shundan so‘ng psixologiya tajriba, kuzatish va ilmiy o‘lchash usullariga asoslangan mustaqil fan sifatida rivojlandi.<\/p>"}, {"n": 5, "title": "Psixologiyaning boshqa fanlar bilan aloqasi", "html": "<p>Psixologiya insonning ruhiy faoliyati, xulq-atvori, fikrlashi va hissiyotlarini o‘rganuvchi fan bo‘lib, boshqa fanlar bilan chambarchas bog‘liq. Chunki inson faoliyatini to‘liq tushunish uchun uning biologik, ijtimoiy, fiziologik va ma’naviy xususiyatlarini ham o‘rganish zarur. Psixologiya boshqa fanlarning ilmiy yutuqlaridan foydalanadi va o‘z navbatida ularning rivojlanishiga ham hissa qo‘shadi.<\/p>\n<h4>1. Psixologiyaning biologiya bilan aloqasi<\/h4>\n<p>Biologiya inson organizmining tuzilishi, rivojlanishi va hayotiy faoliyatini o‘rganadi. Psixologiya esa psixik jarayonlarning biologik asoslarini tadqiq etadi. Insonning irsiy xususiyatlari, nerv tizimi va miya faoliyati uning xulq-atvori hamda ruhiy rivojlanishiga ta’sir qiladi.<\/p>\n<h4>2. Psixologiyaning fiziologiya bilan aloqasi<\/h4>\n<p>Fiziologiya organizm, ayniqsa, nerv tizimi va miya faoliyatini o‘rganadi. Psixologiya insonning sezgi, idrok, xotira va tafakkur kabi jarayonlarining fiziologik mexanizmlarini tushunishda fiziologiya ma’lumotlaridan foydalanadi. Masalan, bosh miya faoliyati insonning fikrlashi va xotirasi bilan bevosita bog‘liq.<\/p>\n<h4>3. Psixologiyaning pedagogika bilan aloqasi<\/h4>\n<p>Pedagogika ta’lim va tarbiya qonuniyatlarini o‘rgansa, psixologiya insonning bilim olish, eslab qolish va rivojlanish xususiyatlarini o‘rganadi. Bu ikki fan hamkorligida pedagogik psixologiya shakllangan. U o‘quvchilarning yosh xususiyatlari, qobiliyatlari, qiziqishlari va ta’lim jarayonidagi psixologik holatlarini tadqiq etadi.<\/p>\n<h4>4. Psixologiyaning sotsiologiya bilan aloqasi<\/h4>\n<p>Sotsiologiya jamiyat, ijtimoiy guruhlar va insonlar o‘rtasidagi munosabatlarni o‘rganadi. Psixologiya esa shaxsning jamiyatdagi xulq-atvori, guruh ta’siri, muloqoti va ijtimoiy munosabatlarini tadqiq etadi. Ushbu fanlar kesishmasida ijtimoiy psixologiya rivojlangan.<\/p>\n<h4>5. Psixologiyaning falsafa bilan aloqasi<\/h4>\n<p>Falsafa inson, ong, tafakkur, borliq va bilish masalalarini o‘rganadi. Psixologiya esa ong va ruhiy faoliyatning aniq qonuniyatlarini ilmiy usullar orqali tadqiq etadi. Falsafa psixologiyaning nazariy va metodologik asoslarini shakllantirishga yordam beradi.<\/p>\n<h4>6. Psixologiyaning tibbiyot bilan aloqasi<\/h4>\n<p>Tibbiyot inson salomatligi, kasalliklar va ularni davolash usullarini o‘rganadi. Psixologiya insonning ruhiy holati, stress, xavotir va hissiy kechinmalarini tadqiq etadi. Bu fanlarning hamkorligi natijasida tibbiy psixologiya va klinik psixologiya yo‘nalishlari rivojlangan.<\/p>\n<h4>7. Psixologiyaning tilshunoslik bilan aloqasi<\/h4>\n<p>Tilshunoslik tilning tuzilishi va rivojlanishini o‘rganadi. Psixologiya esa nutqning shakllanishi, tilni o‘zlashtirish, fikrni ifodalash va muloqot jarayonlarini tadqiq etadi. Ushbu fanlar bilan bog‘liq psixolingvistika insonning til va nutq faoliyatini o‘rganadi.<\/p>\n<h4>8. Psixologiyaning matematika va statistika bilan aloqasi<\/h4>\n<p>Matematika va statistika psixologik tadqiqotlarda olingan ma’lumotlarni hisoblash, tahlil qilish va natijalarni baholash uchun qo‘llaniladi. Masalan, psixologik testlar natijalarini qayta ishlash, tajribalar orasidagi farqlarni aniqlash va ilmiy xulosalar chiqarishda statistik usullardan foydalaniladi.<\/p>\n<h4>9. Psixologiyaning informatika bilan aloqasi<\/h4>\n<p>Informatika va axborot texnologiyalari psixologik tadqiqotlarni amalga oshirishda muhim vosita hisoblanadi. Kompyuter dasturlari yordamida testlar o‘tkaziladi, ma’lumotlar tahlil qilinadi va insonning axborotni qabul qilish hamda qayta ishlash jarayonlari o‘rganiladi.<\/p>\n<h4>10. Psixologiyaning iqtisodiyot bilan aloqasi<\/h4>\n<p>Iqtisodiyot ishlab chiqarish, iste’mol va iqtisodiy munosabatlarni o‘rganadi. Psixologiya esa insonlarning iqtisodiy qarorlari, ehtiyojlari, motivlari va xarid qilish xulq-atvorini tadqiq etadi. Bu aloqalar natijasida iqtisodiy psixologiya rivojlangan.<\/p>\n<h4>Xulosa<\/h4>\n<p>Psixologiya biologiya, fiziologiya, pedagogika, sotsiologiya, falsafa, tibbiyot, tilshunoslik, matematika, informatika va iqtisodiyot kabi ko‘plab fanlar bilan uzviy bog‘liq. Ushbu fanlar bilan hamkorlik psixologiyaning ilmiy asoslarini kengaytiradi, insonning ruhiy hayoti va xulq-atvorini har tomonlama o‘rganish imkonini beradi. Shu sababli psixologiya fanlararo xususiyatga ega bo‘lgan muhim ilmiy soha hisoblanadi.<\/p>"}, {"n": 6, "title": "Kuzatish metodi nima va u qanday amalga oshiriladi?", "html": "<p>Kuzatish metodi — psixologiyada insonning xulq-atvori, faoliyati, ruhiy holati va psixik jarayonlarini tabiiy sharoitda maqsadli, tizimli ravishda o‘rganish usulidir. Bu metod orqali insonning kundalik hayotdagi xatti-harakatlari, muloqoti, hissiyotlari va atrof-muhitga munosabati o‘rganiladi.<\/p>\n<p>Kuzatish metodi psixologik tadqiqotlarning eng qadimiy va keng qo‘llaniladigan usullaridan biri hisoblanadi.<\/p>\n<h4>1. Kuzatish metodining asosiy maqsadi<\/h4>\n<p>Kuzatish metodining asosiy maqsadi insonning ruhiy xususiyatlari va xulq-atvorini bevosita kuzatish orqali ma’lumot to‘plash, ularni tahlil qilish hamda muayyan psixologik xulosalar chiqarishdan iborat.<\/p>\n<p>U quyidagi holatlarni o‘rganishda qo‘llaniladi:<\/p>\n<ul><li>Insonning xulq-atvori va kundalik faoliyati.<\/li><li>Hissiy holatlari va kayfiyati.<\/li><li>Boshqa insonlar bilan muloqoti.<\/li><li>Diqqat va xotiraning namoyon bo‘lishi.<\/li><li>Guruhdagi munosabatlar va o‘zaro hamkorlik.<\/li><li>Turli vaziyatlarda insonning xatti-harakatlari.<\/li><\/ul>\n<h4>2. Kuzatish metodining turlari<\/h4>\n<p>Psixologiyada kuzatish metodi bir necha turga bo‘linadi:<\/p>\n<ol><li value=\"1\">Bevosita kuzatish — tadqiqotchi insonning xatti-harakatlarini o‘z ko‘zi bilan kuzatadi va qayd etadi.<\/li><li value=\"2\">Bilvosita kuzatish — inson faoliyati va xulq-atvori haqida boshqa shaxslarning ma’lumotlari yoki mavjud yozuvlar orqali xulosa chiqariladi.<\/li><li value=\"3\">Ochiq kuzatish — kuzatilayotgan shaxs tadqiqotchi tomonidan kuzatilayotganini biladi.<\/li><li value=\"4\">Yashirin kuzatish — kuzatilayotgan shaxs tadqiqot jarayonidan xabardor bo‘lmaydi. Bunday kuzatishda axloqiy va huquqiy talablar hisobga olinishi kerak.<\/li><li value=\"5\">Tabiiy kuzatish — insonning xulq-atvori odatiy hayotiy sharoitda, masalan, maktabda, oilada yoki ish joyida o‘rganiladi.<\/li><li value=\"6\">Laboratoriya kuzatuvi — maxsus tashkil etilgan sharoitda insonning xatti-harakatlari kuzatiladi.<\/li><li value=\"7\">Tizimli kuzatish — oldindan belgilangan reja va mezonlar asosida muntazam olib boriladi.<\/li><\/ol>\n<h4>8. Kuzatish metodi qanday amalga oshiriladi?<\/h4>\n<p>Kuzatish metodi bir necha ketma-ket bosqichda amalga oshiriladi:<\/p>\n<ol><li value=\"1\">Maqsadni belgilash — avvalo, nimani o‘rganish kerakligi aniqlanadi. Masalan, talabalarning darsdagi faolligini o‘rganish.<\/li><li value=\"2\">Reja tuzish — kuzatish qayerda, qachon, qancha vaqt va qanday sharoitda o‘tkazilishi belgilanadi.<\/li><li value=\"3\">Kuzatish jarayoni — tadqiqotchi insonning xatti-harakatlari, muloqoti va ruhiy reaksiyalarini kuzatadi.<\/li><li value=\"4\">Ma’lumotlarni qayd etish — kuzatilgan holatlar kundalik, jadval, audio yoki video yozuvlar orqali qayd qilinadi. Bunda faqat kuzatilgan faktlar yozilishi kerak.<\/li><li value=\"5\">Natijalarni tahlil qilish — to‘plangan ma’lumotlar o‘rganilib, takrorlanadigan xatti-harakatlar va muhim belgilar aniqlanadi.<\/li><li value=\"6\">Xulosa chiqarish — tahlil natijasida tadqiqot maqsadiga mos ilmiy xulosa shakllantiriladi.<\/li><\/ol>\n<h4>7. Kuzatish metodining afzalliklari<\/h4>\n<ul><li>Inson xulq-atvorini tabiiy sharoitda o‘rganish imkonini beradi.<\/li><li>Haqiqiy xatti-harakatlar haqida ma’lumot to‘plashga yordam beradi.<\/li><li>Turli yoshdagi insonlarni o‘rganishda qo‘llaniladi.<\/li><li>Maxsus murakkab jihozlarni talab qilmaydi.<\/li><li>Boshqa tadqiqot metodlari bilan birgalikda foydalanish mumkin.<\/li><\/ul>\n<h4>5. Kuzatish metodining kamchiliklari<\/h4>\n<ul><li>Tadqiqotchining shaxsiy fikri natijalarga ta’sir qilishi mumkin.<\/li><li>Insonning ichki kechinmalarini bevosita aniqlash qiyin.<\/li><li>Ba’zi xatti-harakatlar kamdan-kam sodir bo‘lishi mumkin.<\/li><li>Kuzatish ko‘p vaqt talab qilishi mumkin.<\/li><li>Kuzatilayotgan inson o‘z xatti-harakatlarini o‘zgartirishi ehtimoli mavjud.<\/li><\/ul>\n<h4>6. Kuzatish metodiga amaliy misol<\/h4>\n<p>Masalan, psixolog o‘quvchilarning dars jarayonidagi faolligini o‘rganmoqchi. Buning uchun u bir necha dars davomida o‘quvchilarni kuzatadi. Kim savollarga javob berayotgani, kim diqqat bilan tinglayotgani, kim topshiriqlarni mustaqil bajarayotgani va kim guruh bilan faol ishlayotganini qayd etadi.<\/p>\n<p>Keyinchalik yig‘ilgan ma’lumotlar tahlil qilinadi va o‘quvchilarning darsdagi faolligi haqida xulosa chiqariladi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Kuzatish metodi psixologiyada insonning xulq-atvori, ruhiy holati va faoliyatini tabiiy yoki maxsus tashkil etilgan sharoitda o‘rganish usulidir. U maqsadni belgilash, reja tuzish, kuzatish, ma’lumotlarni qayd etish, tahlil qilish va xulosa chiqarish bosqichlari orqali amalga oshiriladi. Ushbu metod insonning kundalik hayotdagi xatti-harakatlarini o‘rganishda muhim ilmiy ahamiyatga ega.<\/p>"}, {"n": 7, "title": "Eksperiment metodi nima va uning kuzatish metodidan farqi nimada?", "html": "<p>Eksperiment metodi — psixologiyada insonning psixik jarayonlari, ruhiy holatlari va xulq-atvorini maxsus tashkil etilgan sharoitda, ma’lum omillarni o‘zgartirish orqali o‘rganish usulidir. Bu metod yordamida muayyan omilning inson ruhiyatiga qanday ta’sir ko‘rsatishi aniqlanadi.<\/p>\n<p>Eksperiment psixologik tadqiqotlarda sabab va natija o‘rtasidagi bog‘liqlikni aniqlashga yordam beradi. Tadqiqotchi tajriba sharoitini nazorat qiladi va olingan natijalarni tahlil qiladi.<\/p>\n<h4>1. Eksperiment metodining asosiy maqsadi<\/h4>\n<p>Eksperiment metodining asosiy maqsadi psixik hodisalarning yuzaga kelish sabablari, rivojlanish shartlari va turli omillar ta’sirida qanday o‘zgarishini aniqlashdan iborat.<\/p>\n<p>U quyidagi jarayonlarni o‘rganishda qo‘llaniladi:<\/p>\n<ul><li>Inson xotirasi va diqqatining faoliyati.<\/li><li>Tafakkur va fikrlash tezligi.<\/li><li>Sezgi va idrok xususiyatlari.<\/li><li>Hissiy reaksiyalar.<\/li><li>O‘rganish va bilimlarni o‘zlashtirish jarayoni.<\/li><li>Turli vaziyatlarda inson xulq-atvorining o‘zgarishi.<\/li><\/ul>\n<h4>2. Eksperiment metodining turlari<\/h4>\n<p>Psixologiyada eksperimentning asosiy turlari quyidagilardan iborat:<\/p>\n<ol><li value=\"1\">Laboratoriya eksperimenti — maxsus jihozlangan va nazorat qilinadigan sharoitda o‘tkaziladi. Masalan, insonning reaksiya tezligini maxsus qurilma yordamida aniqlash.<\/li><li value=\"2\">Tabiiy eksperiment — insonning odatiy faoliyati davomida, tabiiy sharoitda tashkil etiladi. Masalan, o‘quvchilarning yangi ta’lim usuli orqali bilimlarni qay darajada o‘zlashtirishini dars jarayonida tekshirish.<\/li><li value=\"3\">Aniqlovchi eksperiment — mavjud holat yoki xususiyatning darajasini aniqlashga qaratiladi.<\/li><li value=\"4\">Shakllantiruvchi eksperiment — muayyan psixologik xususiyat yoki ko‘nikmani rivojlantirishga qaratiladi. Masalan, o‘quvchilarda diqqatni jamlash ko‘nikmasini maxsus mashqlar orqali rivojlantirish.<\/li><\/ol>\n<h4>5. Eksperiment metodi qanday amalga oshiriladi?<\/h4>\n<p>Eksperiment odatda quyidagi bosqichlarda amalga oshiriladi:<\/p>\n<ol><li value=\"1\">Tadqiqot muammosini aniqlash — o‘rganiladigan psixologik hodisa belgilanadi.<\/li><li value=\"2\">Gipoteza ishlab chiqish — kutilayotgan natija haqida ilmiy taxmin ilgari suriladi.<\/li><li value=\"3\">Reja tuzish — tajriba sharoiti, ishtirokchilar va foydalaniladigan vositalar belgilanadi.<\/li><li value=\"4\">Tajribani o‘tkazish — belgilangan omil o‘zgartiriladi va uning ta’siri kuzatiladi.<\/li><li value=\"5\">Natijalarni qayd etish — olingan ma’lumotlar yozib boriladi.<\/li><li value=\"6\">Tahlil va xulosa — natijalar solishtiriladi, gipoteza tekshiriladi va ilmiy xulosa chiqariladi.<\/li><\/ol>\n<h4>7. Eksperiment metodining afzalliklari<\/h4>\n<ul><li>Psixik hodisalarning sabab va oqibatlarini aniqlash imkonini beradi.<\/li><li>Tadqiqot sharoitini nazorat qilish mumkin.<\/li><li>Natijalarni taqqoslash va o‘lchash imkonini beradi.<\/li><li>Tajribani muayyan sharoitlarda takrorlash mumkin.<\/li><li>Ilmiy xulosalarning ishonchliligini oshirishga yordam beradi.<\/li><\/ul>\n<h4>5. Eksperiment metodining kamchiliklari<\/h4>\n<ul><li>Maxsus sharoit va tayyorgarlik talab qilishi mumkin.<\/li><li>Laboratoriya sharoiti insonning tabiiy xulq-atvoriga ta’sir qilishi mumkin.<\/li><li>Ayrim ruhiy hodisalarni sun’iy sharoitda o‘rganish qiyin.<\/li><li>Natijalarga ishtirokchilarning individual xususiyatlari ta’sir qilishi mumkin.<\/li><li>Tadqiqotda axloqiy talablar va ishtirokchilarning roziligi hisobga olinishi zarur.<\/li><\/ul>\n<h4>6. Eksperiment va kuzatish metodlarining farqi<\/h4>\n<p>Kuzatish va eksperiment psixologiyaning muhim ilmiy tadqiqot metodlari hisoblanadi. Ularning asosiy farqi tadqiqotchining jarayonga munosabatida namoyon bo‘ladi.<\/p>\n<p>Kuzatish metodida tadqiqotchi insonning tabiiy xatti-harakatlarini aralashmasdan kuzatadi va qayd etadi. Eksperiment metodida esa tadqiqotchi maxsus sharoit yaratadi yoki muayyan omilni o‘zgartirib, uning ta’sirini tekshiradi.<\/p>\n<p>Asosiy farqlar:<\/p>\n<ol><li value=\"1\">Sharoit: kuzatish tabiiy yoki mavjud sharoitda olib boriladi; eksperiment maxsus tashkil etilgan yoki nazorat qilinadigan sharoitda o‘tkaziladi. 2. Tadqiqotchining ishtiroki: kuzatishda tadqiqotchi asosan kuzatuvchi bo‘ladi; eksperimentda esa jarayonni faol boshqaradi.<\/li><li value=\"3\">Maqsad: kuzatish xulq-atvor va ruhiy holatlarni qayd etadi; eksperiment esa muayyan omilning ta’sirini aniqlaydi.<\/li><li value=\"4\">Natija: kuzatish hodisa haqida ma’lumot beradi; eksperiment sabab va natija o‘rtasidagi bog‘liqlikni tekshirishga imkon yaratadi.<\/li><\/ol>\n<p>Amaliy misol:<\/p>\n<p>O‘qituvchi dars davomida o‘quvchilarning faolligini kuzatib, ularning savollarga javob berishi va topshiriqlarni bajarishini qayd etsa, bu kuzatish metodidir.<\/p>\n<p>Agar o‘qituvchi bir guruhga yangi o‘qitish usulini qo‘llab, boshqa guruhdagi an’anaviy usul natijalari bilan taqqoslasa, bu eksperiment metodidir.<\/p>\n<h4>Xulosa<\/h4>\n<p>Eksperiment metodi psixologik hodisalarni maxsus tashkil etilgan sharoitda o‘rganish va ularga turli omillarning ta’sirini aniqlash usulidir. Kuzatish metodidan asosiy farqi shundaki, kuzatishda tadqiqotchi mavjud xatti-harakatlarni qayd etadi, eksperimentda esa muayyan sharoit yoki omillarni o‘zgartirib, ularning natijasini tekshiradi. Har ikkala metod ham inson psixikasini ilmiy jihatdan o‘rganishda muhim ahamiyatga ega.<\/p>"}, {"n": 8, "title": "Suhbat, so‘rovnoma va psixologik test metodlari qanday qo‘llaniladi?", "html": "<p>Psixologiyada suhbat, so‘rovnoma va psixologik test metodlari insonning shaxsiy xususiyatlari, fikrlari, his-tuyg‘ulari, qiziqishlari va xulq-atvorini o‘rganishda keng qo‘llaniladi. Ushbu metodlar psixologik ma’lumotlarni to‘plash va tahlil qilishga yordam beradi.<\/p>\n<h4>1. Suhbat metodi<\/h4>\n<p>Suhbat metodi — psixolog va o‘rganilayotgan shaxs o‘rtasidagi maqsadli muloqot orqali ma’lumot olish usulidir. Bu metod yordamida insonning fikrlari, kechinmalari, ehtiyojlari, qiziqishlari va muammolari aniqlanadi.<\/p>\n<p>Suhbat metodi quyidagicha qo‘llaniladi:<\/p>\n<ul><li>Avval suhbatning maqsadi belgilanadi.<\/li><li>Suhbat uchun savollar tayyorlanadi.<\/li><li>Shaxs bilan erkin va samimiy muloqot o‘rnatiladi.<\/li><li>Savollarga berilgan javoblar tinglanadi va qayd etiladi.<\/li><li>Olingan ma’lumotlar tahlil qilinadi.<\/li><\/ul>\n<p>Suhbat erkin, rejalashtirilgan yoki yarim erkin shaklda o‘tkazilishi mumkin.<\/p>\n<p><strong>Misol:<\/strong> Psixolog o‘quvchining darsga qiziqishi pasayganini sezsa, u bilan suhbatlashib, buning sabablarini aniqlashi mumkin.<\/p>\n<ol><li value=\"2\">So‘rovnoma metodi<\/li><\/ol>\n<p>So‘rovnoma metodi — oldindan tayyorlangan yozma savollar orqali ko‘plab insonlardan ma’lumot to‘plash usulidir. Bu metod insonlarning fikri, munosabati, qiziqishi va qarashlarini o‘rganishda qo‘llaniladi.<\/p>\n<p>So‘rovnoma quyidagicha tashkil etiladi:<\/p>\n<ul><li>Tadqiqot maqsadiga mos savollar tuziladi.<\/li><li>Savollar tushunarli va aniq shaklda beriladi.<\/li><li>Ishtirokchilar savollarga yozma ravishda javob beradilar.<\/li><li>Javoblar yig‘iladi, guruhlanadi va tahlil qilinadi.<\/li><\/ul>\n<p>So‘rovnomalar ochiq va yopiq savollardan tashkil topishi mumkin. Ochiq savollarda ishtirokchi o‘z fikrini erkin yozadi, yopiq savollarda esa berilgan javoblardan birini tanlaydi.<\/p>\n<p><strong>Misol:<\/strong> Talabalar orasida universitetdagi ta’lim sifati va dars jarayonidan qoniqish darajasini aniqlash uchun so‘rovnoma o‘tkazish mumkin.<\/p>\n<h4>3. Psixologik test metodi<\/h4>\n<p>Psixologik test metodi — insonning psixologik xususiyatlarini maxsus topshiriqlar, savollar va mashqlar yordamida o‘lchash hamda baholash usulidir.<\/p>\n<p>Psixologik testlar orqali insonning:<\/p>\n<ul><li>Aqliy qobiliyati va intellekt darajasi;<\/li><li>Xotirasi va diqqati;<\/li><li>Temperamenti va xarakter xususiyatlari;<\/li><li>Shaxsiy qiziqishlari va moyilliklari;<\/li><li>Hissiy holati o‘rganilishi mumkin.<\/li><\/ul>\n<p>Psixologik testlar quyidagicha qo‘llaniladi:<\/p>\n<ul><li>Tadqiqot maqsadiga mos test tanlanadi.<\/li><li>Ishtirokchiga testni bajarish bo‘yicha ko‘rsatma beriladi.<\/li><li>Test belgilangan tartibda bajariladi.<\/li><li>Natijalar maxsus mezonlar asosida baholanadi.<\/li><li>Olingan natijalar psixologik jihatdan tahlil qilinadi.<\/li><\/ul>\n<p><strong>Misol:<\/strong> O‘quvchining diqqatini o‘rganish uchun unga ma’lum vaqt ichida belgilar orasidan keraklisini topish topshirig‘i berilishi mumkin.<\/p>\n<p>Ushbu metodlarning o‘zaro farqi<\/p>\n<ul><li>Suhbat — bevosita muloqot orqali ma’lumot olishga asoslanadi.<\/li><li>So‘rovnoma — yozma savollar va javoblar orqali ma’lumot to‘playdi.<\/li><li>Psixologik test — maxsus topshiriqlar yordamida psixologik xususiyatlarni baholaydi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Suhbat, so‘rovnoma va psixologik test metodlari psixologik tadqiqotlarda muhim ahamiyatga ega. Suhbat insonning ichki kechinmalari va fikrlarini chuqurroq o‘rganishga, so‘rovnoma ko‘p kishilarning fikrlarini yig‘ishga, psixologik test esa muayyan xususiyatlarni maxsus mezonlar asosida baholashga yordam beradi. Bu metodlardan to‘g‘ri va maqsadli foydalanish inson psixologiyasini yaxshiroq tushunish imkonini beradi.<\/p>"}, {"n": 9, "title": "Diqqat deganda nima tushuniladi va uning faoliyatdagi ahamiyati nimada?", "html": "<p>Diqqat — inson ongining muayyan narsa, hodisa yoki faoliyatga yo‘naltirilishi va unda jamlanishidir. Diqqat yordamida inson atrof-muhitdagi ma’lumotlarni tanlab qabul qiladi, muhim jihatlarga e’tibor qaratadi va o‘z faoliyatini maqsadga muvofiq tashkil etadi.<\/p>\n<p>Diqqat mustaqil psixik jarayon bo‘lish bilan birga, boshqa psixik jarayonlar — sezgi, idrok, xotira va tafakkurning samarali kechishiga ham yordam beradi.<\/p>\n<h4>1. Diqqatning asosiy xususiyatlari<\/h4>\n<p>Diqqat bir nechta muhim xususiyatlarga ega:<\/p>\n<ol><li value=\"1\">Diqqatning jamlanganligi — inson ongining muayyan faoliyat yoki obyektga kuchli qaratilishi. 2. Diqqatning barqarorligi — diqqatni ma’lum vaqt davomida bir faoliyatga yo‘naltirib turish qobiliyati.<\/li><li value=\"3\">Diqqatning ko‘lami — bir vaqtning o‘zida qamrab olinishi mumkin bo‘lgan obyektlar miqdori.<\/li><li value=\"4\">Diqqatning taqsimlanishi — bir vaqtning o‘zida bir nechta faoliyatni nazorat qilish qobiliyati.<\/li><li value=\"5\">Diqqatning ko‘chishi — diqqatni bir faoliyat yoki obyektdan boshqasiga o‘tkazish qobiliyati.<\/li><li value=\"2\">Diqqatning turlari<\/li><\/ol>\n<p>Psixologiyada diqqatning uchta asosiy turi ajratiladi:<\/p>\n<ul><li>Ixtiyorsiz diqqat — insonning maxsus maqsadisiz, biror kuchli yoki kutilmagan ta’sir natijasida yuzaga keladi. Masalan, baland ovoz eshitilganda beixtiyor o‘sha tomonga qarash.<\/li><li>Ixtiyoriy diqqat — insonning ongli ravishda o‘z oldiga maqsad qo‘yib, diqqatini muayyan faoliyatga qaratishidir. Masalan, talabaning imtihonga tayyorlanishi.<\/li><li>Ixtiyoriydan keyingi diqqat — dastlab iroda kuchi bilan boshlangan faoliyatga keyinchalik qiziqish ortishi natijasida diqqatning tabiiy ravishda davom etishidir. Masalan, kitob o‘qishni majburan boshlagan talabaning keyinchalik asarga qiziqib ketishi.<\/li><\/ul>\n<h4>3. Diqqatning faoliyatdagi ahamiyati<\/h4>\n<p>Diqqat insonning kundalik hayoti, ta’lim olishi va mehnat faoliyatida katta ahamiyatga ega.<\/p>\n<ul><li>Ta’lim jarayonida: o‘quvchi yoki talabaning mavzuni tushunishi, ma’lumotlarni eslab qolishi va topshiriqlarni to‘g‘ri bajarishiga yordam beradi.<\/li><li>Mehnat faoliyatida: ish unumdorligini oshiradi, xatolar va e’tiborsizlikning oldini oladi.<\/li><li>Muloqotda: suhbatdoshni diqqat bilan tinglash, uning fikrini tushunish va to‘g‘ri javob qaytarishga yordam beradi.<\/li><li>Xotira va tafakkurda: ma’lumotlarni yaxshiroq qabul qilish, tahlil qilish va eslab qolishni osonlashtiradi.<\/li><li>Xavfsizlikda: yo‘l harakati, ishlab chiqarish va boshqa vaziyatlarda xavfni o‘z vaqtida sezishga yordam beradi.<\/li><\/ul>\n<h4>4. Diqqatni rivojlantirish usullari<\/h4>\n<p>Diqqatni muntazam mashq qilish orqali rivojlantirish mumkin. Buning uchun:<\/p>\n<ul><li>Kitob va matnlarni diqqat bilan o‘qish;<\/li><li>Mantiqiy masalalar va boshqotirmalar yechish;<\/li><li>Biror topshiriqni oxirigacha bajarishga odatlanish;<\/li><li>Chalg‘ituvchi omillarni kamaytirish;<\/li><li>Yetarli dam olish va uyqu tartibiga rioya qilish lozim.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Diqqat inson faoliyatining samarali tashkil etilishida muhim o‘rin tutadigan psixologik hodisadir. U bilim olish, mehnat qilish, muloqot qilish va kundalik vazifalarni bajarishda muhim ahamiyatga ega. Diqqat qanchalik barqaror va jamlangan bo‘lsa, inson o‘z faoliyatini shunchalik samarali amalga oshiradi. Shu sababli diqqatni rivojlantirish har bir inson uchun muhim hisoblanadi.<\/p>"}, {"n": 10, "title": "Diqqatning fiziologik asoslari nimalardan iborat?", "html": "<p>Diqqatning fiziologik asoslari bosh miya faoliyati, nerv tizimi va miya po‘stlog‘ida yuz beradigan jarayonlar bilan bog‘liq. Inson diqqatini biror narsa yoki faoliyatga qaratganda, miyada muayyan nerv markazlarining faolligi ortadi. Bu jarayonlar diqqatning yuzaga kelishi, saqlanishi va bir obyektdan boshqasiga ko‘chishini ta’minlaydi.<\/p>\n<h4>1. Bosh miya po‘stlog‘ining faoliyati<\/h4>\n<p>Diqqatning fiziologik asoslaridan biri bosh miya katta yarimsharlari po‘stlog‘idagi nerv jarayonlaridir. Miya po‘stlog‘ining ayrim qismlari faollashganda, inson muayyan axborotga ko‘proq e’tibor qaratadi. Masalan, talaba ma’ruzani tinglayotganda eshitish bilan bog‘liq miya sohalari faol ishlaydi.<\/p>\n<h4>2. Qo‘zg‘alish va tormozlanish jarayonlari<\/h4>\n<p>Diqqatning shakllanishida qo‘zg‘alish va tormozlanish muhim rol o‘ynaydi.<\/p>\n<ul><li>Qo‘zg‘alish — nerv hujayralari faoliyatining kuchayishi bo‘lib, diqqat qaratilgan obyektni yaxshiroq idrok etishga yordam beradi.<\/li><li>Tormozlanish — ayrim nerv markazlari faoliyatining susayishi bo‘lib, ikkinchi darajali ta’sirlarni cheklashga yordam beradi.<\/li><\/ul>\n<p>Masalan, talaba dars tinglayotganda o‘qituvchining gaplariga diqqatini qaratadi va atrofdagi ortiqcha shovqinlarga kamroq e’tibor beradi.<\/p>\n<h4>3. Dominanta prinsipi<\/h4>\n<p>Rus fiziologi A. A. Uxtomskiy tomonidan ishlab chiqilgan dominanta ta’limotiga ko‘ra, bosh miya markazlaridan birida vaqtincha ustun qo‘zg‘alish o‘chog‘i hosil bo‘lishi mumkin. Bu o‘choq boshqa markazlar faoliyatiga ta’sir ko‘rsatib, inson diqqatining muayyan faoliyatga yo‘nalishiga yordam beradi.<\/p>\n<p>Masalan, inson qiziqarli kitob o‘qishga berilib ketganda, atrofdagi ayrim tovushlarni sezmay qolishi mumkin.<\/p>\n<h4>4. Retikulyar formatsiyaning roli<\/h4>\n<p>Retikulyar formatsiya — miya ustunida joylashgan nerv tuzilmalari majmuasi bo‘lib, bosh miya po‘stlog‘ining faollik darajasini boshqarishda qatnashadi. U uyg‘oqlik, hushyorlik va diqqatni saqlash uchun zarur bo‘lgan faollikni ta’minlashda muhim ahamiyatga ega.<\/p>\n<h4>5. Diqqatning fiziologik mexanizmlari<\/h4>\n<p>Diqqatning fiziologik asoslarini quyidagi jarayonlar orqali tushuntirish mumkin:<\/p>\n<ul><li>Nerv tizimining tashqi va ichki ta’sirlarga javob berishi;<\/li><li>Miya po‘stlog‘ida qo‘zg‘alish va tormozlanish jarayonlarining o‘zaro ta’siri;<\/li><li>Muayyan nerv markazlarining ustun faollashuvi;<\/li><li>Retikulyar formatsiya orqali miya faolligining boshqarilishi;<\/li><li>Muhim axborotni tanlash va ikkinchi darajali ta’sirlarni cheklash.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Diqqatning fiziologik asoslari bosh miya, nerv tizimi, qo‘zg‘alish va tormozlanish jarayonlari hamda retikulyar formatsiya faoliyati bilan chambarchas bog‘liq. Ushbu mexanizmlar insonning muayyan faoliyatga diqqatini jamlashi, uni saqlashi va zarur vaqtda boshqa faoliyatga ko‘chirishi uchun xizmat qiladi. Demak, diqqat inson miyasining murakkab fiziologik faoliyati natijasida yuzaga keladi.<\/p>"}, {"n": 11, "title": "Ixtiyorsiz diqqat nima va u qanday yuzaga keladi?", "html": "<p>Ixtiyorsiz diqqat — insonning oldindan belgilangan maqsadi yoki maxsus irodaviy harakatisiz, beixtiyor ravishda muayyan narsa, hodisa yoki voqeaga e’tibor qaratishidir. Bunday diqqat insonning xohishidan qat’i nazar yuzaga keladi va ko‘pincha tashqi muhitdagi kuchli yoki noodatiy ta’sirlar bilan bog‘liq bo‘ladi.<\/p>\n<h4>1. Ixtiyorsiz diqqatning yuzaga kelish sabablari<\/h4>\n<p>Ixtiyorsiz diqqat bir qancha omillar ta’sirida paydo bo‘ladi:<\/p>\n<ul><li>Kuchli ta’sirlar: baland ovoz, yorqin nur yoki keskin hid inson e’tiborini beixtiyor tortadi.<\/li><li>Yangilik: inson uchun yangi va notanish bo‘lgan hodisalar diqqatni jalb qiladi.<\/li><li>Harakat va o‘zgarish: harakatlanayotgan yoki to‘satdan o‘zgargan narsalar e’tiborni o‘ziga tortadi.<\/li><li>Qiziqish: insonni qiziqtirgan mavzu yoki hodisa uning diqqatini tabiiy ravishda jalb qiladi. - Shaxsiy ehtiyojlar: insonning ehtiyojlari va manfaatlariga aloqador narsalar uning e’tiborini tezroq tortadi.<\/li><\/ul>\n<h4>2. Ixtiyorsiz diqqatning asosiy xususiyatlari<\/h4>\n<p>Ixtiyorsiz diqqat quyidagi xususiyatlarga ega:<\/p>\n<ol><li value=\"1\">Maxsus iroda kuchini talab qilmaydi.<\/li><li value=\"2\">Insonning oldindan qo‘ygan maqsadisiz yuzaga keladi.<\/li><li value=\"3\">Ko‘pincha tashqi ta’sirlar yoki ichki qiziqishlar bilan bog‘liq bo‘ladi.<\/li><li value=\"4\">Kuchli va noodatiy hodisalarga nisbatan tez paydo bo‘ladi.<\/li><li value=\"5\">Ayrim hollarda qisqa muddat davom etadi, ammo qiziqarli hodisa ta’sirida uzoqroq saqlanishi ham mumkin.<\/li><\/ol>\n<h4>3. Ixtiyorsiz diqqatga misollar<\/h4>\n<ul><li>Talaba dars tinglayotgan paytda to‘satdan baland ovoz eshitib, beixtiyor o‘sha tomonga qaraydi.<\/li><li>Ko‘chada ketayotgan inson kutilmaganda yorqin rangdagi reklama yozuviga e’tibor beradi.<\/li><li>Kitob o‘qiyotgan odam deraza ortidan uchib o‘tgan qushni ko‘rib, o‘qishdan chalg‘iydi.<\/li><li>Inson o‘ziga yoqadigan musiqa tovushini eshitganda, beixtiyor tinglay boshlaydi.<\/li><\/ul>\n<h4>4. Ixtiyorsiz diqqatning ahamiyati<\/h4>\n<p>Ixtiyorsiz diqqat inson hayotida muhim ahamiyatga ega. U atrof-muhitdagi muhim o‘zgarishlarni tezda sezish, xavf-xatardan ogoh bo‘lish va yangi ma’lumotlarni qabul qilishga yordam beradi. Ta’lim jarayonida esa qiziqarli misollar, ko‘rgazmali vositalar va noodatiy topshiriqlar o‘quvchilarning ixtiyorsiz diqqatini jalb qilishi mumkin.<\/p>\n<h4>Xulosa<\/h4>\n<p>Ixtiyorsiz diqqat insonning maxsus maqsad va iroda kuchisiz yuzaga keladigan diqqat turidir. U kuchli ta’sirlar, yangilik, harakat, qiziqish va ehtiyojlar natijasida shakllanadi. Ixtiyorsiz diqqat atrof-muhitni tez anglash va muhim hodisalarga o‘z vaqtida munosabat bildirishda katta ahamiyatga ega.<\/p>"}, {"n": 12, "title": "Ixtiyoriy diqqat nima va uni boshqarish qanday amalga oshiriladi?", "html": "<p>Ixtiyoriy diqqat — insonning oldindan belgilangan maqsad asosida o‘z diqqatini ongli ravishda muayyan narsa, hodisa yoki faoliyatga yo‘naltirishi va uni ma’lum vaqt davomida saqlab turishidir. Bunday diqqat insondan iroda kuchi, sabr-toqat va o‘zini boshqarishni talab qiladi.<\/p>\n<p>Masalan, talabaning imtihonga tayyorlanish uchun telefonini chetga qo‘yib, darslikni diqqat bilan o‘qishi ixtiyoriy diqqatga misol bo‘ladi.<\/p>\n<h4>1. Ixtiyoriy diqqatning asosiy xususiyatlari<\/h4>\n<p>Ixtiyoriy diqqat quyidagi xususiyatlarga ega:<\/p>\n<ol><li value=\"1\">Maqsadga yo‘naltirilganlik — inson diqqatini nima uchun va qaysi faoliyatga qaratayotganini biladi.<\/li><li value=\"2\">Ongli boshqarish — inson o‘z xohishi bilan diqqatini kerakli obyektga yo‘naltiradi.<\/li><li value=\"3\">Iroda kuchi — chalg‘ituvchi omillarga qaramay, faoliyatni davom ettirishga yordam beradi.<\/li><li value=\"4\">Barqarorlik — diqqatni ma’lum vaqt davomida bir faoliyatda saqlash imkonini beradi.<\/li><li value=\"5\">Mas’uliyat va intizom — belgilangan vazifalarni o‘z vaqtida bajarishga yordam beradi.<\/li><\/ol>\n<h4>2. Ixtiyoriy diqqatni boshqarish usullari<\/h4>\n<p>Ixtiyoriy diqqatni boshqarish insonning o‘z faoliyatini ongli ravishda tashkil etishi orqali amalga oshiriladi. Buning uchun quyidagi usullardan foydalaniladi:<\/p>\n<ul><li>Maqsad belgilash: bajariladigan ishning maqsadi va natijasini oldindan aniqlash.<\/li><li>Reja tuzish: faoliyatni kichik bosqichlarga ajratish va belgilangan tartibda bajarish. - Chalg‘ituvchi omillarni kamaytirish: telefon, ortiqcha shovqin va boshqa e’tiborni buzuvchi omillardan uzoqlashish.<\/li><li>Vaqtni to‘g‘ri taqsimlash: ishlash va dam olish vaqtlarini belgilash.<\/li><li>O‘zini nazorat qilish: diqqatning boshqa narsalarga chalg‘ishini sezish va uni yana asosiy vazifaga qaytarish.<\/li><li>Muntazam mashq qilish: kitob o‘qish, mantiqiy masalalar yechish va diqqatni rivojlantiruvchi mashqlar bajarish.<\/li><\/ul>\n<h4>3. Ixtiyoriy diqqatning faoliyatdagi ahamiyati<\/h4>\n<p>Ixtiyoriy diqqat insonning o‘qish, mehnat qilish va kundalik vazifalarni bajarishida katta ahamiyatga ega.<\/p>\n<ul><li>Ta’lim jarayonida mavzularni chuqur o‘zlashtirishga yordam beradi.<\/li><li>Ish jarayonida xatolarni kamaytiradi va samaradorlikni oshiradi.<\/li><li>Murakkab vazifalarni sabr bilan bajarishga imkon yaratadi.<\/li><li>Insonda intizom, mas’uliyat va iroda sifatlarini rivojlantiradi.<\/li><li>Belgilangan maqsadga erishishda muhim rol o‘ynaydi.<\/li><\/ul>\n<h4>4. Ixtiyorsiz va ixtiyoriy diqqatning farqi<\/h4>\n<p>Ixtiyorsiz diqqat maxsus maqsad va iroda kuchisiz, beixtiyor yuzaga keladi. Ixtiyoriy diqqat esa insonning ongli ravishda maqsad qo‘yishi va o‘z diqqatini boshqarishi natijasida paydo bo‘ladi.<\/p>\n<p>Masalan, ko‘chada baland ovozni eshitib qarash — ixtiyorsiz diqqat, imtihonga tayyorlanish uchun darslikni diqqat bilan o‘qish esa ixtiyoriy diqqat hisoblanadi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Ixtiyoriy diqqat insonning ongli faoliyati va iroda kuchiga asoslangan muhim psixologik jarayondir. Uni boshqarish maqsad qo‘yish, rejalashtirish, o‘zini nazorat qilish va chalg‘ituvchi omillarni kamaytirish orqali amalga oshiriladi. Ixtiyoriy diqqatni rivojlantirish insonning bilim olishi, mehnat faoliyati va shaxsiy rivojlanishida muhim ahamiyatga ega.<\/p>"}, {"n": 13, "title": "Ixtiyoriydan keyingi diqqat deganda nima tushuniladi?", "html": "<p>Ixtiyoriydan keyingi diqqat — dastlab insonning ongli maqsadi va iroda kuchi bilan yuzaga kelib, keyinchalik faoliyatga bo‘lgan qiziqish ortishi natijasida tabiiy ravishda davom etadigan diqqat turidir.<\/p>\n<p>Bunda inson faoliyatni avvaliga o‘zini majburlash yoki iroda kuchini ishga solish orqali boshlaydi. Ammo vaqt o‘tishi bilan bajarilayotgan ish unga qiziqarli bo‘lib qoladi va diqqatni saqlash uchun alohida kuch sarflashga ehtiyoj kamayadi.<\/p>\n<h4>1. Ixtiyoriydan keyingi diqqatning yuzaga kelishi<\/h4>\n<p>Ushbu diqqat turi odatda uch bosqichda shakllanadi:<\/p>\n<ol><li value=\"1\">Dastlabki bosqich: inson muayyan faoliyatni maqsad asosida, iroda kuchini ishga solib boshlaydi.<\/li><li value=\"2\">Qiziqishning ortishi: faoliyat jarayonida inson mavzuni yaxshiroq tushuna boshlaydi va unga qiziqishi kuchayadi.<\/li><li value=\"3\">Tabiiy davom etish: faoliyat inson uchun qiziqarli bo‘lib qoladi, diqqat esa ortiqcha irodaviy zo‘riqishsiz davom etadi.<\/li><\/ol>\n<h4>2. Ixtiyoriydan keyingi diqqatning asosiy xususiyatlari<\/h4>\n<ul><li>Dastlab ongli maqsad va iroda kuchi bilan yuzaga keladi.<\/li><li>Faoliyatga bo‘lgan qiziqishning ortishi bilan mustahkamlanadi.<\/li><li>Diqqatni saqlash uchun kuchli irodaviy zo‘riqish talab qilmaydi.<\/li><li>Insonning faoliyatga chuqur berilishiga yordam beradi.<\/li><li>Faoliyatning samarali va unumli bajarilishini ta’minlaydi.<\/li><\/ul>\n<h4>3. Ixtiyoriydan keyingi diqqatga misollar<\/h4>\n<ul><li>Talaba imtihonga tayyorlanish uchun kitob o‘qishni boshlaydi. Dastlab o‘zini majburlaydi, ammo kitob mazmuni qiziqarli bo‘lib borgani sari o‘qishga berilib ketadi.<\/li><li>Inson yangi tilni o‘rganishni maqsad qiladi. Dastlab muntazam shug‘ullanishga o‘zini undaydi, keyinchalik til o‘rganish unga zavq bag‘ishlay boshlaydi.<\/li><li>O‘quvchi murakkab matematik masalani yechishga kirishadi. Dastlab qiynalsa-da, yechimni topishga qiziqib, faoliyatni davom ettiradi.<\/li><\/ul>\n<h4>4. Diqqatning uch turi o‘rtasidagi farq<\/h4>\n<ul><li>Ixtiyorsiz diqqat — maxsus maqsad va iroda kuchisiz, beixtiyor yuzaga keladi.<\/li><li>Ixtiyoriy diqqat — ongli maqsad va iroda kuchi yordamida boshqariladi.<\/li><li>Ixtiyoriydan keyingi diqqat — dastlab iroda kuchi bilan boshlanib, keyinchalik qiziqish tufayli tabiiy ravishda davom etadi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Ixtiyoriydan keyingi diqqat inson faoliyatining eng samarali shakllaridan biri hisoblanadi. Chunki bunda inson dastlab o‘z irodasini ishga solib faoliyatni boshlaydi, keyinchalik esa unga qiziqib, ortiqcha zo‘riqishsiz davom ettiradi. Ushbu diqqat turi ta’lim olish, kasbiy faoliyat va ijodiy ishlarni samarali bajarishda muhim ahamiyatga ega.<\/p>"}, {"n": 14, "title": "Diqqatning barqarorligi, jamlanishi va hajmi qanday farqlanadi?", "html": "<p>Diqqat insonning muayyan narsa, hodisa yoki faoliyatga ongli ravishda e’tibor qaratishidir. Diqqat bir nechta xususiyatlarga ega bo‘lib, ular orasida barqarorlik, jamlanish va hajm alohida ahamiyatga ega. Ushbu xususiyatlar insonning axborotni qabul qilishi va faoliyatni samarali bajarishiga yordam beradi.<\/p>\n<h4>1. Diqqatning barqarorligi<\/h4>\n<p>Diqqatning barqarorligi — insonning o‘z diqqatini muayyan obyekt yoki faoliyatga ma’lum vaqt davomida uzluksiz saqlab turish qobiliyatidir.<\/p>\n<p>Barqaror diqqat insonning bir ishga uzoq vaqt davomida e’tibor qaratishi va chalg‘ituvchi omillarga berilmasligida namoyon bo‘ladi.<\/p>\n<p><strong>Misol:<\/strong> Talabaning ikki soat davomida ilmiy kitob o‘qib, uning mazmunini diqqat bilan o‘rganishi.<\/p>\n<p>Diqqat barqarorligiga qiziqish, motivatsiya, charchoq, dam olish va tashqi muhit ta’sir ko‘rsatadi.<\/p>\n<h4>2. Diqqatning jamlanishi<\/h4>\n<p>Diqqatning jamlanishi — inson ongining muayyan obyekt yoki faoliyatga kuchli darajada to‘planishi va boshqa ta’sirlardan cheklanishidir.<\/p>\n<p>Diqqatning jamlanishi yuqori bo‘lganda inson asosiy vazifaga chuqur e’tibor beradi va atrofdagi ikkinchi darajali hodisalarga kamroq chalg‘iydi.<\/p>\n<p><strong>Misol:<\/strong> Talabaning murakkab matematik masalani yechish vaqtida butun e’tiborini masalaga qaratishi.<\/p>\n<p>Diqqatning jamlanishi murakkab vazifalarni bajarish, xatolarni kamaytirish va muhim ma’lumotlarni yaxshiroq o‘zlashtirishda muhim ahamiyatga ega.<\/p>\n<h4>3. Diqqatning hajmi<\/h4>\n<p>Diqqatning hajmi — insonning qisqa vaqt ichida bir vaqtning o‘zida aniq idrok eta oladigan obyektlari yoki elementlari miqdoridir.<\/p>\n<p>Diqqat hajmi insonning axborotni qanchalik keng qamrab olishini ko‘rsatadi. U obyektlarning xususiyatlari, ularning o‘zaro bog‘liqligi va insonning tajribasiga bog‘liq.<\/p>\n<p><strong>Misol:<\/strong> Inson bir qarashda bir nechta raqam, harf yoki predmetni ko‘rib, ularni bir vaqtning o‘zida idrok etishi mumkin.<\/p>\n<h4>4. Ushbu xususiyatlarning o‘zaro farqi<\/h4>\n<p>Diqqat xususiyati| Mazmuni| Asosiy savol Barqarorlik| Diqqatni uzoq vaqt saqlash| Qancha vaqt? Jamlanish| Diqqatni bir obyektga kuchli qaratish| Qanchalik chuqur? Hajm| Bir vaqtning o‘zida qamrab olinadigan obyektlar miqdori| Qancha obyekt?<\/p>\n<h4>5. Diqqat xususiyatlarining faoliyatdagi ahamiyati<\/h4>\n<p>Ushbu uch xususiyat insonning o‘qish, mehnat qilish va kundalik faoliyatida muhim o‘rin tutadi:<\/p>\n<ul><li>Barqarorlik vazifani oxirigacha bajarishga yordam beradi.<\/li><li>Jamlanish asosiy ma’lumotga chuqur e’tibor qaratishni ta’minlaydi.<\/li><li>Hajm bir vaqtning o‘zida bir nechta obyekt yoki ma’lumotni qamrab olish imkonini beradi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Diqqatning barqarorligi, jamlanishi va hajmi bir-biri bilan bog‘liq bo‘lsa-da, mazmun jihatidan farqlanadi. Barqarorlik diqqatning davomiyligini, jamlanish uning kuchli yo‘naltirilishini, hajm esa bir vaqtning o‘zida qamrab olinadigan obyektlar sonini bildiradi. Ushbu xususiyatlarning rivojlanganligi inson faoliyatining samaradorligini oshiradi.<\/p>"}, {"n": 15, "title": "Diqqatning taqsimlanishi va ko‘chishi nima? Misollar keltiring.", "html": "<p>Diqqatning taqsimlanishi va ko‘chishi diqqatning muhim xususiyatlari hisoblanadi. Ular insonning bir nechta faoliyatni bajarishi yoki diqqatini bir faoliyatdan boshqasiga o‘tkazish imkoniyatini ifodalaydi.<\/p>\n<ol><li value=\"1\">Diqqatning taqsimlanishi<\/li><\/ol>\n<p>Diqqatning taqsimlanishi — insonning bir vaqtning o‘zida ikki yoki undan ortiq faoliyat yoki obyektga e’tibor qaratish qobiliyatidir.<\/p>\n<p>Bu xususiyat insonning bir nechta vazifani birgalikda bajarishiga yordam beradi. Biroq faoliyatlarning murakkabligi va insonning tajribasi diqqatni taqsimlash imkoniyatiga ta’sir qiladi.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>O‘qituvchining dars tushuntirish bilan birga o‘quvchilarni kuzatib turishi.<\/li><li>Talabaning ma’ruza tinglash bilan bir vaqtda muhim ma’lumotlarni yozib borishi.<\/li><li>Haydovchining avtomobilni boshqarish bilan birga yo‘l belgilarini va harakatdagi boshqa transport vositalarini kuzatishi.<\/li><\/ul>\n<ol><li value=\"2\">Diqqatning ko‘chishi<\/li><\/ol>\n<p>Diqqatning ko‘chishi — insonning diqqatini biror obyekt yoki faoliyatdan boshqasiga ongli ravishda o‘tkazish qobiliyatidir.<\/p>\n<p>Diqqatning ko‘chishi yangi vaziyatga moslashish, o‘zgarishlarga tez munosabat bildirish va turli vazifalarni ketma-ket bajarishda muhim ahamiyatga ega.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Talabaning darslik o‘qishdan matematik masala yechishga o‘tishi.<\/li><li>O‘qituvchining bir o‘quvchining savoliga javob berib, keyin boshqa o‘quvchining javobini tinglashi.<\/li><li>Insonning kitob o‘qib o‘tirgan paytda telefon qo‘ng‘irog‘iga javob berish uchun diqqatini boshqa faoliyatga qaratishi.<\/li><\/ul>\n<h4>3. Diqqatning taqsimlanishi va ko‘chishining farqi<\/h4>\n<p>Diqqat xususiyati| Mazmuni| Misol<\/p>\n<p>Taqsimlanishi| Bir vaqtning o‘zida bir nechta faoliyatga e’tibor qaratish| Ma’ruza tinglash va yozib borish<\/p>\n<p>Ko‘chishi| Diqqatni bir faoliyatdan boshqasiga o‘tkazish| Kitob o‘qishdan masala yechishga o‘tish<\/p>\n<h4>4. Ushbu xususiyatlarning faoliyatdagi ahamiyati<\/h4>\n<p>Diqqatning taqsimlanishi va ko‘chishi insonning kundalik hayoti, ta’lim olishi va mehnat faoliyatida muhim o‘rin tutadi. Ular vaqtni tejash, vazifalarni samarali bajarish, yangi vaziyatlarga moslashish va kerakli ma’lumotlarga o‘z vaqtida e’tibor qaratishga yordam beradi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Diqqatning taqsimlanishi insonning bir vaqtning o‘zida bir nechta faoliyatga e’tibor qaratish qobiliyati bo‘lsa, diqqatning ko‘chishi e’tiborni bir faoliyatdan boshqasiga o‘tkazishdir. Har ikkala xususiyat ham insonning faoliyatini to‘g‘ri tashkil etish va samaradorligini oshirishda muhim ahamiyatga ega.<\/p>"}, {"n": 16, "title": "Sezgi nima va uning inson hayotidagi ahamiyati nimada?", "html": "<p>Sezgi — insonning sezgi a’zolariga tashqi va ichki muhitdagi narsa hamda hodisalarning ayrim xususiyatlari bevosita ta’sir etishi natijasida hosil bo‘ladigan eng oddiy psixik jarayondir.<\/p>\n<p>Sezgi orqali inson predmetlarning rangi, shakli, hidi, ta’mi, harorati, tovushi va boshqa xususiyatlarini bilib oladi. Sezgi bilish jarayonining dastlabki bosqichi hisoblanadi.<\/p>\n<h4>1. Sezgining fiziologik asoslari<\/h4>\n<p>Sezgining fiziologik asosini analizatorlar faoliyati tashkil etadi. Har bir analizator uchta asosiy qismdan iborat:<\/p>\n<ol><li value=\"1\">Retseptorlar — tashqi yoki ichki ta’sirlarni qabul qiluvchi sezgir nerv uchlari.<\/li><li value=\"2\">O‘tkazuvchi nerv yo‘llari — qabul qilingan axborotni bosh miyaga yetkazadi.<\/li><li value=\"3\">Bosh miya po‘stlog‘idagi markazlar — kelgan axborotni qayta ishlaydi va sezgi hosil bo‘lishini ta’minlaydi.<\/li><\/ol>\n<p>Masalan, inson biror narsani ko‘rganda ko‘z retseptorlari yorug‘lik ta’sirini qabul qiladi, nerv yo‘llari orqali axborot miyaga uzatiladi va natijada ko‘rish sezgisi yuzaga keladi.<\/p>\n<h4>2. Sezgining asosiy turlari<\/h4>\n<p>Sezgilar insonning qaysi sezgi a’zosi orqali axborot qabul qilishiga qarab bir necha turga bo‘linadi:<\/p>\n<ul><li>Ko‘rish sezgisi — rang, shakl, hajm va yorug‘likni sezish.<\/li><li>Eshitish sezgisi — tovush, musiqa va nutqni eshitish.<\/li><li>Hid bilish sezgisi — turli hidlarni farqlash.<\/li><li>Ta’m bilish sezgisi — shirin, achchiq, nordon va sho‘r ta’mlarni sezish.<\/li><li>Teri sezgilari — issiq, sovuq, bosim va og‘riqni sezish.<\/li><li>Muskul-harakat sezgilari — tana a’zolarining holati va harakatini his qilish.<\/li><li>Muvozanat sezgisi — tananing fazodagi holati va muvozanatini saqlashga yordam berish.<\/li><\/ul>\n<h4>3. Sezgining asosiy xususiyatlari<\/h4>\n<p>Sezgi quyidagi xususiyatlarga ega:<\/p>\n<ol><li value=\"1\">Sifati — sezgining boshqa sezgilardan farqlanuvchi xususiyati. Masalan, ranglarning turlicha bo‘lishi.<\/li><li value=\"2\">Kuchi — sezgining qanchalik kuchli yoki kuchsiz ekanligi.<\/li><li value=\"3\">Davomiyligi — sezgining qancha vaqt davom etishi.<\/li><li value=\"4\">Fazoviy joylashuvi — ta’sirning qayerda yuzaga kelganini aniqlash.<\/li><\/ol>\n<h4>4. Sezgining inson hayotidagi ahamiyati<\/h4>\n<p>Sezgi inson hayotida juda muhim vazifalarni bajaradi:<\/p>\n<ul><li>Atrof-muhitni bilish: inson narsalar va hodisalarning xususiyatlarini sezgi orqali anglaydi.<\/li><li>Xavfsizlikni ta’minlash: issiq narsani ushlaganda qo‘lni tortib olish yoki xavfli tovushni eshitish orqali inson o‘zini himoya qiladi.<\/li><li>Ta’lim olish: ko‘rish va eshitish sezgilari orqali yangi bilimlar o‘zlashtiriladi.<\/li><li>Muloqot: inson nutq tovushlarini eshitish va boshqa belgilarni ko‘rish orqali muloqot qiladi.<\/li><li>Harakatni boshqarish: tana holati va harakatlarini sezish orqali muvozanat saqlanadi.<\/li><\/ul>\n<h4>5. Sezgi va idrokning farqi<\/h4>\n<p>Sezgi va idrok bir-biri bilan chambarchas bog‘liq, ammo ular bir xil tushuncha emas.<\/p>\n<ul><li>Sezgi — predmet yoki hodisaning alohida xususiyatlarini aks ettiradi.<\/li><li>Idrok — predmet va hodisalarni yaxlit holda aks ettiradi.<\/li><\/ul>\n<p>Masalan, olmani ko‘rganda uning qizil rangini sezish — sezgi, olmani rangi, shakli va boshqa belgilariga ko‘ra yaxlit tanib olish esa idrok hisoblanadi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Sezgi insonning atrof-muhitni bilishida muhim o‘rin tutadigan dastlabki psixik jarayondir. U orqali inson tashqi va ichki muhitdan axborot oladi, narsalarning xususiyatlarini farqlaydi va ularga mos ravishda harakat qiladi. Sezgilarsiz insonning atrof-muhitni anglashi, bilim olishi va kundalik faoliyatini amalga oshirishi juda qiyin bo‘ladi.<\/p>"}, {"n": 17, "title": "Analizator nima va u qanday qismlardan tashkil topgan?", "html": "<p>Analizator — inson organizmida tashqi va ichki muhitdan keladigan ta’sirlarni qabul qilish, nerv impulslari shaklida miyaga yetkazish va ularni tahlil qilishga xizmat qiladigan murakkab nerv tizimidir.<\/p>\n<p>Analizatorlar yordamida inson atrofdagi narsalarning rangi, shakli, tovushi, hidi, ta’mi, harorati va boshqa xususiyatlarini sezadi. Analizator haqidagi ta’limot rus fiziologi I. P. Pavlov tomonidan ishlab chiqilgan.<\/p>\n<h4>1. Analizatorning asosiy qismlari<\/h4>\n<p>I. P. Pavlov ta’limotiga ko‘ra, har bir analizator uchta asosiy qismdan tashkil topadi:<\/p>\n<ol><li value=\"1\">Periferik qism (retseptorlar)<\/li><\/ol>\n<p>Bu qism tashqi yoki ichki muhitdan keladigan ta’sirlarni qabul qiladi. Retseptorlar ma’lum bir ta’sir turiga moslashgan bo‘ladi.<\/p>\n<p><strong>Misollar:<\/strong><\/p>\n<ul><li>Ko‘z retseptorlari — yorug‘likni qabul qiladi.<\/li><li>Quloq retseptorlari — tovushni qabul qiladi.<\/li><li>Burun retseptorlari — hidlarni sezadi.<\/li><li>Til retseptorlari — ta’mni sezadi.<\/li><\/ul>\n<h4>2. O‘tkazuvchi qism (nerv yo‘llari)<\/h4>\n<p>Bu qism retseptorlarda hosil bo‘lgan nerv impulslarini bosh miyaga yetkazadi. Nerv tolalari orqali axborot markaziy nerv tizimiga uzatiladi.<\/p>\n<p>Masalan, ko‘z orqali qabul qilingan yorug‘lik haqidagi axborot ko‘ruv nervi orqali miyaga yetkaziladi.<\/p>\n<ol><li value=\"3\">Markaziy qism (bosh miya po‘stlog‘idagi markazlar)<\/li><\/ol>\n<p>Bu qism bosh miya katta yarimsharlari po‘stlog‘ida joylashgan bo‘lib, kelgan nerv impulslarini tahlil qiladi va qayta ishlaydi. Natijada insonda muayyan sezgi hosil bo‘ladi.<\/p>\n<p>Masalan, inson ko‘zi orqali qizil rangni ko‘radi va miya ushbu rangni farqlash imkonini beradi.<\/p>\n<h4>2. Analizatorlarning asosiy turlari<\/h4>\n<p>Inson organizmida bir nechta analizatorlar mavjud:<\/p>\n<ol><li value=\"1\">Ko‘ruv analizatori — rang, shakl, hajm va yorug‘likni qabul qiladi.<\/li><li value=\"2\">Eshituv analizatori — tovushlar va nutqni qabul qiladi.<\/li><li value=\"3\">Hid bilish analizatori — turli hidlarni aniqlaydi.<\/li><li value=\"4\">Ta’m bilish analizatori — oziq-ovqat ta’mini farqlaydi.<\/li><li value=\"5\">Teri analizatori — issiq, sovuq, bosim va og‘riqni sezadi.<\/li><li value=\"6\">Harakat analizatori — tana a’zolarining harakati va holatini sezishga yordam beradi.<\/li><li value=\"7\">Vestibulyar analizator — tana muvozanati va fazodagi holatini boshqarishda qatnashadi.<\/li><\/ol>\n<h4>3. Analizatorlarning inson hayotidagi ahamiyati<\/h4>\n<p>Analizatorlar insonning atrof-muhit bilan aloqasini ta’minlaydi. Ularning asosiy vazifalari quyidagilardan iborat:<\/p>\n<ul><li>Tashqi va ichki muhitdan axborot olish.<\/li><li>Narsa va hodisalarning xususiyatlarini farqlash.<\/li><li>Atrof-muhitdagi o‘zgarishlarni sezish.<\/li><li>Xavf-xatardan himoyalanishga yordam berish.<\/li><li>Harakat va muvozanatni boshqarishda qatnashish.<\/li><li>Bilish jarayonlarining shakllanishiga asos bo‘lish.<\/li><\/ul>\n<h4>4. Analizatorning ishlashiga misol<\/h4>\n<p>Inson qo‘li bilan issiq choynakka tegib ketdi. Bunda teridagi retseptorlar issiqlik ta’sirini qabul qiladi. Nerv impulslari nerv yo‘llari orqali markaziy nerv tizimiga uzatiladi. Miya ushbu axborotni qayta ishlaydi va inson issiqlikni sezadi. Himoya refleksi orqali qo‘l tezda tortib olinadi.<\/p>\n<h4>Xulosa<\/h4>\n<p>Analizator inson organizmidagi muhim nerv tizimi bo‘lib, uchta asosiy qismdan — retseptorlar, o‘tkazuvchi nerv yo‘llari va bosh miya po‘stlog‘idagi markazlardan tashkil topadi. Ushbu qismlar birgalikda faoliyat yuritib, insonning tashqi va ichki muhitni sezishi, farqlashi va anglashini ta’minlaydi.<\/p>"}, {"n": 18, "title": "Eksterotseptiv, interotseptiv va propriotseptiv sezgilar qanday farqlanadi?", "html": "<p>Sezgilar inson organizmiga ta’sir etuvchi manbaga va axborotning qayerdan qabul qilinishiga qarab uchta asosiy guruhga bo‘linadi: eksterotseptiv, interotseptiv va propriotseptiv sezgilar. Ular insonning tashqi muhitni anglashiga, ichki organlar faoliyatini his qilishiga hamda tana harakatlarini boshqarishiga yordam beradi.<\/p>\n<h4>1. Eksterotseptiv sezgilar<\/h4>\n<p>Eksterotseptiv sezgilar — tashqi muhitdagi narsa va hodisalarning inson sezgi a’zolariga ta’siri natijasida yuzaga keladigan sezgilardir.<\/p>\n<p>Ular tashqi muhit haqida axborot beradi va insonning atrofdagi narsalarni bilishiga yordam beradi.<\/p>\n<p>Eksterotseptiv sezgilarga quyidagilar kiradi:<\/p>\n<ul><li>Ko‘rish — rang, shakl va yorug‘likni sezish.<\/li><li>Eshitish — tovush va nutqni eshitish.<\/li><li>Hid bilish — turli hidlarni sezish.<\/li><li>Ta’m bilish — shirin, achchiq, nordon va sho‘r ta’mlarni farqlash.<\/li><li>Teri sezgilari — issiq, sovuq, bosim va og‘riqni sezish.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Inson quyosh nurini ko‘rishi, qushlarning ovozini eshitishi yoki gulning hidini sezishi eksterotseptiv sezgilarga kiradi.<\/p>\n<h4>2. Interotseptiv sezgilar<\/h4>\n<p>Interotseptiv sezgilar — inson organizmining ichki a’zolari va ichki muhitida yuz beradigan jarayonlar haqida axborot beruvchi sezgilardir.<\/p>\n<p>Ular organizmning ichki holatini his qilish va ehtiyojlarini anglashga yordam beradi.<\/p>\n<p>Interotseptiv sezgilarga quyidagilar kiradi:<\/p>\n<ul><li>Ochlik va to‘qlik hissi.<\/li><li>Chanqash hissi.<\/li><li>Ichki organlardagi og‘riq.<\/li><li>Ko‘ngil aynishi.<\/li><li>Yurak urishi yoki nafas olishdagi ayrim o‘zgarishlarni his qilish.<\/li><\/ul>\n<p><strong>Misol:<\/strong> Inson uzoq vaqt ovqat yemasa, ochlikni his qiladi. Suv ichishga ehtiyoj sezishi yoki qorni og‘rishi ham interotseptiv sezgilarga misol bo‘ladi.<\/p>\n<ol><li value=\"3\">Propriotseptiv sezgilar<\/li><\/ol>\n<p>Propriotseptiv sezgilar — tana a’zolarining holati, harakati, mushaklarning tarangligi va tana muvozanati haqida axborot beruvchi sezgilardir.<\/p>\n<p>Ular insonning o‘z tanasini boshqarishi, harakatlarini muvofiqlashtirishi va fazoda o‘z holatini anglashiga yordam beradi.<\/p>\n<p>Propriotseptiv sezgilarga quyidagilar kiradi:<\/p>\n<ul><li>Mushaklarning qisqarishi va bo‘shashishini sezish.<\/li><li>Qo‘l va oyoqlarning holatini his qilish.<\/li><li>Tana harakatini sezish.<\/li><li>Harakat paytida mushaklarga tushadigan yukni his qilish.<\/li><\/ul>\n<p>Muvozanatni saqlashda vestibulyar sezgilar ham muhim rol o‘ynaydi.<\/p>\n<p><strong>Misol:<\/strong> Inson ko‘zini yumgan holda ham qo‘lining yuqoriga yoki pastga ko‘tarilganini sezishi, yurish yoki yugurish vaqtida tana harakatlarini boshqarishi propriotseptiv sezgilarga misol bo‘ladi.<\/p>\n<h4>4. Sezgilarning o‘zaro farqi<\/h4>\n<p>Sezgi turi| Axborot manbai| Asosiy vazifasi Eksterotseptiv| Tashqi muhit| Tashqi olamni sezish Interotseptiv| Ichki organlar| Organizmning ichki holatini sezish Propriotseptiv| Mushaklar, paylar va bo‘g‘imlar| Tana holati va harakatini sezish<\/p>\n<h4>5. Ularning inson hayotidagi ahamiyati<\/h4>\n<p>Ushbu sezgilar inson organizmining normal faoliyat yuritishida muhim ahamiyatga ega:<\/p>\n<ul><li>Eksterotseptiv sezgilar atrof-muhitni bilish va xavflarni aniqlashga yordam beradi.<\/li><li>Interotseptiv sezgilar organizmning ichki ehtiyojlari va holati haqida xabar beradi.<\/li><li>Propriotseptiv sezgilar tana harakatlarini muvofiqlashtirish va muvozanatni saqlashga yordam beradi.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Eksterotseptiv, interotseptiv va propriotseptiv sezgilar axborot manbai va bajaradigan vazifasiga ko‘ra farqlanadi. Eksterotseptiv sezgilar tashqi muhitdan, interotseptiv sezgilar ichki organlardan, propriotseptiv sezgilar esa tana a’zolarining holati va harakatidan axborot beradi. Ularning barchasi insonning atrof-muhit bilan aloqasi va organizm faoliyatining boshqarilishida muhim o‘rin tutadi.<\/p>"}, {"n": 19, "title": "Sezgining absolyut quyi chegarasi va farqlash chegarasi nima?", "html": "<p>Sezgining absolyut quyi chegarasi — inson sezgi organlari orqali sezishi mumkin bo‘lgan eng kuchsiz ta’sir miqdoridir. Ya’ni tashqi muhitdan kelayotgan ta’sirni sezish uchun zarur bo‘lgan eng kam kuchga ega qo‘zg‘atuvchi hisoblanadi.<\/p>\n<p>Masalan, qorong‘i xonada juda xira yorug‘likni ko‘rish, tinch joyda juda past tovushni eshitish yoki havodagi juda kuchsiz hidni sezish absolyut quyi chegaraga misol bo‘ladi. Ta’sir kuchi ushbu chegaradan past bo‘lsa, inson uni sezmasligi mumkin.<\/p>\n<p>Sezgining farqlash chegarasi — ikkita bir-biriga yaqin ta’sir o‘rtasidagi farqni inson sezishi mumkin bo‘lgan eng kichik o‘zgarish miqdoridir. Boshqacha aytganda, inson bir ta’sirning ikkinchisidan ozgina farq qilishini anglay oladigan minimal darajadir.<\/p>\n<p>Masalan, inson qo‘lida 100 gramm og‘irlikdagi yuk turgan bo‘lsa, unga yana ozgina og‘irlik qo‘shilganda farqni sezmasligi mumkin. Ammo ma’lum miqdorda og‘irlik qo‘shilsa, yukning og‘irlashganini sezadi. Bu farqlash chegarasini ko‘rsatadi.<\/p>\n<p>Ularning asosiy farqi<\/p>\n<ul><li>Absolyut quyi chegara — ta’sirni umuman sezish uchun zarur bo‘lgan eng kam miqdor.<\/li><li>Farqlash chegarasi — ikki ta’sir orasidagi farqni sezish uchun zarur bo‘lgan eng kichik o‘zgarish.<\/li><\/ul>\n<h4>Xulosa<\/h4>\n<p>Absolyut quyi chegara insonning sezgi organlari qanchalik kuchsiz ta’sirni qabul qila olishini, farqlash chegarasi esa ta’sirlar o‘rtasidagi kichik farqlarni qanchalik aniqlik bilan ajrata olishini ko‘rsatadi. Har ikkala chegara ham inson sezgirligining muhim ko‘rsatkichlari hisoblanadi.<\/p>"}, {"n": 20, "title": "Sezgilar adaptatsiyasi nima? Misollar keltiring.", "html": "<p>Sezgilar adaptatsiyasi — sezgi organlarining doimiy yoki uzoq vaqt davom etadigan ta’sirga moslashishi natijasida sezgirlik darajasining o‘zgarishidir. Bunda ayrim ta’sirlarga nisbatan sezg
